botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: "# Croqui Pilastras + Pedreira – Poços de Caldas - MG\n\n| ![Croqui\
        \ Pilastras + Pedreira](imagens/capa_p0_i1.webp) |\n| :--: |\n| *Croqui Pilastras\
        \ + Pedreira* |\n\n## Importante:\n\n* Você é responsável pelos seus atos;\n\
        * Esteja consciente que a escalada é um esporte de risco;\n* Este guia não\
        \ tem como base o ensinamento de técnicas de escalada, nem das boas práticas\
        \ do esporte, apenas orientar praticantes já experientes a se localizar nas\
        \ linhas dos setores;\n* Use Capacete, eventuais pedras soltas podem rolar\
        \ do cume, assim como agarras se soltarem;\n* Cuidado com animais peçonhentos;\n\
        * Seja responsável pelo seu LIXO;\n* Contribua para a preservação do Meio\
        \ Ambiente.\n* Cuidado com Abelha, evite fazer barulho e escalar em horários\
        \ de muito sol, elas estão localizadas na segunda pilastra de todos os lados;\
        \ \n* Por se tratar de uma área Urbana e em constante crescimento evite algazarras\
        \ e seja cordial com a vizinhança;\n* Está é uma área muito frágil, cuide\
        \ para que as próximas gerações possam também usufruir deste belo local que\
        \ é tão belo e conta um pouco da história de Poços de Caldas."
- texto: Avisos
  destino:
    secao_textual:
      conteudo: "# Croqui Pilastras + Pedreira – Poços de Caldas - MG\n\n| ![Croqui\
        \ Pilastras + Pedreira](imagens/capa_p0_i1.webp) |\n| :--: |\n| *Croqui Pilastras\
        \ + Pedreira* |\n\n## Importante:\n\n* Você é responsável pelos seus atos;\n\
        * Esteja consciente que a escalada é um esporte de risco;\n* Este guia não\
        \ tem como base o ensinamento de técnicas de escalada, nem das boas práticas\
        \ do esporte, apenas orientar praticantes já experientes a se localizar nas\
        \ linhas dos setores;\n* Use Capacete, eventuais pedras soltas podem rolar\
        \ do cume, assim como agarras se soltarem;\n* Cuidado com animais peçonhentos;\n\
        * Seja responsável pelo seu LIXO;\n* Contribua para a preservação do Meio\
        \ Ambiente.\n* Cuidado com Abelha, evite fazer barulho e escalar em horários\
        \ de muito sol, elas estão localizadas na segunda pilastra de todos os lados;\
        \ \n* Por se tratar de uma área Urbana e em constante crescimento evite algazarras\
        \ e seja cordial com a vizinhança;\n* Está é uma área muito frágil, cuide\
        \ para que as próximas gerações possam também usufruir deste belo local que\
        \ é tão belo e conta um pouco da história de Poços de Caldas."
- texto: Como chegar
  destino:
    secao_textual:
      conteudo: |-
        # Como chegar:

        ## Coordenadas Pilastras
        -21.796521, -46.591156

        ## Coordenadas Estacionamento
        Av. Buenos Aires, 452 - Jardim Novo Mundo
        Poços de Caldas - MG, 37701-367 - -21.793883, -46.589829

        ## Mapa saindo do Parque Municipal de Poços de Caldas

        | ![Mapa de acesso](imagens/como_chegar_p0_i1.webp) |
        | :--: |
        | *Mapa de acesso* |

        Suba a rua a esquerda do parque Country Club (Rua Francisco Jesualdi) ao final dela encontrará a caixa d´água do bairro como da foto a seguir:

        | ![Caixa d'água](imagens/como_chegar_p1_i1.webp) |
        | :--: |
        | *Caixa d'água* |

        Vire a primeira a direita logo após o reservatório (Av. Buenos Aires) e estacione próximo ao número 452 quase ao final da rua:

        | ![Estacionamento e início da trilha](imagens/como_chegar_p1_i2.webp) |
        | :--: |
        | *Estacionamento e início da trilha* |

        A trilha é toda de cascalho sem dificuldades de acesso e locomoção. Após descer o primeiro trecho, vire à esquerda e siga reto, na próxima bifurcação vire à esquerda novamente e já encontrara o primeiro setor, o Vale.
