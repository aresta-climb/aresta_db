            - Bruno Miguéis
            data_abertura: '2013'
            descricao_acesso: 'Lado móvel: Setor dos Paulistas, atrás do totem da
              via Decadentes. Lado estático: topo da via Puberdade no setor mezanino.'
            descricao_ancoragem: Lado estático, duas chapeletas com backup no top
              da via de escalada. Lado móvel 3 chapeletas, longes uma da outra, corda
              para ancoragem grande e muita proteção abrasão.
        - highline:
            nome: Arquibancada
            distancia: 39
            altura: 15
            exposicao: 150
            conquistadores:
            - Reginaldo Gomes
            - Diego Leonardo
            data_abertura: '2017'
            descricao_acesso: 'Lado estático: Trilha setor Aeroshane em cima da via
              Shana Crazy. Lado móvel: Totem na trilha para terceiro andar no inicio
              da subida para o setor Paulistas.'
            descricao_ancoragem: Lado estático e lado móvel 3 chapeletas cada.
        - highline:
            nome: O melhor está por vir
            distancia: 27
            altura: 50
            exposicao: 200
            conquistadores:
            - Caio Afeto
            - Gustavo Fontes
            - Bruno Miguéis
            data_abertura: '2013'
            descricao_acesso: 'Lado estático: Escalar a via mulheres ao poder na garganta
              e após o top da via, derivar para a direita. Lado móvel: Passar pelo
              terceiro Andar e continuar subindo até nivelar com o top da via mulheres
              ao poder.'
            descricao_ancoragem: 'Lado estático: 3 chapeletas. Lado móvel: 4 chapeletas
              distantes uma da outra, levar bastante proteção de abrasão.'
        - highline:
            nome: Figura Pública
            distancia: 75
            altura: 70
            exposicao: 200
            conquistadores:
            - Reginaldo Gomes
            - Diego Leonardo
            - Thiago Vasconcelos
            data_abertura: '2017'
            descricao_acesso: 'Lado estático: Escalar a via De Mão Beijada ate o cume,
              derivando para a direita após o top. Lado móvel: caminhar no interior
              da Garganta ate o final da erosão fluvial, depois virar completamente
              à esquerda no morro da trilha de moto, abandonando a trilha até alcançar
              o topo das vias de escalada e conseguir visualizar as chapeletas no
              alinhamento da outra ancoragem.'
            descricao_ancoragem: Lado estático e móvel, 3 chapeletas cada, necessitando
              bastante proteção de abrasão.
        - highline:
            nome: Visão além do alcance
            distancia: 45
            altura: 50
            conquistadores:
            - Caio Afeto
            - Gustavo Fontes
            - Bruno Miguéis
            data_abertura: '2013'
            descricao_acesso: 'Lado estático: passar pela entrada da garganta e no
              início do setor ensolarado começar uma escalaminhada em direção às ancoragens.
              Lado móvel: Terceiro Andar ao chegar na base da via efeito colateral,
              derivar completamente à esquerda em direção às ancoragens.'
            descricao_ancoragem: 'Lado estático: 4 chapeletas Lado móvel: 3 chapeletas.'
