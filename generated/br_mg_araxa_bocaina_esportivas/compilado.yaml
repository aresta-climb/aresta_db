          | :--: |

          | *Setor Ensolarado* |


          O Setor Ensolarado é um dos setores iniciais do Bocaina Park, caracterizado
          por vias de graduação variada, do 5º ao 9b.


          > [!TIP]

          > Leve seu lixo e outro que encontrar para a cidade. Não faça necessidades
          fisiológicas nas trilhas e base de vias. Avisar a administração sobre a
          abertura de novas vias de escalada. **USE CAPACETE NAS BASES DE VIAS DE
          ESCALADA.**'
