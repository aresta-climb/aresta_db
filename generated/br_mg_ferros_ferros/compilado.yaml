        | *Mapa de satélite de Ferros à Fazenda Retiro das Águas* |'
- texto: Regras
  destino:
    secao_textual:
      conteudo: '# ATENÇÃO!


        Escalada é um esporte de risco! Este guia não capacita o leitor a praticar
        o montanhismo de forma segura. Para tal, procure instrutores qualificados,
        de preferência federados e/ou guias de um clube oficial de montanhismo. Lembre-se:
        Você é responsável pelos seus próprios atos.


        O montanhismo é um esporte de liberdade e tudo o que não precisamos é levar
        as regras e leis da cidade para a montanha. Mas isto só é possível porque
        o montanhista que se define como tal segue dois princípios básicos: proteger
        as montanhas e respeitar os outros que as frequentam.


        Consulte sempre o código de ética vigente no local em que pretende praticar
        o montanhismo e pense antes de cada ato na montanha, refletindo assim os nossos
        ideais no esporte através dos tempos. Não deprede a vegetação, priorize as
        proteções móveis às fixas, evite a equipagem de vias de parede (vindo de cima)
        ou a abertura de vias/variantes que interfiram no traçado de outras existentes
        e seja sempre cortês com os montanhistas, moradores e usuários da região.


        ## Links Úteis


        - CBME (Confederação Brasileira de Montanhismo e Escalada): http://www.cbme.org.br

        - CEM (Centro Excursionista Mineiro): http://www.sitedocem.org.br

        - Tonico (Site pessoal do Tonico Magalhães): http://www.tonicomagalhaes.com.br

        - FEMEMG (Federação de Montanhismo e Escalada de Minas Gerais): http://www.fememg.org

        - FEMERJ (Federação de Montanhismo do Estado do Rio de Janeiro): http://www.femerj.org

        - FEMESP (Federação de Montanhismo do Estado de São Paulo): http://www.femesp.org

        - FEPAM (Federação Paranaense de Montanhismo): http://www.fepampr.org.br

        - ACE (Associação Capixaba de Escalada): http://www.ace-es.org.br/

        - FGM (Federação Gaúcha de Montanhismo): http://www.fgm.org.br

        - FEMECE (Federação de Montanhismo e Escalada do Estado do Ceará): http://www.femece.org.br'
