botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: '# Guia de Escaladas


        ## Ferros / MG


        | ![Capa - Guia de Escaladas Ferros / MG](imagens/capa_p0_i0.webp) |

        | :--: |

        | *Capa - Guia de Escaladas Ferros / MG* |


        **Autores:**

        - Pedro Bugim Ruel Vergnano

        - Antonio Carlos Magalhães

        - Celso José Ferreira Gomes


        **Ano:** 2015'
- texto: Apresentação
  destino:
    secao_textual:
      conteudo: '# Agradecimentos


        À Maria Fernanda Patrício, por suas críticas, incentivo na formulação deste
        guia e pela ajuda inestimável nas conquistas que fizemos juntos.


        Agradecimentos ao amigo Celso Ferreira Gomes, pela elaboração do esboço do
        guia oficial de Ferros, postado no site do Tonico, com informações valiosas
        para que este presente guia fosse formulado, pela contribuição de dados e
        pelo minucioso trabalho de revisão.


        Agradecimentos especiais ao amigo Tonico Magalhães e à esposa Nádia Moreira,
        grande escalador e conquistador, por vossa hospitalidade ímpar nas investidas
        às paredes de Ferros e por vossa contribuição com dados precisos e preciosos
        para a criação deste guia.


        Ao Celso e ao Tonico, meu muito obrigado pelo convite para participar deste
        projeto que, embora muito trabalhoso, está sendo também muito gratificante!


        *Pedro Bugim*


        Ao Centro Excursionista Mineiro, por tão bem congregar o povo da montanha
        de Minas Gerais, tanto os nativos quanto os naturalizados;


        Ao Tonico, amigo de fé e parceiro de mais de cem conquistas;


        Ao amigo Pedro Bugim, uma pessoa verdadeiramente incansável na batalha de
        executar, e bem, o que se propõe a fazer;


        Aos escaladores e escaladoras com quem já tive a satisfação de escalar em
        Ferros, especialmente no Vale do Roncador;


        E às pessoas que, animadas por esse guia, nos venham a dar a satisfação da
        presença.


        *Celso Ferreira Gomes*


        ---


        # Apresentação


        Esse guia apresenta as primeiras 160 vias de escalada implantadas no município
        mineiro de Ferros, ao longo dos últimos nove anos. Chama a atenção o fato
        de que mais da metade dessas vias foi o resultado das conquistas dos últimos
        três anos, o que nos mostra um notável incremento das atividades na área.
        Não obstante, o potencial para novas conquistas nos pontos já regularmente
        frequentados ainda permanece muito elevado, no Vale do Roncador e nas paredes
        vizinhas.


        O Vale do Roncador é a área com paredes que mais se destaca na região. Dominado
        pelo córrego homônimo, tributário do rio Tanque, é ladeado por paredes rochosas
        muito próximas entre si. Na margem esquerda do córrego, ou seja, à direita
        de quem entra no vale, subindo o curso de água, situa-se a Parede Principal
        (Paredes de Aço). No lado oposto, a Parede das Aderências. No momento retratado
        por esse guia, o Vale do Roncador concentra 130 vias de escalada!


        Apresentando vias clássicas em agarras e aderências, vias esportivas e atléticas,
        vias com proteção fixa, móvel e mista, além da paisagem notável cortada pelo
        rio Tanque, o complexo de Ferros é altamente recomendado a todos os tipos
        de escaladores, desde os iniciantes até os mais experientes, desde os de estilo
        eclético e que queiram simplesmente praticar o esporte em geral ou se aprimorar
        na variedade de estilos, até os de estilo mais específico e que, igualmente,
        queiram se dedicar ao seu estilo predileto ou nele se aprimorar.


        Assim, pela variedade e quantidade de vias existentes, pela segura e confortável
        proteção fixa implantada, pela excelente qualidade da rocha, o mineiríssimo
        granitóide Borrachudo, e pela facilidade de acesso às áreas de escalada, Ferros
        apresenta-se hoje como o mais completo polo de escaladas em granito nas imediações
        de Belo Horizonte.


        *Os autores, fevereiro de 2015*'
- texto: Sobre Ferros e História
  destino:
    secao_textual:
      conteudo: '# Sobre Ferros


        Ferros é um município brasileiro localizado no Centro-Leste do Estado de Minas
        Gerais. Sua localização global está situada a 19°13''58 sul e 43°01''20 oeste.
        A população, de acordo com o censo do IBGE de 2010, é de 10.725 habitantes,
        sendo dividida meio-a-meio entre a zona urbana e a rural. Dista cerca de 180
        km da Capital, Belo Horizonte, no sentido nordeste (saída para Vitória - ES)
        seguindo pelo percurso: BR 381, MG 434-129 e BR120.


        A principal atividade econômica do município é a pecuária leiteira e de corte.
        Em férteis pastagens desenvolvidas nas baixas a médias encostas, o gado girolando
        produz o leite que é utilizado para se fazer principalmente o famoso queijo
        do Tipo Sêrro e os requeijões negros, típicos da grande bacia leiteira do
        Leste do Espinhaço.


        Ferros também é portadora de fantásticas jazidas de água marinha. O garimpo
        subterrâneo dessas gemas é uma atividade secular na região.


        ## História


        A região de Ferros era chamada no final do século XVIII por Sertão Proibido.
        Isto se devia ao controle da coroa portuguesa na Estrada-Real entre Diamantina
        e Ouro Preto que proibia o desvio da produção de ouro e diamantes pelo vale
        do Rio Doce visando escapar do pagamento do Quinto. A estrada que acompanha
        a fazenda e o Rio Tanque, onde estão as escaladas, foi então um ramo alternativo
        e clandestino da Estrada-Real naquela época.


        | ![Nova Matriz de Santana – Ferros / MG](imagens/sobre_ferros_e_historia_p0_i0.webp)
        |

        | :--: |

        | *Nova Matriz de Santana – Ferros / MG* |


        Sob a denominação de Santana dos Ferros, surgiu um povoado em função das explorações
        de ouro e diamantes desenvolvidas às margens do rio Santo Antônio, no último
        quartel do século XVIII, tendo como fundadores Pedro Fernandes Alves e José
        Ferreira Santiago, que ali teriam se fixado com o objetivo de minerar. Segundo
        o cônego Raimundo Trindade e o historiador Waldemar Barbosa, o povoado, em
        fins do século XIX, prosperou em razão do incremento das atividades de lavoura
        e pecuária, sendo elevado à vila, com a criação, por lei de 1884, do município,
        emancipando-se do município de Itabira. A elevação da vila à categoria de
        Cidade ocorreu dois anos depois. O nome atual, Ferros, foi adotado em 1923,
        e pode decorrer do processo de mineração então adotado, que, para a retirada
        do cascalho aurífero do fundo do rio Santo Antônio, compreendia o emprego
        de ganchos especiais de ferro. Os desbravadores, ao se espalharem pelas profundezas
        para abrir novas picadas, deixavam suas ferramentas guardadas e, na medida
        em que delas precisavam, recorriam ao depósito, dizendo: "Vamos aos Ferros!".
        Por outro lado, nós acreditamos que a origem do nome Ferros possa estar relacionada
        com os estreitos, porém contínuos, filetes de minério de ferro compacto que
        cortam diversos locais do município e que foram pré-historicamente e historicamente
        utilizados como material para machados arqueológicos (já encontrados nas áreas
        das escaladas) e como primorosa pedra de amolar para foices e facões. Ao longo
        do tempo, Ferros incorporou ao seu território um grande número de distritos,
        assim chamados: Esmeralda de Ferros, Cubas, Sete Cachoeiras, Borba Gato, Santa
        Rita do Rio do Peixe e Santo Antônio. O município possui seu acervo arquitetônico
        bem preservado e conserva prédios remanescentes de seus primeiros tempos,
        como as capelas de São José e Nossa Senhora do Rosário e o sobrado da Praça
        Monsenhor Alípio, que funcionou como Casa de Câmara e Cadeia, passando depois
        a Fórum e Coletoria, e que atualmente funciona como Casa de Câmara, Biblioteca
        Municipal, Agência de Passagens e Associação dos Comerciantes.


        A área das fazendas Retiro das Águas e Roncador, onde estão as escaladas,
        foi palco de ocupação tupi-guarani pré-histórica com datação de cerâmica confirmada
        em 660 anos, isto é, cerca de 150 anos antes do descobrimento do Brasil, remontando
        à idade Média Europeia. Muito tempo depois disso, sabe-se ainda que em meados
        a fins do século XIX as últimas tribos botocudas rebeladas que habitavam Ferros
        e todo o Vale do Rio Doce foram expulsas e mortas pelas forças imperiais e
        teriam sido vistas pela última vez nos Vales do Roncador e Água Limpa.


        Ferros se notabiliza em diversas personalidades importantes. Podemos destacar
        o romancista Roberto Drummond, da mesma família do famoso poeta modernista
        Carlos Drummond de Andrade. As principais obras do Roberto, Hilda Furacão
        e Inês é Morta, dão nome a duas vias maravilhosas e emblemáticas do local.'
- texto: Geografia e Logística
  destino:
    secao_textual:
      conteudo: '# Geografia


        Ferros possui uma expressiva área de 1090 km², englobando a sede e os seis
        distritos que possui. Sua altitude máxima é 1260 m na Serra dos Cocais e a
        altitude mínima é de cerca de 400 m no encontro dos rios Tanque e Santo Antônio.
        O clima é quente e úmido com inverno seco e verão chuvoso. A temperatura média
        anual é de 21°C, com temperaturas mais elevadas entre os meses de agosto a
        março, sendo a máxima 37°C e a mínima 8°C. O período com maior incidência
        de chuvas é de outubro a março, com média anual de 1200 mm. O município tem
        muitas serras, ramificação da Cordilheira do Espinhaço: Santana, Rosário,
        Caçu, Ferreiros, Taquaral, Sapé, Cuité, Bolívia, Cocais, Cumeeiras e outras.


        Segundo dados da Companhia Energética de Minas Gerais (Cemig), a temperatura
        mínima registrada em Ferros foi de 3,6ºC, ocorrida no dia 17 de julho de 2000.
        Já a máxima foi de 37,2ºC, registrada nos dias 16 de novembro de 1985 e 24
        de setembro de 1994. O maior acumulado de chuva registrado na cidade em 24
        horas foi de 186,0 mm, em 20 de fevereiro de 1990.


        ## Vegetação Predominante


        O município de Ferros apresenta cerca de 60% de sua superfície coberta por
        matas e formações naturais, localizadas preferencialmente em encostas e topos
        de morros e 5% de área ocupada por reflorestamento de eucalipto, notadamente
        da Cenibra. Por ter uma topografia acidentada em geral, as férteis baixadas
        junto aos rios normalmente foram ocupadas pelas habitações e pelas plantações
        há séculos, inclusive pelas populações pré-históricas que lá existiram e plantavam
        mandioca, milho, feijão, inhame e batata-doce.


        Apresenta normalmente uma floresta estacional semi-caduca típica das altas
        porções da bacia do Rio Doce, podendo ser considerada como uma mata atlântica
        com leves influências da caatinga e dos cerrados. As matas da região, normalmente
        de porte médio, possuem expressivas quantidades de braúna, vinhático, garapa,
        jatobá, angico, saltamartin, grão-de-galo, sucupira, peroba, moreira, jacaré,
        etc. É muito comum nas matas de Ferros a presença de jaboticabeiras e diversos
        tipos de mandiocas e abacaxis nativos.


        ## Fauna


        Em função da bem preservada cobertura florestal de Ferros e da baixíssima
        densidade populacional, a presença da fauna é consideravelmente rica. Têm
        sido relatadas observações de diversos felinos, incluindo onças e gatos mouriscos
        em várias regiões do município, inclusive no Vale do Roncador onde estão as
        escaladas. Ao longo dos principais rios podem ser encontrados bandos de capivara.
        Diversos macacos têm sido vistos, inclusive enormes grupos no vale das escaladas.
        Outros relatos envolvem lobo guará, raposas, tatu, paca, veado, lontra, porcos
        do mato, jacu, sagüi-de-cara-branca, etc. Nos rios a fauna é também abundante
        tendo sido descritos piaus, traíras, bagres, etc. No rio Tanque, que banha
        a fazenda onde estão as escaladas, pesquisas indicaram uma espécie endêmica
        chamada de Cachara, um tipo de surubim pequeno com uma cabeça enorme.


        ## Hidrografia


        A rede fluvial do município é densa, rica em pequenos e médios cursos de água,
        favorecendo assim uma maior divisão de propriedades e fartura hídrica.


        O principal rio é o Santo Antônio, que corta a sede, e correndo para o leste,
        depois de um percurso de 283 km, vai despejar suas águas no rio Doce já no
        Vale do Aço. No município de Ferros, o rio Santo Antônio ainda recebe as águas
        do rio Tanque e rio do Peixe. Faz parte da bacia hidrográfica do rio Doce
        e tem suas abundantes nascentes principais localizadas na Serra do Espinhaço
        nos subsetores Serra do Cipó e Serra do Itambé. As sub bacias dos rios Santo
        Antônio e Tanque são consideradas as de melhor qualidade de água de todo o
        vale do Rio Doce.


        | ![O Rio Tanque e a praia em sua margem](imagens/geografia_e_logistica_p1_i1.webp)
        |

        | :--: |

        | *O Rio Tanque e a praia em sua margem* |


        O córrego Roncador que domina o vale das escaladas, pode ser considerado uma
        manancial de altíssima capacidade. Do vale das escaladas, com uma área de
        apenas 2,5 quilômetros quadrados, escorre uma surpreendente vazão média de
        cerca de 50 litros por segundo. A razão disso é que o eixo do vale é coincidente
        com uma importante falha geológica, ainda ativa, por onde ascende tão rico
        aquífero. É farta a água para consumo nas escaladas e para o banho refrescante
        ao final.


        ## Região das Escaladas


        O complexo de vias de escalada de Ferros situa-se nas Fazendas Roncador e
        Retiro das Águas, de propriedade do montanhista (detentor de mais de 460 conquistas
        em sua carreira e conquistador da maioria das vias em Ferros) Antonio Carlos
        Magalhães (Tonico).


        As escaladas em Ferros foram iniciadas após a pioneira conquista da via “Iron
        Men” (4º V – 130 metros), pelo Tonico, seu filho Juliano Magalhães e Marcos
        Leiras, em 26 de fevereiro de 2006, na chamada Parede Principal, a qual se
        tornaria a parede com maior concentração de vias longas do local.


        Além de relativa proximidade ao centro de Belo Horizonte (aproximadamente
        3 horas de carro), este polo de escaladas impressiona pelo enorme potencial,
        com paredes de todos os estilos e tamanhos, apresentando vias longas, curtas,
        de aderência, agarras, negativos, fendas, proteções fixas e móveis, graduações
        das mais simplórias até vias complexas de alta graduação, etc.


        Nos diversos setores da região, é possível fazer escaladas curtas para treinar
        lances sejam atléticos, ou de puro equilíbrio, ou entrar em vias longas, com
        mais de quatro enfiadas de corda, testando assim o psicológico e a resistência
        do escalador.


        Além das inúmeras possibilidades de escalada, a região conta com agradável
        rio Tanque, com suas águas cálidas (26 a 28 graus) para banho após as atividades,
        bem como locais estratégicos de camping, como as próprias praias à beira rio.


        Água potável é encontrada em abundância, notadamente ao longo de todo o vale
        do Roncador, que é cortado pelo córrego de mesmo nome, suprindo os excursionistas
        de água fresca bem próximo às bases.'
- texto: Como Chegar
  destino:
    secao_textual:
      conteudo: '# Como Chegar


        Localização no Google Maps: https://maps.app.goo.gl/hGmJWp5oT1wnXpsG7


        ## De Carro


        Saindo de BH, pegue a BR-262 em direção à Vitória. Vire à esquerda no trevo
        entre Vitória e Itabira, direção Itabira. Mais adiante, no trevo entre Itabira
        e Santa Maria do Itabira, pegue à direita, em direção a esta última cidade.
        No antigo bar “Parada Certa”, que fica a cerca de 20 km de Santa Maria do
        Itabira, pode-se seguir pelo asfalto em direção ao trevo de Ferros, ou pegar
        um caminho mais curto, com mais estrada de terra, evitando passar pela cidade.
        Do centro de Ferros até a área de escaladas, siga o mapa na próxima página.
        O trajeto total possui cerca de 190 quilômetros, feitos em aproximadamente
        3 horas.


        ## De Ônibus


        Pegar o ônibus da viação SARITUR, na rodoviária de BH, com destino a Ferros
        (valor em fevereiro de 2015: R$54,20). A viagem dura em torno de quatro horas.


        Chegando em Ferros, é fácil conseguir um táxi com corrida combinada, por aproximadamente
        R$40,00, para percorrer os 11 Km do centro da cidade à área propícia para
        camping, próxima à base das escaladas. Lembre-se de combinar com o taxista
        a corrida de retorno!


        | ![Mapa de BH para Ferros](imagens/como_chegar_p0_i0.webp) |

        | :--: |

        | *Mapa de BH para Ferros* |


        | ![Mapa de BH para Fazenda Retiro das Águas](imagens/mapas_gerais_p1_i1.webp)
        |

        | :--: |

        | *Mapa de BH para Fazenda Retiro das Águas* |


        | ![Mapa de satélite de Ferros à Fazenda Retiro das Águas](imagens/mapas_gerais_p2_i1.webp)
        |

