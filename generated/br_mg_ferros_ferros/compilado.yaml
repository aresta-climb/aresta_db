                descricao: 'Via que segue uma linha natural, sempre com boa proteção
                  e paradas duplas. Rapel com corda única de 50m. Inicialmente, possuía
                  apenas 40 metros, sendo posteriormente complementada. Nota: no guia
                  original a via está com o croqui incompleto, mostrando apenas a
                  linha da via.

                  '
            - via_multiplas_enfiadas:
                nome: Pescoço de Minhoca
                dificuldade_media: BR_4
                dificuldade_maxima: BR_4
                exposicao: E1
