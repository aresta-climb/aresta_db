                  a guiar, sobretudo, para treinar como “garimpar” as proteções móveis
                  (peças pequenas e médias).
            descricao: '# Parede das Aderências – Extrema Direita


              Paredão rochoso com potencial para novas vias, contando, no momento,
              com apenas quatro linhas completas.


              A caminhada até a base para as duas vias da esquerda (“Bolo de Cenoura”
              e “51, Uma Boa Ideia”) é praticamente a mesma para acessar as vias do
              Setor das Clássicas Longas (na Parede Principal), apresentando cerca
              de dois quilômetros desde a sede da fazenda. Após passar pela bifurcação
              para a direita, que sobe para a Parede Principal, continue pela trilha
              principal e pegue a bifurcação à esquerda. É necessário cruzar o córrego
              localizado em frente à subida para o setor esquerdo da Parede Principal,
              um pouco antes de um pequeno curral existente.


              Uma boa dica é que este ponto de cruzamento do rio é bem próximo à junção
              do córrego que vem da trilha da direita com o córrego principal. Outra
              boa referência é a trilha para a direita para o setor das Clássicas
              Longas, que se inicia contornando o bambuzal pela esquerda. Ultrapassado
              o córrego, deve-se subir por cerca de 50 metros entre a mata, bem à
              direta de um leito seco de um pequeno grotão, e se chegará à parede.


              O acesso à base das vias da direita (“Mais Chuva Que Sol” e “Só a Cabecinha”)
              pode ser feito de duas formas: (I) acessar a parede pela picada até
              a “Bolo de Cenoura”, subir a encosta e acessar o primeiro grampo da
              via “51, Uma Boa Ideia” e, a partir daí, rapelar até a base das vias
              em uma diagonal para a direita; ou (II) continuar seguindo a trilha
              principal até o ponto onde aparece uma porteira de um pequeno curral.
              Deste ponto, deve-se descer até o córrego à esquerda em direção ao início
              de um bambuzal, onde pode-se avistar um grotão seco onde se inicia a
              trilha que dá acesso à parede. A trilha segue por cerca de 50 metros,
              inicialmente pelo grotão e em seguida subindo para a esquerda até encostar
              na pedra. Os primeiros grampos das vias ficam logo a vista.


              A trilha pode não estar muito bem definida devido à pouca frequência
              atual neste setor.


              | ![Ricardo Barros na conquista da “Mais Chuva Que Sol” (Foto: Pedro
              Bugim)](imagens/grupo_aderencias_setor_extrema_direita_p3_i0.webp) |

              | :--: |

              | *Ricardo Barros na conquista da “Mais Chuva Que Sol” (Foto: Pedro
              Bugim)* |'
            precomputados:
              total_escaladas: 4
              total_multiplas_enfiadas: 4
        descricao: '# A Parede das Aderências


          Ao entrar no vale do Roncador, o excursionista terá à sua esquerda a Parede
          das Aderências, de dimensões mais reduzidas do que a Parede Principal e
          com vias predominantemente em aderência - como o próprio nome sugere – variando
          de 20 a 230 metros de extensão.


          As vias mais longas apresentam grau geral 3º, à exceção da via “Solamente”,
          paredão com 120 metros, em 1º II, conquistada em solo integral pelo Tonico.
          Os graus específicos mais frequentes ficam entre IV e V (crux), havendo
          uma via curta de VIIa (“Ferro na Boneca” – 20m) e outra mista, em VI (“O
          Psicopata de Ferros”).


          Dentre suas vias, destacam-se a “Cordeiro de Deus” (V – 60m), “O Psicopata
          de Ferros” (4° VI E2 D1 – 70m – Mista), “Cinquentona de Ferros” (IIIsup
          – 60m), “Grampos de Ferros” (3º IVsup – 110m) e “Social Club” (3º IIIsup
          – 200m), vias que, em seu conjunto, permitem um bom conhecimento desse trecho
          do vale.


          Este setor é imperdível para aqueles que apreciam a técnica de aderência,
          bem como aos que estão necessitando de treino na referida. Apesar das poucas
          agarras, a aderência da pedra é impressionante, conferindo muita confiança
          ao escalador.


          Curiosamente, algumas destas vias possuem também proteções mistas, ou seja,
          intercalando grampos fixos e materiais móveis.'
