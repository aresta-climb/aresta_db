                - Pedro Bugim
                - Tonico Magalhães
                - Celso Ferreira Gomes
                - José Roberto "Dagó" Cardoso
                - Glesse Gripp
                - Viviane
                - Maria Fernanda Patrício
                - Omar Freire
                - Giba Pascoal
                - Gresce Melo
                - Giselle Melo
                data_abertura: '2014-04-03'
                descricao: Via conquistada em homenagem ao Centro Excursionista Mineiro
                  (CEM), tendo inclusive a participação de vários sócios e colaboradores.
                  Segue uma bela linha natural que corta um trecho extenso da parede
                  principal, variando entre aderência e agarras bem definidas, com
                  setores de boa verticalidade, apesar do grau mediano. Une-se a isto,
                  uma proteção bastante generosa, conferindo aos montanhistas uma
                  escalada agradável e divertida. Paradas duplas a, no máximo, cada
                  50 metros. Rapel possível de qualquer ponto da via, com corda única
                  de 50m.
            - via_esportiva:
                nome: Vr. SEM
                dificuldade: BR_6SUP
                exposicao: E1
                extensao: 30
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2014-03-03'
                descricao: Variante da última enfiada do Paredão CEM, que passa por
                  um grande buraco na parede, seguido de um lance negativo, onde encontra-se
                  o crux da variante. Lance forte, mas bem protegido, que une agarras
                  grandes com bom domínio e equilíbrio. Termina em conjunto com a
                  parada final do Pr. CEM.
