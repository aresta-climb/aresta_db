            dificuldade: BR_2
            extensao: 25
            protecoes_moveis: Fissura (conquistada em solo integral)
            conquistadores:
            - Tonico Magalhães
            - Celso Ferreira Gomes
            data_abertura: '2010-02-16'
            descricao: Via conquistada em solo integral, não possuindo proteções fixas.
              A descida é feita por trilha ao lado direito da falésia, ou pela via
              “Ferrugem”, à esquerda. Inicia em uma fissura óbvia e segue a linha
              natural da pedra até o topo.
        descricao: '# Subsetor Cachoeira


          O Subsetor Cachoeira, próximo à Cachoeira do Córrego Sapé, conta com apenas
          quatro vias, ideais para os primeiros contatos com a escalada em rocha,
          em particular, para as vias tradicionais, com pouca inclinação e muita aderência.


          A base destas vias fica a cinco minutos da sede da fazenda Retiro das Águas,
          na lateral direita da estrada de terra, ainda acessível por automóveis,
          logo após uma pequena casa sem uso no lado esquerdo da mesma.


          Este setor, apesar de curto e com lances simples, por ficar no sol o dia
          quase todo, apresenta uma parede bastante quente (como indica o nome de
          duas das vias), sendo ideal para escaladas pela parte inicial da manhã,
          ou ao final da tarde.


          | ![Maria Fernanda na conquista da “Pé na Chapa” (Foto: Pedro Bugim)](imagens/setor_cachoeira_p2_i0.webp)
          |

          | :--: |

          | *Maria Fernanda na conquista da “Pé na Chapa” (Foto: Pedro Bugim)* |'
        precomputados:
          total_escaladas: 4
          total_esportivas: 3
