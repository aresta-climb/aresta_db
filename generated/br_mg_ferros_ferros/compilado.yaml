        descricao: Pequena parede apropriada à modalidade solo, que conta com quatro
          vias de 12 a 18 metros, graduadas de II a IIIsup. Possui um grampo de ½
          polegada no topo da pedra para a escalada em *top-rope*, batido imediatamente
          após as conquistas de outubro de 2010. As vias são do tipo *escalada clássica*,
          apesar de curtas, combinando agarras e aderências, sendo a volta à base
          feita por caminhada. A aptidão à escalada solo deve-se ao fato dos lances
          mais difíceis estarem nas primeiras passadas, ainda em pequena altura. Existe
          um grampo para proteção dos lances iniciais, caso o escalador queira fazê-los
          com corda.
