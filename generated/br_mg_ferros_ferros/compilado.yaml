                descricao: 'Via mista, equipada com 9 grampos de ½, mais 2 “emprestados”
                  da “Zé Marta”, onde termina. Possui em seu início um diedro, protegido
                  em móvel, logo após o lance inicial protegido por um grampo.

                  '
