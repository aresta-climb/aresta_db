            - Tonico Magalhães
            - Nádia Moreira
            data_abertura: '2007-04-08'
            descricao: Via com boa grampeação, até atingir o topo da falésia, onde
              existe uma parada dupla. Ótima opção para o primeiro contato com o esporte,
              ou para quem está começando a guiar, perfeita para ensinar técnicas
              de posicionamento, equalização e costuras, sem preocupação com a parte
              técnica em si. Rapel / top-rope em corda única de 60m.
