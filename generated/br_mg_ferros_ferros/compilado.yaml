                data_abertura: '2012-09-08'
                descricao: Via protegida com chapeletas, contando com chapeletas com
                  argola nas paradas, para o rapel. P1 aos 55m (3° IIIsup) e P2 aos
                  25m (IIIsup/II).
            - via_movel:
                nome: Facão Foi-se
                dificuldade: BR_4SUP
                exposicao: E1
                extensao: 60
                quantidade_protecoes_parada: 2
                protecoes_moveis: Friends pequenos e médios para a fenda inicial
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2014-03-04'
                descricao: Inicia em uma bonita fenda, feita em oposição e depois
                  na vertical, para atingir o primeiro grampo da via. Esta sequência
                  inicial pode ser protegida com friends pequenos e médios, mas também
                  é possível fazer a via sem proteções móveis, aumentando o grau de
                  exposição de E1 para E2 (o primeiro grampo fica alto). Depois, segue
                  em agarras e aderência até seu final, com boa regularidade na graduação.
