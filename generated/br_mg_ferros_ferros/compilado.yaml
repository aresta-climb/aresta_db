                dificuldade_maxima: BR_3SUP
                numero_enfiadas: 2
                comprimento_total: 75
                conquistadores:
                - Tonico Magalhães
                - Celso Ferreira Gomes
                data_abertura: '2012-02-18'
                descricao: Via que se inicia em um diedro cego com proteção fixa,
                  que pode ser melhorada com proteções precárias em móvel (peças pequenas),
                  mas nada obrigatório. Sua segunda enfiada junta com a via “Balzac”.
                  Rapel possível com corda simples de 50m.
            - via_multiplas_enfiadas:
                nome: Balzac
                destaque: true
                dificuldade_media: BR_3
                dificuldade_maxima: BR_4SUP
                numero_enfiadas: 2
                comprimento_total: 90
                conquistadores:
                - Tonico Magalhães
                - Júlio César Cardoso
                data_abertura: '2007-03-04'
                descricao: Via que possui passadas relativamente mais delicadas que
                  as suas vizinhas, contando com duas enfiadas. Rapel possível com
                  corda simples de 50m. Trata-se de via mestra do local.
            - via_esportiva:
                nome: Dez Fora
                dificuldade: BR_5SUP
                extensao: 30
                conquistadores:
                - Aloysio Carvalho
                - Igor Murta
                - Carlim Kamicad
                data_abertura: '2012-04-08'
                descricao: Via equipada com corda de cima, a partir da “Cordeiro de
                  Deus”. Falta o primeiro grampo.
            - via_multiplas_enfiadas:
                nome: Cordeiro de Deus
                dificuldade_media: BR_3
                dificuldade_maxima: BR_5
                comprimento_total: 70
                quantidade_costuras_intermediarias: 12
                conquistadores:
                - Tonico Magalhães
                - Paulo Bandeira
                data_abertura: '2007-09-08'
                descricao: Bonita e técnica via em aderência com 12 grampos. Rapel
                  com corda simples de 50m. Termina na Balzac.
            - via_esportiva:
                nome: Cinquentona de Ferros
                dificuldade: BR_3SUP
                extensao: 60
                conquistadores:
                - Tonico Magalhães
                - Daniel Maia
                data_abertura: '2009-08-02'
                descricao: Quinquagésima conquista da região. Inicia em um diedro
                  em oposição seguindo em aderência até o final. Rapel com corda simples
                  de 50m.
            - via_multiplas_enfiadas:
                nome: Coração Valente
                dificuldade_media: BR_3
                dificuldade_maxima: BR_3SUP
                exposicao: E2
                duracao: D1
                numero_enfiadas: 3
                comprimento_total: 140
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2012-04-06'
                descricao: Boa via em aderência, sempre constante, mas sem lances
                  complicados e com proteção regular. Termina no penúltimo grampo
                  da “Expo CERJ!”. Via em homenagem ao pequeno Arthur Taveira, que
                  aos dois meses de idade, venceu uma dura batalha após ser diagnosticado
                  com sério problema cardíaco.
            - via_multiplas_enfiadas:
                nome: Expo CERJ!
                dificuldade_media: BR_3
                dificuldade_maxima: BR_3SUP
                exposicao: E4
                duracao: D1
                numero_enfiadas: 3
                comprimento_total: 160
                conquistadores:
                - Pedro Bugim
                - Gustavo "Xaxá" Carrozzino
                - Maria Fernanda Patrício
                data_abertura: '2012-01-21'
                descricao: Via com passadas muito interessantes em aderência, com
                  grampeação longa. Ótima para treinamento de psicológico. Rapel possível
                  com uma corda de 60m (de grampo em grampo) ou duas cordas de 50m
                  ou maiores. O rapel pode ser feito também pela via “Coração Valente”,
                  com corda única de 50m. Via em homenagem aos 73 anos do Centro Excursionista
                  Rio de Janeiro (CERJ), completados no dia anterior à conquista.
            - via_multiplas_enfiadas:
                nome: Social Club
                destaque: true
                dificuldade_media: BR_3
                dificuldade_maxima: BR_3SUP
                exposicao: E2
                comprimento_total: 200
                conquistadores:
                - Tonico Magalhães
                - Rodrigo Magalhães
                - Nádia Moreira
                data_abertura: '2006-06-11'
                descricao: Uma das vias mais recomendadas da região! São 200 metros
                  em aderência com dificuldade moderada, porém constante, tendo raros
                  lances abaixo do 3° grau. O fato da via não diminuir sua dificuldade
                  ao longo de sua extensão, confere um justo mérito ao escalador.
                  Via boa para ver o pôr do sol em seu final.
            - via_multiplas_enfiadas:
                nome: Pr. Tonico Magalhães
                dificuldade_media: BR_3
                dificuldade_maxima: BR_4
                exposicao: E2
                numero_enfiadas: 3
                comprimento_total: 120
                conquistadores:
                - Pedro Bugim
                - Celso Ferreira Gomes
                - Maria Fernanda Patrício
                data_abertura: '2012-06-17'
                descricao: Via bastante interessante, com lances predominantemente
                  em aderência, porém com algumas cristaleiras e abaulados que marcam
                  o caminho natural da linha. Seu crux encontra-se na primeira metade
                  da via, logo na barriga inicial, sempre com boa proteção fixa. Para
                  efeito de curiosidade, foi a centésima conquista do Celso, companheiro
                  do Tonico quando da conquista de sua centésima via.
            - via_multiplas_enfiadas:
                nome: E o Rio Levou
                dificuldade_media: BR_3
                dificuldade_maxima: BR_4
                exposicao: E2
                numero_enfiadas: 3
                comprimento_total: 140
                equipamento_recomendado: Friends médios (opcionais)
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2014-03-02'
                descricao: Inicia imediatamente à direita da base da “Tonico Magalhães”,
                  dando uma guinada à direita após o segundo grampo, onde cruza com
                  uma sequência de lacas que podem ser protegidas opcionalmente por
                  friends médios. Deste ponto em diante, segue o bonito crux da via,
                  em uma parede com boa verticalidade e regletes bem definidos, até
                  a P1. Da P1 em diante, a via segue por incríveis “corcovas” na pedra,
                  até sua segunda parada. A enfiada final é feita em aderência.
            descricao: '# Parede das Aderências – Face Central


              A parede central das aderências concentra a maioria das vias longas
              deste lado do vale, com linhas de até 200 metros.


              Como o próprio nome sugere, a maioria esmagadora das vias neste setor
              são predominantemente em aderência, com poucas agarras e buracos, porém,
              o abrasivo granito confere ao escalador uma ótima confiança nos pés.


              O acesso às bases é realizado pela trilha principal do Vale do Roncador,
              passando pelo setor das Aderências – Esquerda e seguindo por mais aproximadamente
              200 metros. A trilha para as bases encontra-se imediatamente antes da
              segunda travessia do córrego, à esquerda (de quem está entrando no vale).
              Neste ponto, é possível também, recarregar os cantis de água, antes
              e após as escaladas.


              | ![Celso e Tonico na conquista da “Elementar, Meu Caro Watson!” (Foto:
              Pedro Bugim)](imagens/grupo_aderencias_setor_face_central_p0_i1.webp)
              |

              | :--: |

              | *Celso e Tonico na conquista da “Elementar, Meu Caro Watson!” (Foto:
              Pedro Bugim)* |


              A trilha sobe por poucos metros e chega à base das vias “Cordeiro de
              Deus” e “Cinquentona de Ferros”. Para acessar as bases das vias adjacentes,
              basta costear a parede, para a esquerda ou direita, seguindo sempre
              pela picada bem definida.


              Para as vias entre a “Vr. Esquibunda” e “Pavão Misterioso”, a trilha
              começa cerca de 50 metros antes da travessia do córrego, à esquerda,
              onde possui um totem de pedra indicando a entrada da picada.


