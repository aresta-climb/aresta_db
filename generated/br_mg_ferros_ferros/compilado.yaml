                data_abertura: '2011-12-09'
                descricao: Inicia em lances mais fáceis, evoluindo para passadas em
                  aderência mais delicada. Termina abaixo de um grande teto, coberto
                  por vegetação.
            - via_esportiva:
                nome: Pelinha
                dificuldade: BR_2
