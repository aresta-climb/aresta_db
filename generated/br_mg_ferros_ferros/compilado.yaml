                descricao: 'Via interessante que se inicia em um veio de cristal.
                  Possui uma extensão surpreendente o que a tornou uma linha mestra
                  do local. Toda equipada com grampos. Homenageia o sogro do Tonico
                  Magalhães que é o supervisor da fazenda.

                  '
