                - Vivianne Sawczuk
                data_abertura: '2015-09-05'
                descricao: Via em agarras e aderência, bem constante do início ao
                  fim, com proteção fixa bem justa.
            - via_multiplas_enfiadas:
                nome: Tanto Bate Até Que Fura
                dificuldade_media: BR_6
                dificuldade_maxima: BR_7A
                exposicao: E1
                duracao: D1
                comprimento_total: 65
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Pedro Bugim
                - Vivianne Sawczuk
                data_abertura: '2015-09-07'
                descricao: Via muito interessante, bastante técnica, toda protegida
                  em chapeletas (chapeletas com argola estão posicionadas de tempos
                  em tempos para eventual rapel e parada). Sua primeira metade é mais
                  complexa, feita basicamente em micro agarras e aderência. Sua segunda
                  metade, mais vertical, possui lances de domínio e muitos abaulados.
                  Termina na primeira parada da "Trem de Ferro", por onde pode-se
                  rapelar em grampos.
            - via_multiplas_enfiadas:
                nome: Trem de Ferro
                dificuldade_media: BR_3
                dificuldade_maxima: BR_5
                exposicao: E2
                duracao: D1
                comprimento_total: 80
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Juliano Magalhães
                - Luciano Bender
                - Tonico Magalhães
                data_abertura: '2012-07-24'
                descricao: Localiza-se logo à esquerda da Up Ester, no ponto mais
                  alto das bases das vias naquele local. Possui 19 grampos de 1/2".
                  A bela sequência vertical no meio da via é o crux. Não a perca!
            - via_multiplas_enfiadas:
                nome: Up Ester
                dificuldade_media: BR_5
                dificuldade_maxima: BR_5SUP
                exposicao: E1
                duracao: D1
                comprimento_total: 100
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: TODA_FIXA
                equipamento_recomendado: 'Camalots #0.5 e #0.75 (friends pequenos
                  opcionais na primeira enfiada).'
                conquistadores:
                - Pedro Bugim
                - Gustavo "Xaxá" Carrozzino
                - Milson Domingues
                data_abertura: '2012-06-16'
                descricao: Via com boa verticalidade, passando por cristaleiras e
                  abaulados incríveis. É possível melhorar a proteção na primeira
                  enfiada com friends pequenos, mas não são obrigatórios. Conquista
                  feita em homenagem à grande escaladora carioca Ester Binstok, falecida
                  precocemente aos 33 anos de idade.
            - via_multiplas_enfiadas:
                nome: Até Que a Vida Nos Separe
                destaque: true
                dificuldade_media: BR_3
                dificuldade_maxima: BR_4SUP
                exposicao: E1
                comprimento_total: 120
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2015-02-15'
                descricao: Bonita via, que inicia em lances mais tranquilos, ganhando
                  verticalidade na parte superior. Lances em agarras generosas e algumas
                  passadas mais técnicas em aderência. Termina junto com o final da
                  "Vr. SEM". Atualmente, é a via mais acessível da parede, por sua
                  graduação pouco elevada e proteção generosa.
            - via_multiplas_enfiadas:
                nome: Vr. Pilhado
                dificuldade_media: BR_3
                dificuldade_maxima: BR_5SUP
                exposicao: E3
                comprimento_total: 70
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: MISTA
                equipamento_recomendado: 'Friend médio / Camalot #1 (em um buraco
                  na primeira enfiada).'
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2015-02-15'
                descricao: Variante da via anterior. Inicia com uma passada em móvel,
                  utilizando um friend médio em um buraco. Continua em lances um pouco
                  expostos, apesar de fáceis, em proteção fixa. Após a primeira parada,
                  existe o lance mais interessante da via, com proteção mais generosa,
                  no qual se vence uma bonita barriga bem vertical e levemente negativa,
                  com ótimas agarras e regletes. Pode-se continuar para a esquerda,
                  juntando na P1 da "Até que a Vida Nos Separe", ou seguir pela direita,
                  na P2 do "Pr. CEM".
            - via_multiplas_enfiadas:
                nome: Pr. CEM
                destaque: true
