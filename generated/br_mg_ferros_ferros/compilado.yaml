            descricao: 'Atualmente, a única via da parede, e maior via da região de
              Ferros, contando com 405 metros de parede. Foi conquistada em três investidas
              com participantes distintos, demorando cerca de quatro anos para ser
              finalizada:

              por Luciano Bender, Gustavo "Xaxá" Carrozino, Celso Ferreira Gomes e
              Tonico Magalhães em 22/04/2011 (Base à P2);

              por Tiago "Fox" Bastos, Elton Soares, Rodrigo Tinoco e Alexandre Mesquita
              em 07/09/2012 (P2 à P3);

              por Pedro Bugim e Vivianne Sawczuk em 06/09/2015 (P3 à P8).

              Corta toda a parede frontal principal, seguindo uma linha bem natural
              e sem lances muito complicados. Predomina a aderência, e, em alguns
              lances, agarras abauladas. Proteção predominante em grampos de ½, possuindo
              algumas chapeletas na enfiada final. Nesta última enfiada, é possível
              rapelar de chapas com argola, colocadas a cada 25 metros. Rapel possível
              com corda de 60m, sendo recomendado a utilização de duas cordas de 60.

              '
