                descricao: Via feita em três enfiadas curtas, seguindo uma exigente
                  sequência buracos, com algumas passagens negativas. Ótima opção
                  no setor, servindo inclusive, como variante da via "Jardim do Éden".
            - via_multiplas_enfiadas:
                nome: Conquista do Paraíso
                destaque: true
                dificuldade_media: BR_6
                dificuldade_maxima: BR_7A
                comprimento_total: 165
                numero_enfiadas: 3
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Tonico Magalhães
                - Eustáquio Júnior
                - Gustavo "Xaxá" Carrozzino
                - Juliano Magalhães
                - Luciano Bender
                data_abertura: '2011-09-06'
                descricao: Via forte e complexa, porém muito bem protegida. Ótima
                  opção neste setor. Rapel com corda única de 60m. Três lances de
                  VIIa obrigatórios. Juntamente com a Jardim do Éden, forma o conjunto
                  atual do pólo que pode ser considerado como tipo esportivas longas.
            - via_multiplas_enfiadas:
                nome: Purgatório
                destaque: true
                dificuldade_media: BR_6
                dificuldade_maxima: BR_8B
                exposicao: E2
                comprimento_total: 120
                numero_enfiadas: 3
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Juliano Magalhães
                - Luciano Bender
                data_abertura: '2013-07-24'
                descricao: Via iniciada em 2011, que conta com 32 grampos. A primeira
                  enfiada é técnica, com belas agarras e bastante vertical, a segunda
                  é atlética/esportiva e a última em aderências e abaulados. Imperdível!
            - via_movel:
                nome: Arco de Ferros
                dificuldade: BR_7A
                exposicao: E2
                extensao: 50
                protecoes_moveis: Peças pequenas e médias.
                conquistadores:
                - Gustavo Piancastelli
                - Eustáquio Júnior
                - Celso Ferreira Gomes
                data_abertura: '2012-06-16'
                descricao: Via com boas passadas em móvel, sempre em diagonal para
                  a esquerda, cruzando a "Purgatório" e juntando na "Conquista do
                  Paraíso". Leve peças pequenas e médias. O nome da via é em alusão
                  ao grande arco negativo formado pela fenda por onde a linha passa.
            - via_multiplas_enfiadas:
                nome: Pr. Conrado Ferro
                destaque: true
                dificuldade_media: BR_7A
                dificuldade_maxima: BR_8C
                exposicao: E2
                comprimento_total: 120
                numero_enfiadas: 2
                quantidade_costuras_intermediarias: 18
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Juliano Magalhães
                - Luciano Bender
                data_abertura: '2013-07-23'
                descricao: Via bastante vertical e considerada um raro exemplo de
                  escalada ESPORTIVA LONGA. Trata-se da escalada mais difícil do Vale
                  do Roncador até agora. Necessárias 18 costuras, caso se deseje fazer
                  a primeira enfiada completa. O nome da via é uma homenagem pelo
                  quinto aniversário do filho de Luciano Bender, na data da conquista.
                  31 grampos de ½. Um grande e empolgante desafio aos escaladores
                  esportivos.
            - via_multiplas_enfiadas:
                nome: Quem com Ferro Fere
                dificuldade_media: BR_5
                dificuldade_maxima: BR_5
                exposicao: E1
                duracao: D1
