                  grampos de ½.
            - via_movel:
                nome: Rapidinha no Escurinho
                dificuldade: BR_4
                exposicao: E1
                extensao: 50
                quantidade_protecoes_parada: 2
                protecoes_moveis: Peças pequenas (passada em móvel não obrigatória)
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                - Gustavo "Xaxá" Carrozzino
                - Tássia Carrozzino
                data_abertura: '2012-01-21'
                descricao: Via conquistada em pouco mais de 10 minutos, já à noite!
                  Possui passadas constantes de 4º grau, com grampeação justa e uma
                  passada em móvel, com peças pequenas. A passada em móvel não é obrigatória,
                  por estar já bem alta, sem risco de queda na base, contudo, uma
                  queda neste ponto pode dar um bom susto.
            - via_esportiva:
                nome: Pelanca
