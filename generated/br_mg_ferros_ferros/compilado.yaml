                descricao: Via maravilhosa iniciada em lances fortes, em sequência
                  bastante vertical, com alguns trechos negativos. Proteção fixa generosa
                  em toda extensão da via. Rapel possível com uma corda de 50m. Dois
                  lances de VIIa obrigatórios.
