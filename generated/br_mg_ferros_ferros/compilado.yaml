            descricao: '# Parede das Aderências – Setor de Cima


              Trata-se da continuação da Parede das Aderências – Setor Central, seguindo
              para um setor mais elevado, com parede levemente mais vertical, contando
              com apenas três vias e com boas possibilidades de novas conquistas,
              sobretudo, seguindo-se para a direita.


              O acesso às bases é realizado pela trilha principal do Vale do Roncador,
              passando pelo setor das Aderências – Central e seguindo mais uns 300
              metros após a segunda travessia do córrego. Neste ponto, existe um vasto
              bambuzal à esquerda da trilha. Deve-se cruzar o mesmo, bem como cruzar
              o riacho. Neste ponto, a trilha está bem demarcada e é possível ver
              a parede, logo após cruzar o riacho.


              | ![Maria Fernanda descendo a trilha de acesso do Setor de Cima da Parede
              das Aderências (Foto: Pedro Bugim)](imagens/grupo_aderencias_setor_de_cima_p0_i0.webp)
              |

              | :--: |

              | *Maria Fernanda descendo a trilha de acesso do Setor de Cima da Parede
              das Aderências (Foto: Pedro Bugim)* |


              A trilha segue por um descampado, sempre subindo, até atingir enormes
              blocos de pedra (nos quais existe possibilidade de abertura de futuros
              boulders), que devem ser contornados por baixo e pela esquerda.


              A base das vias “São Lourenço” e “Carnaferros” ficam exatamente no ponto
              em que a trilha chega à parede. Para acessar a base da “Buena Vista”,
              é necessário costear a rocha para a esquerda, por poucos metros.


              Como já dito, a porção direita desta parede permanece inexplorada e
              apresenta grande potencial para novas linhas, tanto em aderência quanto
              em convidativos diedros.


              | ![Pedro Bugim durante a conquista do “Carnaferros” (Foto: Maria Fernanda)](imagens/grupo_aderencias_setor_de_cima_p3_i0.webp)
              |

              | :--: |

              | *Pedro Bugim durante a conquista do “Carnaferros” (Foto: Maria Fernanda)*
              |'
