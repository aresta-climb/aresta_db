            - via_multiplas_enfiadas:
                nome: Quarto 304
                dificuldade_media: BR_2
                dificuldade_maxima: BR_2SUP
                exposicao: E1
                comprimento_total: 120
                numero_enfiadas: 3
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Tonico Magalhães
                - Celso Ferreira Gomes
                data_abertura: '2014-11-01'
                descricao: Inicia após a grande barriga que existe neste setor, com
                  um grampo logo no início, para proteger do pequeno abismo que ali
                  existe. Seu trecho inicial, com cerca de 40 metros, segue por platôs
                  de mato e lances de Isup. Após juntar com a parada final da "O Nome
                  da Rosa", a parede ganha verticalidade e segue por mais 80 metros
                  até a vegetação de topo. Nome inspirado no quarto no qual a Hilda
                  Furacão "atendia" seus clientes no Hotel Maravilhoso, de acordo
                  com o romance de Roberto Drummond.
            - via_multiplas_enfiadas:
                nome: O Nome da Rosa
                dificuldade_media: BR_4
                dificuldade_maxima: BR_4SUP
                exposicao: E1
                comprimento_total: 120
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Tonico Magalhães
                - Celso Ferreira Gomes
                - Glesse Gripp
                - João Paulo JP
                data_abertura: '2012-02-04'
                descricao: Centésima via conquistada na região, sendo a penúltima
                  da extrema esquerda da Parede Principal. Uma opção interessante
                  é seguir, após o final dessa via, pela "Quarto 304", o que confere
                  aos escaladores exatos 200 metros de escalada.
            - via_multiplas_enfiadas:
                nome: O Retorno de Jedi
                dificuldade_media: BR_4
                dificuldade_maxima: BR_4SUP
                comprimento_total: 150
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Tonico Magalhães
                - Paulo Bandeira
                - Júlio César Cardoso
                data_abertura: '2007-09-07'
                descricao: Boa via, predominantemente em aderência e agarras, que
                  conta com proteção fixa constante.
            - via_multiplas_enfiadas:
                nome: Ih, Ferrou!
                destaque: true
                dificuldade_media: BR_4
                dificuldade_maxima: BR_6
                exposicao: E2
                duracao: D2
                comprimento_total: 185
                numero_enfiadas: 5
                tipo_via_multiplas_enfiadas: MISTA
                equipamento_recomendado: 'Camalots #0.75 ao #4. Camalot #3 na P1 e
                  Camalot #0.75 na P2.'
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2011-11-13'
                descricao: 'Via mista, com agarras, aderência, fendas e barrigas interessantes.
                  Proteções constantes nos lances mais complicados e maiores espaçamentos
                  nos lances fáceis. Proteção dupla em todas as paradas, com padrão
                  de 50 metros. Material recomendado: Camalots #0.75 ao #4. Rapel
                  possível com corda única de 50m.'
