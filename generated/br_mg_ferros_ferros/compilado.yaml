            escaladas:
            - via_movel:
                nome: Solamente
                dificuldade: BR_2
                exposicao: E5
                extensao: 120
                conquistadores:
                - Tonico Magalhães
                data_abertura: '2010-11-27'
                descricao: Via conquistada em solo integral, sem grampos. A descida
                  deve ser feita desescalando-se a própria linha ou caminhando-se
                  pelo mato do lado esquerdo.
            - via_esportiva:
                nome: Nesse Mato Tem Cachorro
                dificuldade: BR_3
                exposicao: E2
                extensao: 55
                quantidade_protecoes_intermediarias: 7
                quantidade_protecoes_parada: 2
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2012-02-22'
                descricao: Via que começa passando por uma sequência de platôs com
                  vegetação, até chegar ao primeiro grampo, na parede já limpa. Após
                  a segunda proteção, segue em diagonal para a direita, tornando a
                  subir logo após, na direção do final do óbvio diedro. Após a virada
                  do diedro, com um grampo no lance, segue-se em leve diagonal para
                  a esquerda, até a última proteção da via.
            - via_esportiva:
                nome: Vr. Cachorro Louco
                dificuldade: BR_3
                exposicao: E3
                extensao: 30
                quantidade_protecoes_intermediarias: 2
                quantidade_protecoes_parada: 2
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2012-02-22'
                descricao: Variante da via anterior, segue reta após a segunda proteção
                  da via principal, passando por um pouco de mato, até fazer a virada
                  do diedro, com um grampo logo acima do mesmo para proteção. Depois
                  da virada, segue por uma linha branca na pedra, com mais um grampo
                  intermediário, até chegar à parada final da “Nesse Mato Tem Cachorro”.
                  Por possuir apenas duas proteções em 30 metros, apesar de fácil,
                  esta via deve ser abordada com cautela.
            - via_esportiva:
                nome: Libera Liberou
                dificuldade: BR_3
                exposicao: E1
                extensao: 35
                quantidade_protecoes_intermediarias: 6
                quantidade_protecoes_parada: 2
                conquistadores:
                - Tonico Magalhães
                - Nádia Moreira
                data_abertura: '2009-08-01'
                descricao: Via predominantemente em aderência e agarras, com boa grampeação
                  até a parada final. Segue desde a base até o final em linha praticamente
                  reta, terminando na barreira de vegetação.
            - via_esportiva:
                nome: Dez Mil e Uma Noites
                dificuldade: BR_6
                exposicao: E1
                extensao: 45
                quantidade_protecoes_intermediarias: 10
                quantidade_protecoes_parada: 2
                conquistadores:
                - Celso Ferreira Gomes
                - Tonico Magalhães
                data_abertura: '2012-05-06'
                descricao: Saída fácil em dois lances com boas agarras e bom posicionamento
                  para os pés. Após o segundo grampo, seguem-se quatro lances bem
                  íngremes de VI grau, com notável escassez de agarras e posicionamento
                  delicado e instável para os pés, especialmente porque, nesse trecho,
                  a rocha mostra-se mais friável. Após a parada dupla, seguem-se mais
                  três lances fáceis até o final da via. A parada dupla é uma boa
                  opção para o top-rope envolvendo a sequência de lances de VI. O
                  acesso à base não foi feito pelo mesmo caminho que leva às outras
                  vias do setor, passando sob a cerca ao lado do córrego. Sobe-se
                  a trilha mais uns 20 metros após o córrego e toma-se à esquerda
                  nesse ponto.
            descricao: '# Parede das Aderências – Extrema Esquerda


              Este é o primeiro setor da Parede das Aderências, um pouco isolado do
              resto da parede, por localizar-se quase na borda inicial do Vale do
              Roncador e por possuir muita vegetação ao seu redor.


              Para acessar as bases das vias neste setor, é necessário pegar a trilha
              do Vale do Roncador, que se inicia pouco depois do Subsetor Cachoeira,
              subindo em diagonal para a direita da estrada de terra.


              | ![Maria Fernanda na “Vr. Cachorro Louco”. (Foto: Pedro Bugim)](imagens/grupo_aderencias_setor_extrema_esquerda_p0_i0.webp)
              |

              | :--: |

              | *Maria Fernanda na “Vr. Cachorro Louco”. (Foto: Pedro Bugim)* |


              Andando pouco mais de 100 metros na trilha, deve-se cruzar o córrego
              e passar pela cerca de arame farpado ao lado esquerdo. Muita atenção
              ao fazer este procedimento, primeiro para não causar lesões, e em segundo
              lugar, para não causar danos à estrutura da cerca. Existe um bom espaço
              que possibilita a passagem por baixo da cerca, sem grandes esforços.


              Ao cruzar a cerca, a trilha segue pouco definida por 30 metros, até
              juntar-se à parede. Neste ponto, fica a base da via “Nesse Mato Tem
              Cachorro”. Subindo para a direita, chega-se à base da “Libera Liberou”
              e descendo para a esquerda (em meio ao capim), chega-se à base da “Solamente”.


              Em geral, são vias de baixa graduação, boas para treinar o psicológico
              gradualmente, uma vez que as vias variam seu grau de exposição, possuindo
              vias de E1, E2, E3 e E5, sem possuir lances muito técnicos. A exceção
              é a via “Dez Mil e Uma Noites”, que apesar da boa grampeação, possui
              lances de VI grau, exigindo maior atenção e habilidade por parte do
              escalador.'
            precomputados:
              total_escaladas: 5
              total_esportivas: 4
