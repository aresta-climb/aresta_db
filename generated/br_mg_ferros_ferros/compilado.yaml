                conquistadores:
                - Celso Ferreira Gomes
                - Tonico Magalhães
                - Glesse Gripp
                data_abertura: '2011-09-18'
                descricao: 'Via que conta com 19 grampos de ½ e três paradas duplas.
                  Homenageia o falecido garanhão Mangalarga-marchador Prateado, que
                  fez história na fazenda. P1 aos 50m, P2 aos 50m e P3 aos 30m. Nota:
                  as paradas duplas da via podem estar incorretas, bem como falta
                  a confirmação da graduação dos lances isoladamente, necessitando
                  repetição para confirmação.

                  '
            descricao: '# Parede das Aderências – Esquerda


              O Setor Esquerdo da Parede das Aderências é dividido em duas partes
              (Esquerda 1 e Esquerda 2), separadas por uma forte língua de vegetação,
              possuindo vias de 20 até 140 metros de extensão, predominantemente em
              aderência.


              Apesar do setor ser predominantemente de aderência, três vias destoam
              das demais, sendo quase que completamente em móvel (“Fissurim”, “O Psicopata
              de Ferros” e “Vr. Caçadora de Micuim”), seguindo por bonitas fendas,
              proporcionando ao escalador um bom treino desta técnica.


              ## Acesso


              O acesso às bases é feito pela trilha principal do Vale do Roncador.
              Após a primeira travessia do córrego, anda-se aproximadamente 100 metros
              até encontrar – à esquerda - a entrada da picada que leva às bases das
              primeiras vias neste setor (“Cordada 171”, “Inês é Morta” e “Sempre
              Viva”), logo antes de passar por uma porteira. Esta trilha, apesar de
              pouco visível, está marcada com um totem de pedra em seu início.


              Para as demais vias da parte esquerda deste setor, basta continuar por
              poucos metros na trilha principal, uma vez que as bases saem quase diretamente
              desta trilha.


              Para acessar as bases do setor da direita, segue-se por aproximadamente
              80 metros na trilha principal até encontrar a picada que sobe à esquerda.
              Desta picada, pode-se costear a parede, seguindo por cima ou para baixo,
              com imediata visualização dos grampos das vias “Frio na Barriga” e “Pescoço
              de Minhoca”.


              ### Esquema de Trilhas


              - **1**: Base das vias “Cordada 171”, “Inês é Morta” e “Sempre Viva”

              - **2**: Base das vias entre “Fissurim” e “Sherlock Holmes”

              - **3**: Base das vias entre “Professor Moriarty” e “O Psicopata de
              Ferros”

              - **4**: Base das vias “Frio na Barriga” e “Pescoço de Minhoca”

              - **5**: Base das vias “Grampos de Ferros” e “Prateado”


              | ![Pedro Bugim na conquista da “O Psicopata de Ferros” (Foto: Maria
              Fernanda)](imagens/grupo_aderencias_setor_esquerda_p0_i1.webp) |

              | :--: |

              | *Pedro Bugim na conquista da “O Psicopata de Ferros” (Foto: Maria
              Fernanda)* |


              | ![Giselle Melo repetindo a “Professor Moriarty” logo após a conquista.
              (Foto: Pedro Bugim)](imagens/grupo_aderencias_setor_esquerda_p8_i0.webp)
              |

              | :--: |

              | *Giselle Melo repetindo a “Professor Moriarty” logo após a conquista.
              (Foto: Pedro Bugim)* |


              | ![Maria Fernanda na conquista da segunda enfiada do paredão “Que Qui
              Ocê Foi Fazê Nu Mato?” (Foto: Pedro Bugim)](imagens/grupo_aderencias_setor_esquerda_p8_i2.webp)
              |

              | :--: |

              | *Maria Fernanda na conquista da segunda enfiada do paredão “Que Qui
              Ocê Foi Fazê Nu Mato?” (Foto: Pedro Bugim)* |


              | ![Eustáquio Júnior na trilha a frente da via “Pescoço de Minhoca”,
              fotografando os escaladores. (Foto: Pedro Bugim)](imagens/grupo_aderencias_setor_esquerda_p8_i1.webp)
              |

              | :--: |

              | *Eustáquio Júnior na trilha a frente da via “Pescoço de Minhoca”,
              fotografando os escaladores. (Foto: Pedro Bugim)* |'
