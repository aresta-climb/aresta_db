            descricao: '# Parede Principal – Setor Clássicas Longas


              Setor da Parede Principal que concentra as maiores vias do Vale do Roncador,
              com vias de até 220 metros de extensão, como é o caso do Pr. “Eu Não
              Sou de Ferro”.


              Para acessá-lo é necessário seguir a trilha principal do Vale do Roncador
              por cerca de dois quilômetros, sempre beirando o córrego de mesmo nome.
              Após cruzar o rio duas vezes, passar por uma tronqueira e contornar
              um pasto, é necessário pegar uma bifurcação à direita, subindo em diagonal.
              Em certo ponto, ao encontrar uma laje de pedra com um filete de água
              escorrendo, vindo da direita, pode-se seguir por ele (cuidado para não
              escorregar!) ou seguir pelo barranco à esquerda.


              Predominância de vias em agarras e buracos, com destaque para o grande
              negativo existente no meio da parede, que abriga vias longas e de alta
              graduação, com mais de três enfiadas de corda, contando inclusive com
              a via mais difícil do polo (Pr. Conrado Ferro). Destaque ao Paredão
              CEM, via com quatro enfiadas e que segue uma linha natural impressionante.


              Outra opção interessante, é a via “Ih, Ferrou!”, por contar com proteção
              mista, obrigando o escalador a realizar pelo menos três lances protegendo
              com materiais móveis, em fendas sólidas e buracos perfeitos, ou a via
              “Rio de Mão Dupla”, que com 140 metros, conta apenas com dois grampos,
              sendo todo o resto em móvel.


              Este setor ainda conta com boas possibilidades de novas vias, sobretudo
              em sua metade da direita, na qual existem apenas três vias longas (“Eu
              Não Sou de Ferro”, “Rio de Mão Dupla” e “À Francesa”) e uma terceira,
              curta (“Grand Finale”).


              ## Esquema de Trilhas


              - **1**: Base das vias “Eu Não Sou de Ferro”, “Rio de Mão Dupla” e “À
              Francesa”

              - **2**: Base das vias “Jardim do Éden” até “Arco de Ferros”

              - **3**: Base da via “Ih, Ferrou!”

              - **4**: Base das vias “O Retorno de Jedi” e “O Nome da Rosa”'
            precomputados:
              total_escaladas: 22
              total_esportivas: 2
              total_multiplas_enfiadas: 19
        descricao: '# A Parede Principal (Paredes de Aço)


          Com vias entre 18 e 220 metros, a Parede Principal é uma das principais
          atrações para os escaladores que visitam Ferros. Esta parede colossal possui
          cerca de dois quilômetros de extensão, desde sua extremidade direita (Setor
          Clássicas Curtas) à sua extrema esquerda (Setor Clássicas Longas), com vias
          de praticamente todos os tipos.


          A predominância é de vias em agarras e ótimos abaulados / buracos, conferindo
          ao escalador, lances bem estéticos. Como não poderia deixar de ser, estas
          paredes apresentam também boas passadas em aderência.


          O interessante é o fato de a parede apresentar vias curtas e longas, ambas,
          tanto com graduações elevadas, quando com graduações bem simplórias, agradando
          a todos os gostos.'
        precomputados:
          total_escaladas: 76
          total_esportivas: 24
          total_multiplas_enfiadas: 45
