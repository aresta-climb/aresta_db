                descricao: 'A via é predominante em aderência, com fendas que ajudam
                  a melhorar a proteção. Seu início é mais inclinado e, logo após
                  a primeira proteção, cai bastante até a P1. Dessa proteção em diante,
                  a inclinação aumenta gradativamente, com uma passada entre um pequeno
                  teto rodeado de mato e grandes blocos soltos, que não aguentariam
