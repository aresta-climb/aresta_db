            escaladas:
            - via_multiplas_enfiadas:
                nome: Cordada 171
                dificuldade_media: BR_3
                dificuldade_maxima: BR_4SUP
                exposicao: E1
                comprimento_total: 90
                tipo_via_multiplas_enfiadas: MISTA
                equipamento_recomendado: Friends pequenos e médios (opcionais)
                conquistadores:
                - Tonico Magalhães
                - Celso Ferreira Gomes
                - Glesse Gripp
                data_abertura: '2015-02-17'
                descricao: 'Via iniciada na mesma base da “Inês é Morta”, em um pequeno
                  diedro que pode ter sua proteção melhorada com friends médios e
                  pequenos (opcionais). Segue por pequenos platôs de mato em lances
                  fáceis até alcançar seu primeiro grampo. Ganha verticalidade ao
                  longo da via, possuindo um crux bem definido na altura do quinto
                  grampo. O nome da via está relacionado com a soma das idades dos
                  autores!

                  '
