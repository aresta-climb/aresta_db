                descricao: 'Via relativamente longa e constante, que conta com 25
                  grampos de ½. Inicia-se em uma cristaleira espetacular. Rapel com
                  corda única de 50m. P1 aos 45m (parada simples), P2 aos 45m (parada
                  dupla) e P3 aos 50m (parada dupla).

                  '
            - via_multiplas_enfiadas:
                nome: Grampos de Ferros
                destaque: true
                dificuldade_media: BR_3
                dificuldade_maxima: BR_3SUP
                exposicao: E1
                comprimento_total: 110
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: MISTA
                equipamento_recomendado: Friends pequenos e médios para o diedro inicial
                conquistadores:
                - Tonico Magalhães
                - Celso Ferreira Gomes
                data_abertura: '2010-09-10'
                descricao: 'Via altamente recomendada para quem gosta de aderência
                  em graduação não muito elevada, sempre com boa proteção em grampos
                  de ½ e paradas duplas. Possui um diedro inicial (crux) em móvel
                  protegido por friends pequenos e médios. P1 aos 50m e P2 aos 60m.

                  '
            - via_multiplas_enfiadas:
                nome: Prateado
                dificuldade_media: BR_3
                dificuldade_maxima: BR_4
                exposicao: E1
                comprimento_total: 130
                numero_enfiadas: 3
