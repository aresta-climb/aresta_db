                data_abertura: '2012-01-21'
                descricao: Via com passadas muito interessantes em aderência, com
                  grampeação longa. Ótima para treinamento de psicológico. Rapel possível
                  com uma corda de 60m (de grampo em grampo) ou duas cordas de 50m
                  ou maiores. O rapel pode ser feito também pela via “Coração Valente”,
                  com corda única de 50m. Via em homenagem aos 73 anos do Centro Excursionista
                  Rio de Janeiro (CERJ), completados no dia anterior à conquista.
            - uid: 9aBkEGGdm0Uwj1
