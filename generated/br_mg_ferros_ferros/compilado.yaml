            - via_multiplas_enfiadas:
                nome: Que Qui Ocê Foi Fazê Nu Mato?
                dificuldade_media: BR_3
                dificuldade_maxima: BR_5
                exposicao: E2
                numero_enfiadas: 3
                comprimento_total: 130
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2012-02-20'
                descricao: 'Interessante via que segue, quase em sua totalidade, a
                  visível faixa branca que corta toda a extensão vertical da parede
                  neste setor. O crux fica nos primeiros 10 metros, sempre com boa
                  proteção. Daí para cima, a via perde inclinação e passa por lances
                  bastante divertidos, em aderência e cristaleiras. P1 aos 40m (parada
                  dupla), P2 aos 55m (parada simples) e P3 aos 30m (parada dupla).

                  '
            - via_multiplas_enfiadas:
                nome: O Psicopata de Ferros
                destaque: true
                dificuldade_media: BR_4
                dificuldade_maxima: BR_6
                exposicao: E2
                duracao: D1
                numero_enfiadas: 2
                comprimento_total: 70
                tipo_via_multiplas_enfiadas: MISTA
                equipamento_recomendado: Friend médio / Camalot .75
                conquistadores:
                - Pedro Bugim
                - Maria Fernanda Patrício
                data_abertura: '2012-02-20'
                descricao: 'Boa via que possui seu crux logo nos primeiros 15 metros,
                  em aderência e pequenos cristais. É necessário fazer proteção móvel
                  com friend médio, em um buraco, entre o segundo e terceiro grampos
                  da via. Após a P1, segue em diagonal para a direita, juntando com
                  a via “Frio na Barriga”. Rapel pela via “Frio na Barriga”, com corda
                  única de 50m ou pela própria via, com duas cordas de 50m. P1 aos
                  50m e P2 aos 20m, ambas com paradas duplas.

                  '
            - via_movel:
                nome: Vr. Caçadora de Micuim
                dificuldade: BR_3
                exposicao: E1
                extensao: 35
                protecoes_moveis: Friends e nuts pequenos e micros (stoppers pequenos)
                conquistadores:
                - Claudney Neves
                - Carla Paiva
                data_abertura: '2014-10-01'
                descricao: 'Variante que liga a “Psicopata de Ferros” a “Frio na Barriga”,
                  seguindo um sistema de finas fissuras, bem protegidas por friends
                  e nuts pequenos e micros. Boa via para quem está começando a guiar
                  em móvel, pois além de relativamente curta, possui graduação baixa
                  e com boas opções de proteção.

                  '
            - via_multiplas_enfiadas:
                nome: Frio na Barriga
                dificuldade_media: BR_3
                dificuldade_maxima: BR_3SUP
                comprimento_total: 100
                numero_enfiadas: 2
                tipo_via_multiplas_enfiadas: TODA_FIXA
                conquistadores:
