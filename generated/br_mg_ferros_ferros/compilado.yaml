                data_abertura: '2012-02-20'
                descricao: Semelhante à via anterior possui grampeação longa e lances
                  simplórios, porém, um pouco mais curta.
            descricao: '# Parede Principal – Direita


              Localizada ao início da Parede Principal com vias de pequena extensão
              e muito boas para um primeiro contato com o tipo de escalada da região.
              Concentra vias que vão de 20 a 100 metros, em sua maioria bem protegidas
              por grampos de ½ polegada, com predominância de agarras, regletes e
              buracos, possuindo por vezes, algumas fendas interessantes.


              O acesso às bases pode ser feito por duas picadas que derivam da trilha
              principal do Vale do Roncador, ambas aproximadamente 200 metros após
              a primeira travessia do córrego.


              Na primeira opção, pega-se a bifurcação para a esquerda e com poucos
              metros de caminhada, cruza-se novamente o córrego. A descida é amena,
              porém após atravessar o córrego, existe um pequeno barranco. Tocando
              para cima, chega-se na base da via “Rapidinha no Escurinho”.


              Na segunda picada, pega-se a bifurcação à esquerda, descendo por uma
              trilha um pouco íngreme antes de cruzar o córrego, para então, voltar
              a subir, chegando na base da via “O Burro e o Capacete”, onde se encontra
              o esqueleto de um burro que veio a falecer após cair do topo da parede
              (daí, parte do nome da via).


              | ![Gustavo “Xaxá” Carrozzino na conquista da “Amor, Meu Grande Amor”,
              após o diedro em móvel (Foto: Maria Fernanda Patrício)](imagens/grupo_principal_setor_direita_p0_i1.webp)
              |

              | :--: |

              | *Gustavo “Xaxá” Carrozzino na conquista da “Amor, Meu Grande Amor”,
              após o diedro em móvel (Foto: Maria Fernanda Patrício)* |


              ## Esquema de Trilhas e Acesso


              - **1 – Base das vias “Cutícula” e “Pelinha”**

              - **2 – Base das vias “Rapidinha no Escurinho” até a “Pele Vermelha”**

              - **3 – Base das vias “Amor, Meu Grande Amor” e “Tá Bão”**

              - **4 – Base da via “O Burro e o Capacete”**

              - **5 – Base das vias “Valeu Papito” até a “Lobos do Caraça”**


              | ![Ana Paula na "Cutícula" (Foto: Pedro Bugim)](imagens/grupo_principal_setor_direita_p4_i0.webp)
              |

              | :--: |

              | *Ana Paula na "Cutícula" (Foto: Pedro Bugim)* |


              | ![Larissa Lopes na “Flor da Pele”. Parede Principal Direita. (Foto:
              Pedro Bugim)](imagens/grupo_principal_setor_direita_p7_i1.webp) |

              | :--: |

              | *Larissa Lopes na “Flor da Pele”. Parede Principal Direita. (Foto:
              Pedro Bugim)* |


              | ![Carlos Alberto Carrozzino (Krrô), na conquista da via “Valeu Papito”
              (Foto: Gustavo “Xaxá” Carrozzino)](imagens/grupo_principal_setor_direita_p7_i2.webp)
              |

              | :--: |

              | *Carlos Alberto Carrozzino (Krrô), na conquista da via “Valeu Papito”
              (Foto: Gustavo “Xaxá” Carrozzino)* |


              | ![Cida, Eustáquio Júnior, Larissa Lopes e Maria Fernanda na base da
              Parede Principal - Direita, durante aula do segundo Curso Básico de
              Montanhismo do CEM (Foto: Pedro Bugim)](imagens/grupo_principal_setor_direita_p7_i0.webp)
              |

              | :--: |

              | *Cida, Eustáquio Júnior, Larissa Lopes e Maria Fernanda na base da
              Parede Principal - Direita, durante aula do segundo Curso Básico de
              Montanhismo do CEM (Foto: Pedro Bugim)* |'
