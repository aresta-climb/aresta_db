botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: '# Croqui Fest Boulder 2023


        | ![Capa do Croqui Fest Boulder 2023](imagens/capa_p0.webp) |

        | :--: |

        | *Capa do Croqui Fest Boulder 2023* |


        **Conceição do Mato Dentro - 2023**


        **Elaborado por:**

        - Gabriel Vargas Mendonça

        - Carlos Oliveira

        - Filipe Madeira

        - Alexandre Vasconcelos Levy

        - Nayara Meireles

        - Alexandre Fei


        **Estrutura do Evento:**

        - Sorteio

        - Show ao Vivo

        - Camping

        - Praça de Alimentação


        **Instagram:** @cmd_festboulder'
- texto: Introdução
  destino:
    secao_textual:
      conteudo: '# Introdução


        ## Conceição do Mato Dentro/MG


        Considerada a “capital mineira do ecoturismo” – por abrigar inúmeras belezas
        naturais – CONCEIÇÃO DO MATO DENTRO encontra-se na região central de MINAS
        GERAIS, na vertente oriental da SERRA DO CIPÓ da CORDILHEIRA DO ESPINHAÇO.
        Nacionalmente reconhecida como um dos melhores lugares para a prática de escalada
        em “Boulder”, o local conta com inúmeras linhas já abertas, com nível de dificuldade
        variando entre V0 a V13, além de diversos projetos que ainda não tiveram SUA
        PRIMEIRA Ascensão.


        ## O Festival


        Grande parte dos festivais de escalada no Brasil ocorrem entre os meses de
        junho a agosto (épocas de estiagem, sem ocorrência de chuvas), e CONCEIÇÃO
        DO MATO DENTRO não fica de fora desta programação. OUTROS FESTIVAIS OCORREM
        NA MESMA ÉPOCA, EM OURO PRETO, SABARÁ E MILHO VERDE. Desta forma, tem-se o
        circuito perfeito, que consideramos o circuito ESTRADA REAL de Boulder.


        O principal objetivo deste projeto é atrair e propiciar muita escalada e diversão
        a todos os participantes, em UM dos picos mais promissores do Brasil para
        a prática de escalada em “Boulder”.


        Boulder é uma das modalidades da escalada em rocha, praticada sem o uso de
        equipamentos convencionais, como cordas e mosquetões. O boulder consiste em
        escalar blocos de pedras, onde os movimentos apresentam dificuldade técnica
        e exigem força.'
