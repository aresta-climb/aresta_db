        | *Capa do Croqui Fest Boulder 2023* |

        **Conceição do Mato Dentro - 2023**

        **Elaborado por:**
        - Gabriel Vargas Mendonça
        - Carlos Oliveira
        - Filipe Madeira
        - Alexandre Vasconcelos Levy
        - Nayara Meireles
