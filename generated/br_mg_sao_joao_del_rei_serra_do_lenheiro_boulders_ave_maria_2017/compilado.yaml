botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: |-
        # Boulders da Ave Maria

        ## Serra do Lenheiro - MG

        | ![Boulders da Ave Maria - Serra do Lenheiro - MG](imagens/capa_p0_i0.webp) |
        | :--: |
        | *Boulders da Ave Maria - Serra do Lenheiro - MG* |
- texto: Apresentação
  destino:
    secao_textual:
      conteudo: "# Boulders da Ave Maria\n\n## Serra do Lenheiro - MG\n\n| ![Boulders\
        \ da Ave Maria - Serra do Lenheiro](imagens/apresentacao_p0_i0.webp) |\n|\
        \ :--: |\n| *Boulders da Ave Maria - Serra do Lenheiro* |\n\n**Flora Kesselring\
        \ Zugaib**  \n**Klauss Castanheira**  \n**Thomás Alexandre Kämpf (Tomi)**\
        \  \n**Webert Resende (Beto)**  \n\n1ª edição  \njan-2017  \n\n---\n\n# Apresentação\n\
        \n**Por: Flora Kesselring Zugaib**\n\nTomi e eu passamos dois anos tentando\
        \ conhecer as escaladas de São João Del Rei-MG. Vamos sempre pra lá porque\
        \ minha mãe mora na cidade vizinha, Tiradentes, mas não encontrávamos escaladores\
        \ para nos apresentar às escaladas da região... Só em 2012 conseguimos. O\
        \ escalador Claudio Matsuzaki, foi quem nos recebeu e nos apresentou o setor\
        \ Ave Maria, até então um setor de vias irado, com alguns boulders abertos.\n\
        \nQuando fomos chegando no setor vimos muitOOOs blocos e perguntávamos pra\
        \ galera \" lá tem boulder?\" eles diziam \"não\"... A pergunta se repetia\
        \ e a resposta também... Desfrutamos das vias, mas de olho no que tinha ao\
        \ redor...\n\nNo Ave Maria reencontramos um escalador que já tínhamos conhecido\
        \ na Serra do Cipó, Webert (Beto) Resente \"Betão\", ele nos apresentou alguns\
        \ bons boulders já abertos, muitos por ele inclusive, escalamos e começamos\
        \ os trabalhos de abertura... Logo chamamos o casal de amigos Carlera e Paulinha,\
        \ que vieram com o Christian Fernandes e Ayra. Com os amigos abrimos alguns\
        \ bons boulders. Em parceria com o Beto abrimos desta vez e nos anos seguintes,\
        \ até agora, 2015, mais de 100 linhas de boulders de V0 a projeto!! Linhas\
        \ francas!!!\n\nArrumando sempre a base e catalogando, o que virou um croqui\
        \ \"roots\", que no momento mora no bloco do boulder Reza Braba, para que\
        \ todos possam usar e se localizar! Fizemos isso para que não fosse aberto\
        \ um boulder em cima do outro e para a informação não se perder, pois nesta\
        \ modalidade quando se abre uma linha, só fica o magnésio, que a chuva lava...\
        \ Em 2014 o pessoal de BH, com Felipe Alvares e Roberta Resende foram conhecer\
        \ o pico e confirmaram o potencial do local!!! Tetos e negativos de Quartzito,\
        \ com agarras sólidas, perfeito para ser escalado!!! Abriram mais 30 ótimas\
        \ linhas.\n\nA área do setor é particular de acesso livre, para que continuemos\
        \ desfrutando e outros escaladores possam conhecer, contamos com a BOA EDUCAÇÃO\
        \ dos escaladores!!! Por isso cabem as regras de boa conduta!!!\n\nMais informações\
        \ sobre o setor pode ser conosco, com o Webert Beto Resende ou com o Klauss\
        \ Castanheira, também parceiro nosso. Para quem quiser escalar lá e ficar\
        \ por alguns dias, tem a opção de ficar no CEMONTA, área militar com toda\
        \ infraestrutura, mediante a um pedido de autorização, com certo tempo de\
        \ antecedência ou podem também consultar hospedagem na HOSPEDARIA CASA DA\
        \ ANITA!!!\n\nViva o Ave Maria!!! Flora e Tomi tem o apoio da Quatro Ventos,\
        \ Flor Roupas Esportivas, Campo Base, Alto Estilo, Capituva Agroflorestal\
        \ e Marunbeer e Hospedaria Casa da Anita!!!"
- texto: Ética e Regras
  destino:
    secao_textual:
      conteudo: |-
        # ATENÇÃO

        Respeite a ética e regras locais:

        - É EXPRESSAMENTE PROIBIDO cavar, melhorar, quebrar ou adicionar agarras.
        - O Hih Ball é uma forte característica do setor. NÃO FIXE PROTEÇÕES NOS BLOCOS.
        - Utilize as trilhas existentes.
        - Traga seu lixo de volta.
        - Não corte árvores ou arranque plantas. Respeite os animais.
        - Evite fogo, fogueiras.

        Lembre-se, você está em uma área particular:

        - Trate os moradores da área com cortesia e respeito.
        - Deixe os carros e motos no espaço delimitado para estacionamento.
        - Atenção às porteiras. Se abriu feche!
        - Evite concentração de grandes grupos, e cuidado com barulho, principalmente no Nightclimb.
- texto: Como Chegar
  destino:
    secao_textual:
      conteudo: |-
        # Como Chegar

        Em São João del Rei, saindo da Praça Frei Orlando-Centro (A), siga pela rua Padre José Maria Xavier (B) em direção à Ponte do Rosário. Vire à esquerda na Av. Gen. Osório (C) e continue pela rua São José Operário (D). Ao final desta, faça a curva à direita para rua Mario Mazoni (E). Aproximadamente 300m depois vire à direita na Paulo Severino (F) até o fim da rua virando à esquerda na Geraldo Batista Alves até a Estrada Caburu (estrada de terra) e siga sentido ao Campo Escola de Montanhismo (CEMONTA). Deixe os carros na área de estacionamento determinada e siga caminhando até o setor de escalada.

        | ![Mapa de Acesso](imagens/mapas_gerais_p0_i0.webp) |
        | :--: |
        | *Mapa de Acesso* |
