            dificuldade: V7
            descricao: Saída com a mão esquerda no reglete lateral e a direita na
              craca baixa na aresta do bloco, indo reto até dois regletes, com um
              move forte para um agarrão na virada.
        - boulder:
            nome: Maria Bonita
            dificuldade: V2
            descricao: Boulder pela cracas na lateral do bloco indo reto até o crux
              na virada.
        - boulder:
            nome: Herança de Ferro
            dificuldade: V6
            descricao: Saída com a mão esquerda na laca lateral e a mão direita no
              batente baixo, indo para a direita até um movimento forte em um batente
              liso.
        descricao: '# Moctezuma


