        escaladas:
        - boulder:
            nome: Cubo Mágico
            dificuldade: V4
            descricao: Sai com a esquerda em uma agarra grande invertida e a direita
              em um gaston, escalando pela face do bloco.
        - boulder:
            nome: Jenga
            dificuldade: V2
            descricao: Saída com as mãos juntas em um laca / agarrão do lado direito,
              seguindo pela aresta.
        - boulder:
            nome: Cara a Cara
            dificuldade: V0
            descricao: Começa com as mãos juntas no agarrão mais a esquerda, escalando
              pela parte mais baixa.
        - boulder:
            nome: Resta um
            dificuldade: V0
            descricao: Saída no agarrão a direita da barriga, indo pra direita e fazendo
              a virada no meio do bloco.
        - boulder:
            nome: Pega Palito
            dificuldade: V2
            descricao: Boulder ao lado da árvore, saindo com a mão direita em uma
              invertida e a esquerda em um reglete pequeno, escalando reto pela face
              alta do bloco.
        - boulder:
            nome: Aresta da Sombra
            dificuldade: V0
            descricao: Começa com a direita em um reglete e a esquerda em uma pequena
              agarra, com um move técnico de saída e escalada por agarras grandes.
        - boulder:
            nome: Penumbra
            dificuldade: V0
            descricao: Saída no agarrão mais a esquerda do bloco, indo reto por agarras
              grandes.
        - boulder:
            nome: Aresta do sol
            dificuldade: V4
            descricao: Boulder clássico pela aresta do bloco, saindo com as mãos juntas
              no agarrão na parte baixa.
        descricao: '# Brinquedos


