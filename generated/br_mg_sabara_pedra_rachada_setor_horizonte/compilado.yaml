- texto: Introdução
  destino:
    secao_textual:
      conteudo: '---

        ---

        # SETOR HORIZONTE


        | ![Foto: Eric Dornellas - Escalador: Davi Oliveira](imagens/introducao_p0_i0.webp)
        |

        | :--: |

        | *Foto: Eric Dornellas - Escalador: Davi Oliveira* |


        Todos os boulders neste guia estavam, no momento da abertura das linhas, sem
        resquícios de escalada, sendo todas as ascensões consideradas como “novas”.
        Caso quaisquer linhas apresentadas já tenham sido escaladas anteriormente
        e sejam reconhecidas, pedimos que contate algum dos responsáveis:


        @davi.oliverna

        @jpfrancischetto'
- texto: Aviso
  destino:
    secao_textual:
      conteudo: '---

        ---

        # AVISO


        | ![Aviso](imagens/aviso_p0_i0.webp) |

        | :--: |

        | *Aviso* |


        Os blocos do setor Horizonte ainda não foram moldados para a atividade de
        escalada, de modo que muitos blocos ainda apresentam agarras quebradiças e
        pontos de atenção. Nós tentamos avaliar todas as possibilidades e remover
        agarras que não oferecem segurança, mas com a atividade de escalada intensa,
        novos betas são tirados e novas agarras utilizadas, bem como mais força é
        aplicada sobre elas. Por isso, pedimos a todos MUITA ATENÇÃO durante a escalada
        no novo setor. Sempre teste todas a possibilidades antes e veja se ela aparenta
        estar firme e boa para utilização. Segurança sempre em primeiro lugar!'
- texto: Mapas Gerais
  destino:
    secao_textual:
      conteudo: '---

