                nome: Sem querer
                dificuldade: V1
                descricao: Começa sentado com as duas mãos na agarra óbvia na base
                  da proa, e escala reto
            - boulder:
                nome: Horizonte
                dificuldade: V4
                descricao: Começa na mesma saída do “Sem querer” e toca pra direta
                  pela fenda horizontal, até a saída do “Pôr-do-sol”.
            - boulder:
                nome: Fenda comunista
                dificuldade: V4
                descricao: Começa como o “Sem querer” e escala toda a fenda lateral,
                  virando no “Base aérea”
            - boulder:
                nome: Pôr-do-sol
                dificuldade: V3
                descricao: Variação do “Horizonte”. Começa em pé, as duas mãos em
                  uma agarra em formato de “L” e escala levemente para a esquerda,
                  utilizando pequenos regletes na rocha.
            - boulder:
                nome: Bipa aérea
                dificuldade: V3
                descricao: Extensão do “Base aérea”. Inicia com as duas mãos na laca
                  em formato de “L” e toca pra direita.
            - boulder:
                nome: Base aérea
                dificuldade: V2
                descricao: Boulder de movimentação específica. As duas mão começam
                  juntas em uma agarra invertida muito boa na fenda horizontal e escala
                  reto.
            descricao: '# Bloco A


              Dica: Para queda ficar mais segura, posicione alguns crash como “calço”
              por baixo da camada que irá protegê-lo e entre as duas rochas que afunilam
              a base. A queda dos boulders é bem neste ponto.'
