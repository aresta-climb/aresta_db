                nome: No stress the blitz
                dificuldade: V5
                destaque: true
                conquistadores:
                - Rafael Passos
                data_abertura: '2005'
                descricao: Começa com a mão esquerda em um reglete no teto, a direita
                  num reglete/pinça na aresta e o calcanhar direito em um batente
                  escorrido e escala a aresta.
            - boulder:
                nome: No stress the boulder
                dificuldade: V8
                destaque: true
                conquistadores:
                - Mahavir Jneesh
                data_abertura: '2010'
                descricao: Sai sentado com as mãos juntas em uma agarra boa na aresta
                  do teto e finaliza pelo “No stress the blitz” (4).
            - boulder:
                nome: Don’t worry
                dificuldade: V2
                descricao: Sai como o “No stress the boulder” (5), mas do batente
                  vai em direção à aresta passando por um reglete bom.
            - boulder:
                nome: Caxo de banana
                dificuldade: V2
                destaque: true
                descricao: Começa em pé com a mão esquerda num reglete de lado e a
                  direita num batente de gastón e escala reto, por regletes pequenos,
                  até uma virada fácil.
            - boulder:
                nome: Easy
                dificuldade: V1
                destaque: true
                descricao: Começa em pé com a mão esquerda em um batente/pinça e a
                  direita em um reglete e toca reto por regletes até uma virada fácil.
            - boulder:
                nome: Banana Terra
                dificuldade: V2
                destaque: true
                descricao: Sai como o “Easy” (8) e termina no “Caxo de banana” (7).
            - boulder:
                nome: Check point
                dificuldade: V8
                descricao: Sai sentado com os braços bem abertos em um batente escorrido
                  de mão esquerda, um reglet pequeno de mão direita e faz um movimento
                  longo e muito duro para um regletinho acima do teto e toca reto.
            - boulder:
                nome: Aresta in
                dificuldade: V3
                destaque: true
                descricao: Boulder que escala a aresta saindo sentado com as mãos
                  num reglete e num abaulado.
            - boulder:
                nome: Referência perigosa
                dificuldade: V3
                destaque: true
                descricao: Começa em pé com as mãos abertas em dois regletes no positivo,
                  passa pelo tetinho e faz um domínio clássico.
            - boulder:
                nome: Pipe line
                dificuldade: V2
                destaque: true
                descricao: Sai em uma grande laca abaixo do teto, segue para outra
                  laca à esquerda e domina a "onda" passando por regletes. Clássico!
            - boulder:
                nome: Paulista irado
                dificuldade: V1
                descricao: Sai sentado com a mão esquerda em um batente e a direita
                  em um pocket/batente.
            - boulder:
                nome: Marrentin carioca
                dificuldade: V3
                destaque: true
                descricao: Sai sentado com as mãos juntas em um batente bom e um reglete
                  e escala por regletes à direita da proa.
            - boulder:
                nome: Chato
                dificuldade: V5
                descricao: Sai em dois regletes bem baixos e termina no “Marrentin
                  carioca” (15).
            - boulder:
                nome: Mantenha o respeito
                dificuldade: V3
                descricao: Começa sentado com as mão em agarras boas na aresta atrás
                  da árvore. Faz uma travessia pra esquerda, por regletes, finalizando
                  no “Marrentin carioca” (15).
            - boulder:
                nome: Mineral
                dificuldade: V1
                descricao: Sai sentado com as mãos juntas em agarras boas e toca reto
                  pelas cracas.
            - boulder:
                nome: Desvio
                dificuldade: V1
                descricao: Sai sentado com as mãos juntas em agarras boas e toca reto
                  pelas cracas.
            - boulder:
                nome: Rei do pão
                dificuldade: V1
                descricao: Sai sentado com as mãos juntas em agarras boas, passa pela
                  fenda até um reglete à direita e finaliza pela esquerda.
            - boulder:
                nome: Equilibrista
                dificuldade: V0
                descricao: Começa em pé com as mãos em um batente/abaulado e toca
                  reto.
            - boulder:
                nome: Parmalat
                dificuldade: V1
                descricao: Sai em pé com as mãos em regletes bons e toca reto pelo
                  vertical/positivo.
            - boulder:
                nome: Bh x Brasília
                dificuldade: V3
                descricao: Sai sentado com as mãos na borda do tetinho e domina.
            descricao: '# Bloco B - Bloco 1'
