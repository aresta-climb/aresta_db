                descricao: Começa sentado com as mãos juntas em um batente na aresta
                  e segue por ela até o topo.
            - boulder:
                nome: Tangente (Bloco 0)
                dificuldade: V3
                descricao: Sai sentado no meio da face negativa, escala até a aresta
                  e termina no “Aresta” (16).
            - boulder:
                nome: Transição
                dificuldade: V3
                descricao: Começa sentado em baixo do tetinho e toca reto.
            - boulder:
                nome: Transferência
                dificuldade: V7
                conquistadores:
                - Rafael Passos
                data_abertura: '2011'
                descricao: Uma linha ainda sem repetições que sai como o “Transição”
                  (18) e toca pra esquerda pelo vertical acima do tetinho.
            - boulder:
                nome: Verticale
                dificuldade: V5
                destaque: true
                conquistadores:
                - Gustavo Fontes
                data_abertura: '2007'
                descricao: Começa em dois regletes baixos, dá um tapa no batente e
                  toca reto por regletes bons.
            - boulder:
                nome: Obina
                dificuldade: V7
                destaque: true
                conquistadores:
                - Daniel Mendes
                data_abertura: '2011'
                descricao: Boulder com um movimento inicial muito técnico que sai
                  em pé com a mão esquerda em um abaulado de oposição e a direita
                  em uma invertida baixa, finalizando no “Verticale” (20).
            - boulder:
                nome: Medalha
                dificuldade: V9
                destaque: true
                conquistadores:
                - Rafael Passos
                data_abertura: '2011'
                descricao: Sai em pé com a mão esquerda em um reglete, a direita em
                  uma invertida baixa e escala comprimindo a aresta abaulada.
            - boulder:
                nome: Medalhão
                dificuldade: V10
                destaque: true
                conquistadores:
                - Rafael Passos
                data_abertura: '2011'
                descricao: Sai sentado com as mãos juntas em uma agarra invertida
                  e entra no “Medalha” (22).
            descricao: '# Bloco D - Bloco 0'
