        descricao: "# Tubarão\n\n| ![Escalador no teto do Setor Tubarão](imagens/setor_tubarao_p0_i0.webp)\
          \ |\n| :--: |\n| *Escalador no teto do Setor Tubarão* |\n\nSetor com os\
          \ projetos mais difíceis da Pedra Rachada, sendo alguns extensões do clássico\
          \ “Abrigo de ferro”, v11 sólido de movimentação única. O bloco “Fogos de\
          \ Vênus”, que apoia o bloco Abrigo de Ferro, possui algumas das escaladas\
          \ verticais mais divertidas de toda a área. Já o bloco “Tubarão”, possui\
          \ um dos tetos mais explorados da Rachada, com várias linhas e variantes\
          \ incríveis que garantem aos escaladores do circuito amarelo muita diversão!\n\
          \n## Acesso (25 min)\n\nPara acessar este setor, a partir do “Estacionamento\
          \ 2”, siga a trilha principal que passa à esquerda do “Bloco 1” e à direita\
          \ do bloco “Lua cheia” e suba até o bloco “Rolling Stones”. A partir daí,\
          \ existem duas opções: para os blocos “Fogos de Vênus” e “Abrigo de ferro”,\
          \ contorne o bloco “Rolling Stones” pela esquerda e pegue a trilha que sobe\
          \ à direita por 3min. Para acessar o “Tubarão” e os outros blocos, contorne\
          \ o bloco “Rolling Stones pela direita e pegue a primeira trilha larga à\
          \ esquerda, subindo por 5min.\n\n## Boulders Clássicos\n\n- **3. Fogos de\
          \ Vênus** – V2\n- **2. Vênus** – V3\n- **15. Tubarão** – V5\n- **21. Chivas**\
          \ – V7\n- **6. Abrigo de ferro** – V11\n\n| ![Escalador com a mão em reglete\
          \ em teto](imagens/setor_tubarao_p3_i0.webp) |\n| :--: |\n| *Escalador com\
          \ a mão em reglete em teto* |\n\n## Blocos do Setor\n\n- **Bloco A – Fogos\
          \ de Vênus**: boulders 1 a 5.\n- **Bloco B – Abrigo de Ferro**: boulders\
          \ 6 a 10.\n- **Bloco C – Meteoro**: boulders 11 e 12.\n- **Bloco D – Tubarão**:\
          \ boulders 13 a 37.\n- **Bloco E – Hindu**: boulder 38.\n- **Bloco F – Ganesh**:\
          \ boulder 39.\n- **Bloco G – Croissant**: boulders 40 e 41.\n- **Bloco H\
          \ – Túnel do Vento**: boulders 42 e 43.\n\n| ![Escalador dominando a borda\
          \ com agarras de reglete](imagens/setor_tubarao_p5_i0.webp) |\n| :--: |\n\
          | *Escalador dominando a borda com agarras de reglete* |\n\n> \"É impossível\
          \ avaliar a força que possuímos sem medir o tamanho do obstáculo que podemos\
          \ vencer, nem o valor de uma ação sem sabermos o sacrifício que ela comporta.\"\
          \  \n> — *H. W. Beecher*\n\n| ![Publicidade Tom Alves Fotografia Outdoor](imagens/setor_tubarao_p6_i0.webp)\
          \ |\n| :--: |\n| *Publicidade Tom Alves Fotografia Outdoor* |"
        precomputados:
          total_escaladas: 43
          total_boulders: 43
