                nome: Janis Joplin
                dificuldade: V4
                destaque: true
                descricao: Começa sentado com as mãos em dois regletinhos e atravessa
                  pra direita terminando como o “Travessa” (30).
            - boulder:
                nome: Rolling Stones
                dificuldade: V8
                destaque: true
                conquistadores:
                - Diogo Ratacheski
                data_abertura: '2005'
                descricao: Uma das linhas mais conhecidas da Pedra Rachada, escala
                  a clássica linha reta da parte mais negativa do bloco. Com a retirada
                  de umas pedras da base, sua saída passou a ser feita do batente
                  mais baixo à direita (onde se saía com o calcanhar), consolidando
                  o grau v8. Saindo no “Janis Joplin” (23) é o j Jimi Hendrix v8 ★.
            - boulder:
                nome: Jimi Hendrix
                dificuldade: V8
