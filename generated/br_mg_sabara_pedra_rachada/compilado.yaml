- texto: Ética Local
  destino:
    secao_textual:
      conteudo: '# Ética Local


        Amigo montanhista, antes de tudo é importante lembrar que você está entrando
        em uma Área de Preservação Ambiental. Para evitar a proibição da escalada
        no local (como já ocorreu em vários outros importantes setores de escalada
        nos arredores de Belo Horizonte) seja consciente em seus atos, siga as regras
        básicas de conduta, sejam cordiais e pratiquem o mínimo impacto. A natureza
        e a comunidade escaladora agradece.


        - Estacione sempre nos locais apropriados e sem obstruir a passagem (muitos
        caminhões transitam nesta estrada).

        - Entre em harmonia com a natureza, este é um local de vida selvagem. Respeite
        e ajude a preservar a fauna e a flora local e tome cuidado com animais peçonhentos.

        - Evite fazer fogueiras e acampar no local, seja consciente em seus atos.

        - Afaste-se das trilhas e dos boulders para fazer suas necessidades fisiológicas,
        enterre-as sempre e não deixe papel higiênico no local.

        - Aproveite seu momento com a natureza e evite o uso de qualquer aparelho
        de som. Caso queira escalar ouvindo suas músicas preferidas, lembre-se de
        respeitar a liberdade de escolha dos outros e também a fauna local. Uma boa
        alternativa é o uso dos fones de ouvido.

        - Ajude a conservar e melhorar sempre a base dos boulders e as trilhas de
        acesso.

        - Caminhe sempre nas trilhas demarcadas evitando danificar a vegetação local.


        ## Antes de escalar:


        - A escalada é um esporte seguro quando praticado com consciência, não se
        esqueça nunca que você é o responsável por sua segurança e pratique o esporte
        somente se for capacitado.

        - Atente para a sua segurança e a segurança de seus parceiros, tome cuidado
        com pedras na base dos boulders, com agarras quebrando e principalmente nas
        viradas dos boulders.

        - Verifique se não há nenhum animal peçonhento próximo ao boulder ou dentro
        das agarras.

        - Respeite a paz dos habitantes locais, se houver algum ninho em um boulder,
        mantenha distância e não escale próximo à ele.

        - Antes de deixar o local, escove o excesso de magnésio das agarras e verifique
        se não está deixando nenhum lixo para trás.

        - Lixo: você é responsável pelo seu, leve-o de volta (atenção com as guimbas
        de cigarro e os esparadrapos usados).

        - Aproveite seu dia de escalada e, acima de tudo, tenha bom senso.'
