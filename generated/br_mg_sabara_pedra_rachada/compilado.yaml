- texto: Sobre os Autores
  destino:
    secao_textual:
      conteudo: '# Sobre os Autores


        | ![Luca Portilho e Nathalia Daneliczin](imagens/sobre_os_autores_p0_i0.webp)
        |

        | :--: |

        | *Luca Portilho e Nathalia Daneliczin* |


        Luca é esportista desde criança. Nasceu em 21 de março de 1988 na cidade de
        Uberlândia, Minas Gerais, onde corria para todos os lados. Aos 12 anos, mudou-se
        para Vila Velha, onde passou sua adolescência e praticou vários esportes,
        como corrida de aventura, triátlon e surf. Em 2010 conheceu a escalada e apaixonou-se!
        Veio para Belo Horizonte aos 22 anos, onde mora até hoje. Trabalha como route-setter
        numa academia de escalada e como rigger – responsável pela montagem e desmontagem
        da estrutura – no Cirque du Soleil. Nas horas vagas? Assiste a vídeos de escalada
        e escala. Adora um boulder clássico, mas é apaixonado mesmo pelas vias e paredes.
        É ávido por desafios e sonha em escalar na França, berço do esporte. Outro
        sonho é mudar-se para o meio do mato e morar na base de uma montanha cheia
        de vias clássicas. Está numa nova fase em sua vida profissional, lançou seu
        primeiro guia de escalada e pretende lançar novos guias em breve, sabendo
        da importância desse trabalho para a comunidade escaladora do Brasil.


        É apaixonado pela vida, pela natureza e tem um coração enorme. É o escalador
        mais apaixonado que eu conheço.


        Sou ex jogadora de vôlei – joguei dos 8 aos 21 anos, servi a Seleção Brasileira
        de base dos 14 aos 17, joguei seis Superligas e devo a esse esporte lindo
        tudo que conquistei e aprendi até hoje, e as amizades maravilhosas que tenho
        – e estudante de administração. Belo Horizontina apaixonada pela cidade, pelas
        flores e pelo mar, pelo Sol e pela vida. Meu sonho é viajar o mundo e nutrir
        minha alma, alimentar-me de conhecimento e ser uma pessoa melhor a cada dia.
        Acredito que a verdade e a sinceridade podem mudar o mundo. Acredito que felicidade
        é de responsabilidade nossa e devemos abraçá-la todos os dias, vivendo da
        melhor maneira possível, fazendo o bem e amando muito. Nasci em 26 de agosto
        de 1991 e me chamo Nathalia Daneliczin. Esse é o meu primeiro livro publicado,
        ainda espero escrever e publicar algumas idéias por aí.'
