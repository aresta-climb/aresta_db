                  agarra invertida e faz um movimento duro até a borda, virando reto.
            - boulder:
                nome: Módulo
                dificuldade: V5
                destaque: true
                descricao: Sai com a mão direita no batente de oposição no módulo
                  abaixo do teto e a esquerda de gaston no reglete logo acima do teto.
                  Escala reto passando por agarras de diferentes estilos e domina
                  o bloco.
            - boulder:
                nome: Módulo SDS
                dificuldade: V7
                destaque: true
                descricao: Começa com a mão direita no batente de oposição no “módulo”
                  abaixo do teto e a esquerda bem aberta, em outro batente, em compressão.
                  Faz dois fortes movimentos até entrar no “Módulo”(18). A grande
                  dificuldade deste boulder é tensionar bem o corpo para não encostar
                  na pedra de baixo.
