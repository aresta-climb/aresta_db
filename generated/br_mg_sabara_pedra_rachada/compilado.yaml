        descricao: "# Yin Yang\n\nEsse pequeno aglomerado de blocos, à direita do\
          \ setor do Deslize, começou a ser explorado em 2006, com a abertura do clássico\
          \ “Bicicletinha 2000”. Permaneceu sem novidades expressivas por alguns anos\
          \ até que, em 2011, o escalador Mahavir Jneesh realizou a primeira ascensão\
          \ do boulder “Yang” e, logo após, sua saída sentada denominada “Yin Yang”,\
          \ dois mega clássicos da Pedra Rachada!\n\n| ![Escalador no boulder Yin\
          \ Yang](imagens/setor_yin_yang_p0_i0.webp) |\n| :--: |\n| *Escalador no\
          \ boulder Yin Yang* |\n\n## Acesso (15 min)\n\nA partir do “Estacionamento\
          \ 2”, siga pela trilha principal e, após passar à esquerda do “Bloco 1”,\
          \ continue subindo até o bloco “Lua Cheia” e contorne-o pela direita, de\
          \ onde será possível avistar o setor “Yin Yang” à sua direita. Para acessá-lo,\
          \ basta tomar a trilha à direita em frente ao bloco “Bagagem” que vai em\
          \ direção ao setor.\n\n## Boulders Clássicos\n\n- 19 Fenda Cega v0\n- 7\
          \ Bicicletinha 2000 v5\n- 15 Yin Yang v10/11\n\n| ![Escaladora em teto com\
          \ mar de nuvens ao fundo](imagens/setor_yin_yang_p3_i0.webp) |\n| :--: |\n\
          | *Escaladora em teto com mar de nuvens ao fundo* |\n\n> \"A felicidade\
          \ não está na estrada que leva a algum lugar. A felicidade é a própria estrada.\"\
          \  \n> — *Bob Dylan*\n\n| ![Anúncio Revista PQN - Pão de Queijo Notícias](imagens/setor_yin_yang_p5.webp)\
          \ |\n| :--: |\n| *Anúncio Revista PQN - Pão de Queijo Notícias* |\n\n###\
          \ Revista PQN (Pão de Queijo Notícias)\n\nO nosso PÃO DE QUEIJO É MUITO\
          \ MELHOR que o dos outros!\n\nA revista Pão de Queijo Notícias é uma publicação\
          \ de variedades, moderna com foco no profissional da Comunicação. Publicidade,\
          \ Marketing, Jornalismo, Economia, Sustentabilidade, Moda, Cultura, Esporte,\
          \ Turismo, Automóveis, Franchising, Relações Públicas e muito, muito mais\
          \ para você!\n\n- **Assine:** (31) 2127 4651 | assinar@pqn.com.br | [www.pqn.com.br](http://www.pqn.com.br)\n\
          - **Finalista do Prêmio Sebrae de Jornalismo**\n\n*Destaques da Edição:*\n\
          - **Capa:** Érika Januza, a mineira que faz sucesso na novela das nove –\
          \ *Eu caio na rede!*\n  O comportamento da nova Classe C, que entrou de\
          \ vez na onda tecnológica e terminou o ano de 2013 com 17% de alcance na\
          \ rede - mais que o dobro dos 8% registrados em 2012 - reflete um pouco\
          \ do modo de ser da atriz mineira Érika Januza. Sucesso na novela das 9,\
          \ da Rede Globo, “Em Família”, a mineira de Contagem vive a personagem Alice,\
          \ uma estudante de música, fruto de um estupro coletivo sofrido por sua\
          \ mãe. Com o sucesso, ela mostra-se consciente de seu papel de “Relações\
          \ Públicas” para a cidade mineira e não abre mão de suas raízes e de sua\
          \ interação nas redes sociais. Érika, que adora postar suas fotos no Facebook\
          \ – seja com os amigos, família ou elenco da novela – é fã das novas tecnologias\
          \ do mundo moderno e não liga para essa grande exposição virtual. Vale tudo\
          \ para se aproximar ainda mais de sua legião de fãs e ainda humanizar o\
          \ seu trabalho na telinha.\n- **Entrevista:** Márcio Lacerda e suas duas\
          \ novas conquistas: Carnaval 2014 e o BRT Move.\n- **Negócios:** BH Fala\
          \ a Sua Língua oferece 2300 títulos de jornais de 150 países.\n- **Empreendedor:**\
          \ Carioca edita revista voltada aos imigrantes brasileiros em Portugal.\n\
          - **Carnaval:** Revista PQN cai na folia, lança o bloco “Quem não se comunica,\
          \ se trumbica!” e arrasta multidão.\n- **Turismo:** Você já fez a sua reserva\
          \ de hotel para assistir aos jogos da Copa do Mundo?\n\n| ![Escalador na\
          \ saída do boulder com vista panorâmica para a serra](imagens/setor_yin_yang_p7_i0.webp)\
          \ |\n| :--: |\n| *Escalador na saída do boulder com vista panorâmica para\
          \ a serra* |"
        precomputados:
          total_escaladas: 21
          total_boulders: 21
