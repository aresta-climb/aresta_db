- texto: História
  destino:
    secao_textual:
      conteudo: '# História


        **1991** – A Pedra Rachada começa a ser explorada por três jovens amigos,
        de apenas 16 anos de idade, Fabiano Fernandes, Eustáquio e Emerson Azevedo,
        o Caverna. Eles não tinham carro, subiam a pé de Sabará até o setor e procuravam
        pelas pedras mais altas, para escalar de Top Rope – eles faziam o acesso ao
        topo do bloco e montavam o Top com os equipamentos que tinham na época.


        **1992** – Os três amigos começaram a frequentar outros picos de escalada
        em Minas Gerais, como a Serra do Cipó e a Pedra Branca, e a escalada na Pedra
        Rachada ficou abandonada por um tempo.


        **1996** – Uma nova turma começou a frequentar o setor. Os meninos Chander
        Cristian, Dalber Fernandes “Bim”, Francisco Queiroz “Chico” e Gustavo Rocha
        “Passarinho” não conheciam muito a escalada nem o boulder, mas gostaram da
        idéia de subir pedra e se aventurar no local! Na época não tinham equipamentos
        e escalavam com tênis de futsal. Adoravam o esporte, escalavam alguns boulders
        mais difíceis e arriscavam-se até em alguns highballs.


        **1998** – Chander, Bim, Chico e Passarinho fizeram um curso de escalada com
        Emerson “Caverna”, conseguiram comprar seus primeiros equipamentos e começaram
        a frequentar picos de escalada esportiva. Novamente a Pedra Rachada ficou
        abandonada.


        **2000/2001** – Christian Fernandes animou novamente a turma de Chander e
        Bim, e começaram a explorar a Pedra Rachada. Nesse período foram conquistados
        pelo menos 20 boulders nos blocos 1 e 2!


        **2004** – Em uma madrugada de muita conversa, os escaladores Felipe Álvares,
        o Cabeção e Gustavinho Fontes decidiram conhecer a Pedra Rachada. Ligaram
        para Emerson “Caverna” e às 4h da manhã passaram em sua casa para começar
        a empreitada. Ao nascer do Sol, já tinham escalado muito nos blocos 1 e 2,
        e logo no início da manhã voltaram para o trabalho. Maravilhados com a beleza
        e potencial da Pedra Rachada, começaram a fazer divulgação boca a boca do
        setor e juntar os amigos para escalar no local.


        **2005** – Nesse ano, Belo Horizonte sediou o Campeonato Brasileiro de Escalada
        em Belo Horizonte. A capital recebeu nomes fortes da escalada brasileira,
        como Tiago Veloso, Mateus Veloso e Diogo Ratacheski. Felipe “Cabeção” e Gustavinho
        aproveitaram a oportunidade e levaram a turma para conhecer a Pedra Rachada.
        Nesse dia foram abertos os boulders “Tosco” v8, “Rollings Stones” v8 e “Gaston
        a la meson” v6, super clássicos do setor!


        **2005** – Em agosto do mesmo ano, Felipe “Cabeção” e Gustavinho, que estavam
        bem dedicados ao setor, decidiram realizar o 1º Festival da Pedra Rachada.


        **2007** – Cabeção lança, em parceria com Daniel Mentes, o TioDan, o 1º croqui
        da Pedra Rachada! O croqui foi lançado no 3º Festival da Pedra Rachada, um
        evento de grande repercussão que levantou e apresentou o setor para o Brasil!


        **2009** – O escalador Rafael Passos realiza a primeira ascensão (FA) do “Projeto
        Sabará” e sugere o grau v12, a linha mais clássica do local! Este é, até hoje,
        o boulder mais difícil já aberto no setor.


        **2012** – Felipe “Cabeção” e Daniel “TioDan” organizaram a 1ª Ação Pedra
        Rachada de Cara Nova. A ação consistiu em limpar as trilhas e melhorar as
        bases dos blocos, com o deslocamento de pedras e criação de contenções no
        caso de buracos ou descidas íngremes. O objetivo era melhorar o setor e torná-lo
        mais seguro para a prática da escalada. As ações tornaram-se um evento tradicional
        no pico.


        **2014** – O Guia de Escalada Pedra Rachada Bouldering é lançado no 10º Festival
        Pedra Rachada Bouldering em homenagem ao aniversário do setor, um presente
        para os aficionados pela escalada em boulder! Foi o primeiro guia completo
        de escalada a ser lançado no Brasil! O Festival contou com a presença de grandes
        escaladores de todo o país!'
