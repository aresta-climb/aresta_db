        descricao: "# Entrada\n\n| ![Escalador no teto do Setor Entrada](imagens/setor_entrada_p0_i0.webp)\
          \ |\n| :--: |\n| *Escalador no teto do Setor Entrada* |\n\nO mais frequentado\
          \ setor da Pedra Rachada dá as boas vindas aos seus visitantes com dois\
          \ grandes blocos, conhecidos por “Bloco 1” e “Bloco 2”. São quase 60 escaladas\
          \ com os mais variados estilos e diversos clássicos de todos os graus. Neste\
          \ setor também encontra-se a escalada mais difícil já encadenada em toda\
          \ Pedra Rachada, o incrível “Projeto Sabará”. Não deixe de checar este boulder\
          \ único, nem que seja para apreciar sua imponente linha!\n\n## Acesso (15\
          \ min)\n\nDo estacionamento, pegue a estrada que sobe em direção às pedras\
          \ até chegar a um plano onde se encontra o primeiro bloco, o “Libélula”.\
          \ De lá, continue reto pela trilha principal que segue por mais 1min para\
          \ acessar os gigantes “Bloco 1” e “Bloco 2”. Os outros blocos estão há menos\
          \ de 1min deles.\n\n## Boulders Clássicos\n\n- **8. Easy** – V1 (listado\
          \ como V0 nos destaques)\n- **13. Pipe line** – V2\n- **42. Ziglyn** – V4\n\
          - **46. Cadê minha força?** – V5\n- **36. Rala frek lek** – V7\n- **30.\
          \ Projeto Sabará** – V12\n\n> \"A felicidade só é real quando compartilhada.\"\
          \n> \n> — *Christopher McCandless*\n\n| ![Detalhe das mãos do escalador\
          \ em reglete na rocha com crashpad](imagens/setor_entrada_p3_i0.webp) |\n\
          | :--: |\n| *Detalhe das mãos do escalador em reglete na rocha com crashpad*\
          \ |\n\n| ![Escalador no Bloco 2 sob céu tempestuoso ao entardecer](imagens/setor_entrada_p7_i0.webp)\
          \ |\n| :--: |\n| *Escalador no Bloco 2 sob céu tempestuoso ao entardecer*\
          \ |\n\n> \"Quanto mais eu me elevo, menor eu pareço aos olhos de quem não\
          \ sabe voar.\"\n> \n> — *Friedrich Nietzsche*\n\n| ![Escalador na linha\
          \ Nave com vista panorâmica da serra](imagens/setor_entrada_p11_i1.webp)\
          \ |\n| :--: |\n| *Escalador na linha Nave com vista panorâmica da serra*\
          \ |\n\n## Blocos do Setor\n\n- **Bloco A – Libélula**: boulders 1 a 3.\n\
          - **Bloco B – Bloco 1**: boulders 4 a 23.\n- **Bloco C – Bloco 2**: boulders\
          \ 24 a 48 (incluindo o clássico Projeto Sabará V12).\n- **Bloco D – Chupa\
          \ Lombriga**: boulders 49 a 51.\n- **Bloco E – Abraço do Calango**: boulders\
          \ 52 a 54.\n- **Bloco F – Nave**: boulders 55 e 56.\n\n### Esquema dos Blocos\
          \ e Conexões\n- A trilha de subida passa inicialmente pelo **Bloco A (Libélula)**.\n\
          - Seguindo pela trilha principal chega-se aos grandes blocos centrais: **Bloco\
          \ B (Bloco 1)** e **Bloco C (Bloco 2)**.\n- A partir da área dos blocos\
          \ Libélula e Bloco 1 ramificam-se as trilhas secundárias para o **Setor\
          \ Lua Cheia** (à esquerda) e para o **Setor Sono do Calango** (à direita).\n\
          - Próximos ao Bloco 2 encontram-se os blocos **D (Chupa Lombriga)**, **E\
          \ (Abraço do Calango)** e, mais acima na crista, o **F (Nave)**."
        precomputados:
          total_escaladas: 56
          total_boulders: 56
