            - boulder:
                nome: La olla
                dificuldade: VB
                descricao: Sai sentado com as mãos em um batente e atravessa para
                  a esquerda virando na parte mais fácil do negativo.
            - boulder:
                nome: Mayday
                dificuldade: VB
                descricao: Começa como o “La olla” (6) e segue pra direita pela fenda.
            - boulder:
                nome: Positive vibrations
                dificuldade: VB
                destaque: true
                descricao: Boulder que escala o positivo em aderência.
            - boulder:
                nome: Macadâmia
                dificuldade: VB
                descricao: Sai sentado com a mão direita em um bico e a esquerda em
                  um reglete bom e toca reto por agarras boas à esquerda da aresta.
            - boulder:
                nome: King Kong
                dificuldade: VB
                destaque: true
                descricao: Começa sentado com as mãos juntas em um bico na aresta
                  e escala abraçando a aresta.
            - boulder:
                nome: FormiguinhaZ
                dificuldade: VB
                descricao: Boulder que sai em pé, em umas lacas logo à direita da
                  aresta, e escala diagonalmente pra direita por agarras boas.
            - boulder:
                nome: Buttstache
                dificuldade: VB
                descricao: Sai em pé à direita de uma pequena árvore e toca diagonalmente
                  à direita, até uma fenda, e depois em direção à canaleta.
            descricao: '# Bloco B - Positive Vibrations'
            precomputados:
              total_escaladas: 7
              total_boulders: 7
