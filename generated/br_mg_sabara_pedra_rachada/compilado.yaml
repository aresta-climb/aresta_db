        descricao: "# Deslize\n\nSetor com uma grande concentração de boulders, principalmente\
          \ do circuito amarelo, o Deslize é também berço do boulder com o maior registro\
          \ de cadenas no site 8a.nu, o mega-clássico “Lua cheia” v5. Neste setor\
          \ também está o primeiro boulder aberto em um teto na Pedra Rachada, o incrível\
          \ “Terceira entrada” v7 além de muitas outras escaladas clássicas, como\
          \ o bote do “Carne moída” v6, o “Deslize” v8 e o “Hey Fred”, um v10 no melhor\
          \ estilo compressão da Pedra Rachada!\n\n| ![Escalador em teto no Setor\
          \ Deslize](imagens/setor_deslize_p0_i0.webp) |\n| :--: |\n| *Escalador em\
          \ teto no Setor Deslize* |\n\n## Acesso (15 min)\n\nPara acessar este setor,\
          \ a partir do “Estacionamento 2”, pegue a trilha principal logo em frente\
          \ e siga reto. Ao passar o “Bloco 1”, à sua direita, siga pela trilha que\
          \ sobe ao lado dela por mais 2min e chegará ao primeiro bloco deste setor,\
          \ o “Lua cheia”. Todos os outros blocos estão a menos de 50m daí.\n\n##\
          \ Mapa de Blocos\n\n| ![Mapa esquemático de blocos do Setor Deslize](imagens/setor_deslize_p1_i1.webp)\
          \ |\n| :--: |\n| *Mapa esquemático de blocos do Setor Deslize* |\n\n###\
          \ Blocos\n- **A** – Lua Cheia\n- **B** – Deslize\n- **C** – Pequenino\n\
          - **D** – Bagagem\n- **E** – Hey Fred\n- **F** – Bom Boulder\n- **G** –\
          \ Rei Leão\n- **H** – Musgo Centenário\n- **I** – Zafar\n\n### Conexões\
          \ de Trilhas\n- Trilha a noroeste para o **Setor Yin Yang**\n- Trilha a\
          \ oeste para o **Setor Rolling Stones**\n- Trilha a leste vindo do **Setor\
          \ Entrada**\n- Trilha a sudeste para o **Setor Sono do Calango**\n\n## Boulders\
          \ Clássicos\n\n- **42. Musgo centenário** – V1\n- **1. Rala peito** – V2\n\
          - **6. Lua cheia** – V5\n- **15. Terceira entrada** – V7\n- **21. Bagagem**\
          \ – V6\n- **11. Deslize** – V8\n- **26. Hey Fred** – V10\n\n> \"O mais importante\
          \ não é chegar ao cume, mas tentar e aprender algo ao longo do caminho.\"\
          \  \n> — *Ester Sabadell*\n\n| ![Escalador em boulder clássico com vista\
          \ panorâmica da serra](imagens/setor_deslize_p3_i0.webp) |\n| :--: |\n|\
          \ *Escalador em boulder clássico com vista panorâmica da serra* |\n\n| ![Escalador\
          \ executando movimento de calcanhar em teto](imagens/setor_deslize_p5_i0.webp)\
          \ |\n| :--: |\n| *Escalador executando movimento de calcanhar em teto* |\n\
          \n> \"O tempo dura bastante para aqueles que sabem aproveitá-lo.\"  \n>\
          \ — *Leonardo Da Vinci*\n\n| ![Escalador dominando o topo de bloco imponente](imagens/setor_deslize_p7_i0.webp)\
          \ |\n| :--: |\n| *Escalador dominando o topo de bloco imponente* |\n\n|\
          \ ![Escalador em teto negativo com mar de nuvens ao fundo e segurador com\
          \ crashpad](imagens/setor_deslize_p9_i0.webp) |\n| :--: |\n| *Escalador\
          \ em teto negativo com mar de nuvens ao fundo e segurador com crashpad*\
          \ |\n\n| ![Projeto: Expedição Am420nia 2015 no Salto Angel, Venezuela](imagens/setor_deslize_p10_i0.webp)\
          \ |\n| :--: |\n| *Projeto: Expedição Am420nia 2015 no Salto Angel, Venezuela*\
          \ |\n\n*Salto Angel, Venezuela. 979 metros, a maior cachoeira do mundo.\
          \ Projeto: Expedição Am420nia 2015. Acesse o site am420nia.com e saiba como\
          \ participar dessa aventura.*\n\n| ![Detalhe das mãos do escalador nas agarras](imagens/setor_deslize_p11_i0.webp)\
          \ |\n| :--: |\n| *Detalhe das mãos do escalador nas agarras* |"
        precomputados:
          total_escaladas: 48
          total_boulders: 48
