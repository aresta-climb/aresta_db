        descricao: "Em 2013, os trabalhos no bloco “Pantaloneta” proporcionaram o\
          \ surgimento de vários novos boulders que confirmaram este setor como um\
          \ dos melhores da Pedra Rachada. Os blocos “Rolling Stones” e “Pantaloneta”,\
          \ que juntos somam a maior concentração de clássicos do local, são obrigatórios\
          \ a qualquer visitante do local. Aproveite também para conhecer os blocos\
          \ “Gaston a la meson” e as escaladas do bloco “Universo Paralello”.\n\n\
          | ![Escaladora dominando o cume da falésia com vista panorâmica dos vales\
          \ e montanhas](imagens/setor_rolling_stones_p0_i0.webp) |\n| :--: |\n| *Escaladora\
          \ dominando o cume da falésia com vista panorâmica dos vales e montanhas*\
          \ |\n\n## Acesso (20 min)\n\nEste setor fica logo acima do setor “Deslize”.\
          \ Para acessá-lo, basta seguir a trilha principal que sobe passando pelo\
          \ setor Entrada (à esquerda do “Bloco 1”) e pelo setor “Deslize”, contornando\
          \ o bloco Lua cheia pela direita. Logo após o bloco “Zafar”, a primeira\
          \ trilha à esquerda dá acesso aos blocos “Gaston a la meson”, “Casulo” e\
          \ “Marrento”. Continuando reto estará bloco “Rolling Stones” e o bloco “Eject”.\
          \ Um pouco mais a direita está o bloco “Universo Paralello” e, acima dele,\
          \ o complexo das aranhas, com os blocos “Pantaloneta”, “Octopus”, “Protons”\
          \ e “Aranha albina”.\n\n### Blocos\n- **A** – Gastón a la Mesón\n- **B**\
          \ – Casulo\n- **C** – Marrento\n- **D** – Rolling Stones\n- **E** – Eject\n\
          - **F** – Universo Paralelo\n- **G** – Pantaloneta\n- **H** – Octopus\n\
          - **I** – Protóns\n- **J** – Aranha Albina\n\n## Boulders Clássicos\n\n\
          - **28. The Doors** – V5\n- **7. Gastón a la meson** – V6\n- **24. Rolling\
          \ Stones** – V8\n- **26. Amanhã vai ser outro dia** – V9\n- **36. Universo\
          \ Paralello** – V9\n- **47. Pantaloneta** – V7\n- **45. Tapete mágico**\
          \ – V10\n- **61. Aladim** – V11\n- **64. Vaqueros** – V10\n\n| ![Escalador\
          \ executando o movimento duro de gastón no teto do bloco Gastón a la Mesón](imagens/setor_rolling_stones_p3_i0.webp)\
          \ |\n| :--: |\n| *Escalador executando o movimento duro de gastón no teto\
          \ do bloco Gastón a la Mesón* |\n\n> \"Quando tudo o que existe entre você\
          \ e o chão é uma coisa chamada segurança.\"  \n> — *Alto Estilo*\n\n| ![Alto\
          \ Estilo: Apoiando suas aventuras desde 1988](imagens/setor_rolling_stones_p4.webp)\
          \ |\n| :--: |\n| *Alto Estilo: Apoiando suas aventuras desde 1988* |\n\n\
          *Alto Estilo. Apoiando suas aventuras desde 1988. Acesse o site altoestilo.com.*\n\
          \n| ![Escalador no negativo do bloco Rolling Stones cercado pela vegetação\
          \ nativa](imagens/setor_rolling_stones_p7_i0.webp) |\n| :--: |\n| *Escalador\
          \ no negativo do bloco Rolling Stones cercado pela vegetação nativa* |\n\
          \n| ![Escalador em teto horizontal com calcanhar encaixado no bloco Universo\
          \ Paralelo](imagens/setor_rolling_stones_p9_i0.webp) |\n| :--: |\n| *Escalador\
          \ em teto horizontal com calcanhar encaixado no bloco Universo Paralelo*\
          \ |\n\n| ![Escalador no teto na saída do boulder Octopus com segurador e\
          \ crashpads na base](imagens/setor_rolling_stones_p12_i0.webp) |\n| :--:\
          \ |\n| *Escalador no teto na saída do boulder Octopus com segurador e crashpads\
          \ na base* |\n\n> \"Linha Stretch Limits: Alta performance para esportes\
          \ outdoor.\"  \n> — *4Climb*"
