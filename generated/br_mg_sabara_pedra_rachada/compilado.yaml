        descricao: "# Tosco\n\nSetor que abriga uma grande quantidade de boulders\
          \ do circuito verde e azul, com destaque para o clássico “Aresta visual”\
          \ v3. Por outro lado, se você escala boulders do circuito amarelo ou vermelho\
          \ e gosta de dinâmicos, este será um de seus setores preferidos, com escaladas\
          \ incríveis deste estilo nos blocos “Aresta visual”, “Tosco” e “Motricidade”.\
          \ Mas não pense que a diversão acaba por aí, se você curte aderência não\
          \ deixe de visitar o mítico “Frita pé” e quebrar a cabeça desvendando seus\
          \ betas!\n\n| ![Escalador no Setor Tosco](imagens/setor_tosco_p0_i0.webp)\
          \ |\n| :--: |\n| *Escalador no Setor Tosco* |\n\n## Acesso (25 min)\n\n\
          A partir do “Estacionamento 2” siga a trilha principal, passando à esquerda\
          \ do “Bloco 1” e à direita do bloco “Lua cheia” até chegar ao bloco “Rolling\
