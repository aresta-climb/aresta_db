            nome: Bloco A - Traverse ao Tito
            mapas:
            - caminho_imagem_mapa: imagens/setor_estacionamento_p2_i1.webp
              largura_mapa: 1099
              altura_mapa: 710
              referencias:
              - escalada: Esquenta o prato
                ids:
                - '1'
              - escalada: Traverse ao Tito
                ids:
                - '2'
              - escalada: Chupa karma
                ids:
                - '3'
              - escalada: Taco o fogo
                ids:
                - '4'
              - escalada: Pum
                ids:
                - '5'
            escaladas:
            - boulder:
                nome: Esquenta o prato
                dificuldade: V3
                descricao: Sai sentado com a mão direita em um pequeno reglete/batente
                  de gaston e a esquerda em um batente invertido, fazendo um movimento
                  forte e continuando reto por agarras boas até o topo.
            - boulder:
                nome: Traverse ao Tito
                dificuldade: V5
                destaque: true
                descricao: Problema aberto em homenagem à jovem promessa da escalada
                  italiana. Sai como o “Esquenta o prato” (1) e atravessa pelo alto
                  para a direita, passando por um buraco e pelo módulo até um batente
                  abaulado, finalizando com um movimento longo até a borda.
            - boulder:
                nome: Chupa karma
                dificuldade: V5
                destaque: true
                descricao: Sai em pé em 02 regletes/batentes invertidos e faz um movimento
                  forte para uma agarra boa, terminando como o “Taco o fogo” (4).
            - boulder:
                nome: Taco o fogo
                dificuldade: V4
                descricao: Começa sentado, com a mão direita bem baixa num reglete
                  e a esquerda num batente/pinça de lado e toca reto.
            - boulder:
                nome: Pum
                dificuldade: V0
                destaque: true
                descricao: Sai em pé com a mão direita num reglete de gaston e a esquerda
                  em uma invertida logo acima escalando por agarras boas.
            descricao: '# Bloco A - Traverse ao Tito'
            precomputados:
              total_escaladas: 5
              total_boulders: 5
