            - boulder:
                nome: Enverga bambu
                dificuldade: V5
                conquistadores:
                - Tomaz Hamdan
                data_abertura: '2011'
                descricao: Começa com as mãos juntas no buraco abaulado embaixo do
                  teto e escala pra esquerda, em direção à aresta.
            - boulder:
                nome: Sono do calango
                dificuldade: V3
                destaque: true
                descricao: Sai com a mão direita no reglete – uma faca! – de gaston
                  na parede do lado e com a esquerda em um reglete/bidedo acima do
                  teto. Vai pra direita passando por agarras boas e finaliza por regletes
                  na face vertical.
            - boulder:
                nome: Sono do calango SDS
                dificuldade: V7
                destaque: true
                conquistadores:
                - Frederico Gonçalves
                data_abertura: '2011'
                descricao: Começa com a mão esquerda no bico/bidedo embaixo do teto
                  e a direita no reglete invertido no tetinho mais baixo e entra no
                  “Sono do calango” (24).
            - boulder:
                nome: Sonâmbulo
                dificuldade: V5
                destaque: true
