        descricao: "# Cume\n\nAlém de algumas das melhores escaladas de toda a Pedra\
          \ Rachada em todos os circuitos de grau, o setor “Cume” impressiona também\
          \ pelo visual de tirar o fôlego. São quase 1500m de altitude que proporcionam\
          \ 360º de uma vista estonteante de toda a região metropolitana de Belo Horizonte\
          \ e seus arredores, com um pôr do sol digno de filme. Difícil aqui é decidir\
          \ qual linha escalar, mas, independente do seu grau de escalada, não saia\
          \ de lá sem ao menos conhecer o mega-clássico “Blood América”.\n\n| ![Escalador\
          \ no boulder Blood América](imagens/setor_cume_p0_i0.webp) |\n| :--: |\n\
          | *Escalador no boulder Blood América* |\n\n## Acesso (30 min)\n\nA partir\
          \ do “Estacionamento 2”, siga a trilha principal que passa à esquerda do\
          \ “Bloco 1”, à direita do bloco “Lua cheia” e chega ao bloco “Rolling Stones”.\
          \ Contorne-o pela direita e siga a trilha pegando a segunda trilha que sobe\
          \ à esquerda, em direção à grande pedra com uma rachadura no meio (em forma\
          \ de boca). O setor “Cume” consiste em um grande platô com um aglomerado\
          \ de blocos no cume do morro.\n\n## Boulders Clássicos\n\n- **4. Mosquitos**\
          \ – V2\n- **19. Sai do teto** – V3\n- **28. Seriema** – V3\n- **8. Blood\
          \ América** – V4\n- **12. Mistral** – V7\n- **11. The summit** – V7\n- **21.\
          \ Laranja mecânica** – V8\n- **14. Testarossa** – V10\n\n> \"Superar o fácil\
          \ não tem mérito, é obrigação; vencer o difícil é glorificante; ultrapassar\
          \ o outrora impossível é esplendoroso.\"  \n> — *Alexandre Fonteles*\n\n\
          | ![Escaladora no boulder Ulísses](imagens/setor_cume_p3_i0.webp) |\n| :--:\
          \ |\n| *Escaladora no boulder Ulísses* |\n\n| ![Escalada no pôr do sol no\
          \ boulder Blood América](imagens/setor_cume_p4_i0.webp) |\n| :--: |\n| *Escalada\
          \ no pôr do sol no boulder Blood América* |\n\n> \"É melhor viver dez anos\
          \ a mil do que mil anos a dez.\"  \n> — *Lobão*\n\n| ![Escalador no bloco\
          \ Testarossa](imagens/setor_cume_p7_i0.webp) |\n| :--: |\n| *Escalador no\
          \ bloco Testarossa* |"
        precomputados:
          total_escaladas: 33
          total_boulders: 33
