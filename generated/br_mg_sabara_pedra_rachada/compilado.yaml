        descricao: "# Pena de Ganso\n\n| ![Escalador no Setor Pena de Ganso](imagens/setor_pena_de_ganso_p0_i0.webp)\
          \ |\n| :--: |\n| *Escalador no Setor Pena de Ganso* |\n\nApós muito tempo\
          \ sem muitas novidades, no ano de 2013 novas linhas abertas nos blocos “Gangrena”\
          \ e “Pena de ganso” colocaram o setor mais uma vez em movimento. Apesar\
          \ destas novas linhas, o maior destaque para este setor continua sendo uma\
          \ de suas escaladas mais antigas, o clássico “Pena de ganso”, que possui\
          \ uma movimentação única.\n\n## Acesso (15 min)\n\nPara acessar este setor,\
          \ a partir do “Estacionamento 2”, siga a trilha principal que sobe passando\
          \ à esquerda do “Bloco 1” e à direita do bloco “Lua cheia”, chegando ao\
          \ bloco “Rolling Stones”. Contorne-o pela direita e siga reto pela trilha\
          \ por cerca de 1min até o primeiro bloco deste setor, o “Gangrena”. Os outros\
          \ blocos estão mais a frente, continuando pela trilha à direita deste bloco.\n\
          \n## Boulders Clássicos\n\n- **25. Tartaruga** – V1\n- **23. Lesma** – V2\n\
          - **3. Aderência** – V3\n- **24. Caramujo** – V4\n- **19. Lacrimogênio**\
          \ – V6\n- **15. Pena de ganso** – V8\n\n| ![Escaladora com lanterna de cabeça\
          \ na Pedra Rachada](imagens/setor_pena_de_ganso_p3_i0.webp) |\n| :--: |\n\
          | *Escaladora com lanterna de cabeça na Pedra Rachada* |\n\n> \"A coisa\
          \ mais essencial do espírito vivo de um homem é sua paixão pela aventura.\
          \ A alegria da vida vem de nossos encontros com novas experiências.\"\n\
          > \n> — *Into The Wild*\n\n## Blocos do Setor\n\n- **Bloco A – Gangrena**:\
          \ boulders 1 a 8 (e 9 e 10 na face posterior).\n- **Bloco B – Exilado**:\
          \ boulders 11 e 12.\n- **Bloco C – Pena de Ganso**: boulders 13 a 20.\n\
          - **Bloco D – Escondido**: boulder 21.\n- **Bloco E – Caramujo**: boulders\
          \ 22 a 25."
        precomputados:
          total_escaladas: 25
          total_boulders: 25
