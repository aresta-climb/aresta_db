        descricao: "# Canaleta\n\nO setor menos explorado de todos abriga uma das\
          \ escaladas mais clássicas da Pedra Rachada. Seu nome deve-se à sua formação,\
          \ uma espécie de canaleta de blocos que se estende por toda a “crista” do\
          \ morro, de norte a sul. São inúmeros blocos praticamente inexplorados em\
          \ toda a sua extensão, que se concentram principalmente a sudoeste do setor\
          \ ”Sono do calango”, um convite aos caçadores de boulders de plantão.\n\n\
          | ![Escalador no Setor Canaleta](imagens/setor_canaleta_p0_i0.webp) |\n\
          | :--: |\n| *Escalador no Setor Canaleta* |\n\n## Acesso (20 min)\n\nPara\
          \ chegar a este setor, a melhor forma é pegar a trilha principal a partir\
          \ do “Estacionamento 2” e entrar à esquerda na primeira bifurcação, pouco\
          \ antes da placa “Seja bem vindo a Pedra Rachada”. Para acessar os blocos\
          \ “Cavalo de Tróia” e “Destinos”, pegue para a direita em frente ao bloco\
          \ “High vibe”, 50m após a bifurcação.\n\n## Boulders Clássicos\n\n- **30.\
          \ The Dark Side of the Moon** – V3\n- **12. Logística** – V5\n- **28. Prisma**\
          \ – V6\n- **19. Toca da onça** – V6\n- **15. Puma** – V8\n- **17. Esparrachado**\
          \ – V8\n\n> \"Escalada em particular, é um passatempo paradoxalmente intelectual,\
          \ mas com a seguinte diferença: você tem que pensar com seu corpo. [...]\
          \ Por um curto período eu sou diretamente responsável pelas minhas ações.\
          \ No belo, silencioso, mundo das montanhas, me parece válido esse pequeno\
          \ risco.\"  \n> — *Al Alvarez*\n\n## Blocos do Setor\n\n- **Bloco A – Cavalo\
          \ de Tróia**: boulders 1 a 3.\n- **Bloco B – Destinos**: boulders 4 a 7.\n\
          - **Bloco C – Forrest Gump**: boulder 8.\n- **Bloco D – Fábulas**: boulder\
          \ 9.\n- **Bloco E – Logística**: boulders 10 a 12.\n- **Bloco F – Puma**:\
          \ boulders 13 a 15.\n- **Bloco G – Esparrachado**: boulders 16 a 23.\n-\
          \ **Bloco H – Beto Carneiro**: boulders 24 a 27.\n- **Bloco I – Prisma**:\
          \ boulders 28 a 33.\n\n| ![Suporte Vertical - Alpinismo Industrial](imagens/setor_canaleta_p4_i0.webp)\
          \ |\n| :--: |\n| *Suporte Vertical - Alpinismo Industrial* |\n\n*Suporte\
          \ Vertical – Alpinismo Industrial: Soluções inteligentes para trabalhos\
          \ verticais. (31) 3607-2440 / (31) 9233-2075 | contato@suportevertical.com.br\
          \ | suportevertical.com.br*"
        precomputados:
          total_escaladas: 33
          total_boulders: 33
