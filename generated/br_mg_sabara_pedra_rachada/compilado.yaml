                nome: Barba ruiva
                dificuldade: V0
                destaque: true
                descricao: Começa sentado com a mão direita em um reglete/pocket e
                  a esquerda em um reglete e escala o vertical técnico.
            - boulder:
                nome: Davy Jones
                dificuldade: V0
                destaque: true
                descricao: Escala a proa do bloco, começando em pé com a mão direita
                  em um bico e a esquerda em um batente de oposição.
            - boulder:
                nome: Fenda do Biquíni
                dificuldade: V0
                descricao: Sai sentado com as mãos juntas em uma agarra boa, toca
                  reto até a borda e vira à esquerda do módulo.
            - boulder:
                nome: Motim
                dificuldade: V0
                destaque: true
                descricao: Começa como o “Fenda do biquíni” (14) e domina à direita
                  do módulo.
            descricao: '# Bloco C - Davy Jones'
            precomputados:
              total_escaladas: 4
              total_boulders: 4
