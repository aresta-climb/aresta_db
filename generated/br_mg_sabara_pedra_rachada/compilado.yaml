                  “Histeria” (25).
            - boulder:
                nome: Histeria
                dificuldade: V0
                descricao: Sai sentado com as mãos em dois batentes verticais e escala
                  a face negativa pela aresta por agarras boas.
            - boulder:
                nome: Café com leite
                dificuldade: VB
                destaque: true
                descricao: Escala o meio da face positiva por agarras boas.
            descricao: '# Bloco E - Psicotrópicos'
            precomputados:
