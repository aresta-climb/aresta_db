                  (33).
            - boulder:
                nome: Projeto Taurina
                dificuldade: V12_BARRA_V13
                descricao: 'Projeto que sai sentado com as mãos nas agarras mais baixas:
                  um batente, um gaston, ou um bidedo, e faz dois fortes movimentos
                  até chegar no “Energético” (33) e finalizar como ele.'
