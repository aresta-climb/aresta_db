        descricao: "# Daqui a 20 Anos\n\nÚltimo setor antes do cume da Pedra Rachada\
          \ que, apesar de possuir poucos blocos, guarda algumas das escaladas mais\
          \ desafiadoras mentalmente de todo o complexo. Dois clássicos highball fazem\
          \ deste setor um dos preferidos de muitos viciados em adrenalina. Se você\
          \ gosta de apertar, não deixe de tentar o único “Amanita” v11.\n\n| ![Escalada\
          \ no Setor Daqui a 20 Anos](imagens/setor_daqui_a_20_anos_p0_i0.webp) |\n\
          | :--: |\n| *Escalada no Setor Daqui a 20 Anos* |\n\n## Acesso (25 min)\n\
          \nEste é o último setor antes do cume. Para acessá-lo, a partir do “Estacionamento\
          \ 2”, siga a trilha principal que sobe passando à esquerda do “Bloco 1”\
          \ e à direita do bloco “Lua cheia”, chegando ao bloco “Rolling Stones”.\
          \ Contorne-o pela direita e siga a trilha pegando a segunda trilha que sobe\
          \ à esquerda, em direção à grande pedra com uma rachadura no meio (em forma\
          \ de boca). O primeiro bloco, o “Análise crítica” estará logo acima, uns\
          \ 100m, à sua direita.\n\n## Boulders Clássicos\n\n- 4 Surpresa v3\n- 1\
          \ Análise crítica v6\n- 2 Daqui a 20 anos v7\n- 3 Amanita v11\n\n| ![Escalador\
          \ no boulder Amanita v11](imagens/setor_daqui_a_20_anos_p4_i0.webp) |\n\
          | :--: |\n| *Escalador no boulder Amanita v11* |\n\n> \"No que diz respeito\
          \ ao empenho, ao compromisso, ao esforço, à dedicação, não existe meio termo.\
          \ Ou você faz uma coisa bem feita ou não faz.\"  \n> — *Airton Senna*\n\n\
          | ![Anúncio 4Climb](imagens/setor_daqui_a_20_anos_p3_i0.webp) |\n| :--:\
          \ |\n| *Anúncio 4Climb* |\n\n### 4Climb\n\nOs melhores produtos para as\
          \ melhores experiências. Experimente essa vibe.  \n*Foto: Murilo Vargas*"
