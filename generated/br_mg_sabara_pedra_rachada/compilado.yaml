                  alta em um buraco e a direita baixa em um reglete invertido no teto.
            - boulder:
                nome: Maré na virada
                dificuldade: V5
                destaque: true
                conquistadores:
                - Mahavir Jneesh
                data_abertura: '2008'
                descricao: Sai sentado com as mãos juntas em uma laca invertida e
                  escala comprimindo o “módulo”.
            - boulder:
                nome: Orquídea
                dificuldade: V3
                destaque: true
                descricao: Sai sentado com as mãos juntas em agarras boas à direita
