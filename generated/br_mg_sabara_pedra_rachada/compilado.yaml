        descricao: "# Sono do Calango\n\n| ![Escalador no Setor Sono do Calango](imagens/setor_sono_do_calango_p0_i0.webp)\
          \ |\n| :--: |\n| *Escalador no Setor Sono do Calango* |\n\nSetor com uma\
          \ grande concentração de boulders do circuito verde e muitas linhas clássicas.\
          \ Apesar de estar ao lado do Setor Entrada, é muito pouco conhecido e freqüentado.\
          \ É também lugar das duas únicas vias de toda a Rachada, que valem muito\
          \ a pena serem escaladas! O destaque para este setor fica por conta dos\
          \ blocos “High vibe”, “Das vias” e “Sono do calango”, que possuem escaladas\
          \ incríveis dos mais variados graus de dificuldade.\n\n## Acesso (15 min)\n\
          \nO melhor acesso para este setor, a partir do “Estacionamento 2” é pegar\
          \ a trilha principal até o “Bloco 2” e continuar pela trilha que sobe à\
          \ direita dele por 1min, chegando ao gigante bloco “Das vias”. Chegando\
          \ a ele, o bloco “Sono do calango”, que da nome ao setor, está à direita,\
          \ poucos metros mais acima. Para acessar os outros blocos, basta seguir\
          \ a trilha à esquerda do bloco “Das vias”.\n\n## Boulders Clássicos\n\n\
          - **12. Vendo a vó pela greta** – V0\n- **28. Chaparam os bago** – V1\n\
          - **24. Sono do calango** – V3\n- **20. Bromélia** – V4\n- **19. Módulo\
          \ SDS** – V7\n\n> \"As montanhas são uma espécie de reino mágico onde, por\
          \ meio de algum encantamento, eu me sinto a pessoa mais feliz do mundo.\"\
          \n> \n> — *Bernardo Collares*\n\n| ![Escalador no highball Vendo a vó pela\
          \ greta com seguranças de crashpad na base](imagens/setor_sono_do_calango_p4_i0.webp)\
          \ |\n| :--: |\n| *Escalador no highball Vendo a vó pela greta com seguranças\
          \ de crashpad na base* |\n\n| ![Escalador dominando o topo do bloco visto\
          \ através da vegetação](imagens/setor_sono_do_calango_p5_i0.webp) |\n| :--:\
          \ |\n| *Escalador dominando o topo do bloco visto através da vegetação*\
          \ |\n\n## Blocos do Setor\n\n- **Bloco A – High Vibe**: boulders 1 e 2.\n\
          - **Bloco B – Batentes**: boulders 3 e 4.\n- **Bloco C – Rala Bucho**: boulders\
          \ 5 e 6.\n- **Bloco D – Varejeira**: boulder 7.\n- **Bloco E – Tótem**:\
          \ boulder 8.\n- **Bloco F – Pinça**: boulders 9 a 11.\n- **Bloco G – Das\
          \ Vias**: boulders e vias 12 a 16.\n- **Bloco H – Sono do Calango**: boulders\
          \ 17 a 34."
        precomputados:
          total_escaladas: 34
          total_boulders: 34
