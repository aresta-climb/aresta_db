              total_boulders: 3
        descricao: "# Estacionamento\n\nOs trabalhos neste setor começaram apenas\
          \ em 2007, com o descobrimento do imponente Bloco 0 e a abertura de seus\
          \ primeiros boulders, como o incrível “Verticale” v5. Durante algum tempo\
          \ o setor permaneceu sem novidades até que, em 2011, o Bloco 0 voltou a\
          \ ser freqüentado e recebeu os FAs mais duros do setor, incluindo o mítico\
          \ “Medalhão” v10, que até os dias de hoje recebeu poucas cadenas. Em 2013,\
          \ os blocos mais próximos do estacionamento começaram a ser explorados e\
          \ se mostraram um excelente playground para os iniciantes.\n\n| ![Escalada\
          \ no Setor Estacionamento](imagens/setor_estacionamento_p0_i0.webp) |\n\
          | :--: |\n| *Escalada no Setor Estacionamento* |\n\n## Acesso (10 min)\n\
          \nAo estacionar o carro é possível avistar, a cerca de 100m, os 03 primeiros\
          \ blocos. Para acessá-los basta pegar a trilha óbvia que vai em direção\
          \ a eles por cerca de 1min. Já para os outros blocos, siga a estrada que\
          \ sobe em direção ao setor “Entrada” e, pouco antes da forte curva à direita,\
          \ você verá duas trilhas: a da direita te leva ao bloco “Psicotrópicos”\
          \ e a da esquerda ao “Bloco 0”.\n\n## Boulders Clássicos\n\n- 13 Davy Jones\
          \ v0\n- 16 Aresta v3\n- 20 Verticale v5\n- 21 Obina v7\n- 23 Medalhão v10\n\
          \n| ![Escalador no boulder Traverse ao Tito](imagens/setor_estacionamento_p2_i0.webp)\
          \ |\n| :--: |\n| *Escalador no boulder Traverse ao Tito* |\n\n| ![Escaladora\
          \ no boulder Davy Jones](imagens/setor_estacionamento_p5_i0.webp) |\n| :--:\
          \ |\n| *Escaladora no boulder Davy Jones* |\n\n> \"O melhor escalador do\
          \ mundo é aquele que mais se diverte.\"  \n> — *Alex Lowe*\n\n| ![Fotos\
          \ e vídeos de escalada - Pedra Viva](imagens/setor_estacionamento_p7_i1.webp)\
          \ |\n| :--: |\n| *Fotos e vídeos de escalada - Pedra Viva* |\n\n*Fotos e\
          \ vídeos de escalada: [www.facebook.com/vivapedra](https://www.facebook.com/vivapedra)*"
        precomputados:
          total_escaladas: 27
          total_boulders: 27
