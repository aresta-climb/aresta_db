botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: '# afloramento NOVO MUNDO


        Corumbá entre Arcos e Pains - MG - Brasil


        | ![Capa](imagens/capa_p0.webp) |

        | :--: |

        | *Capa* |


        CROQUI - JUNHO - 2023


        Desenvolvido por: alexsandro'
- texto: Observações Importantes
  destino:
    secao_textual:
      conteudo: '# Observações Importantes


        Este croqui é apenas um auxílio de consulta a localização, não serve como
        instruções a prática da escalada. Não nos responsabilizamos pelas informações
        aqui contidas, são apenas ponto de vista.


        ## ATENÇÃO


        Os nomes das vias, seus respectivos conquistadores e a graduação sugerida
        para cada uma delas são resultados de uma pesquisa oral conduzida entre os
        escaladores que frequentam o pico, uma vez que não foi encontrado nenhum registro
        prévio sobre o tema (exceto os guias anteriores). O resultado desse trabalho
        pode eventualmente conter erros, os quais peço que não sejam entendidos como
        desrespeito. O objetivo é documentar e divulgar a prática da escalada no centro-oeste
        mineiro da maneira mais exata possível.


        ## OBSERVAÇÃO


        Como algumas vias são de conquistadores desconhecidos foi utilizado apelido
        + (*) para identificá-las. Caso encontre algum engano nos dados citados neste
        croqui, peço que me envie a correção. Terei satisfação em atendê-lo, pois
        todos os envolvidos com a escalada tem a ganhar com o aprimoramento desse
        trabalho.


        Muito obrigado aos conquistadores e conquistadoras, **GRATIDÃO** a vocês sempre!!!


        Arte/Organização/Produção: **alexsandro martins** / 7ª versão / atualização
        2023 / Revisão e graduação sugerida das vias: **Grupo de Trabalho**


        # SEJA CONSCIENTE!


        **UTILIZE APENAS AS TRILHAS PRINCIPAIS; As grutas não são banheiros!** Faça
        suas necessidades fisiológicas em casa, caso não consiga segurar, faça longe
        das pedras e cubra com folhas ou terra; **Leve todo seu lixo de volta** e
        o lixo de outros visitantes descuidados (inclusive papel higiênico, garrafas
        plásticas, bitucas, pontas, papel de bala...); Os animais locais e plantas
        nativas devem permanecer em seus lugares. Lembre-se que eles estão em seu
        habitat natural e precisam ser respeitados; Os animais domésticos (ex. cães)
        não devem ser trazidos a este local, desta forma, você os protege de doenças
        silvestres e vice versa; Fogueiras além de provocar queimadas, danificam o
        local; Estacione de maneira adequada e no local adequado a fim de não atrapalhar
        o fluxo de outros veículos; Utilize equipamentos de segurança e verifique
        seu estado de conservação; Cuidado com pedras soltas principalmente em setores
        e vias novas; Antes de conquistar uma via de escalada entre em contato com
        o GT.'
