botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: '# ESCALADA FAZENDA ZUCULIN


        | ![Escalada Fazenda Zuculin](imagens/capa_p0.webp) |

        | :--: |

        | *Escalada Fazenda Zuculin* |


        A Fazenda Zuculin é uma área particular. Algumas regras devem ser obedecidas.


        - Manter sempre as porteiras fechadas.

        - Ao atravessar a porteira você deverá seguir a trilha até a área de escalada,
        não entre em outro local que não seja a área de escalada.

        - Não estacione em frente a casa da sede para não obstruir a passagem.

        - Você irá cruzar uma área de pastagem, não importune os animais.

        - Quando chegar na área de escalada, andar apenas nas trilhas, respeite as
        demarcações.

        - Algumas vias ainda estão com top de chapelete simples, portanto essas vias
        deveram ser desmontadas com técnicas especiais.

        - Algumas vias foram recentemente conquistadas, cuidado com agarras soltas.

        - LIXO É PRA SER JOGADO NO LIXO, LEVE SEU LIXO DE VOLTA. BITUCA DE CIGARRO,
        TAMPINHA DE GATORADE, LACRE DE BOLACHA TAMBÉM É LIXO. DEIXE APENAS MAGNÉSIO
        NA ROCHA.

        - Caso queira equipar novas vias, entrar em contato com a AENMG para orientações.


        AENMG – Associação de Escaladores do Norte de Minas Gerais

        Site: www.aenmg.com.br

        E-mail: aenmg@hotmail.com'
