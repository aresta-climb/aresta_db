- texto: Como chegar e Trilha de Acesso
  destino:
    secao_textual:
      conteudo: '# Como chegar - FAZENDA ZUCULIN


        | ![Como chegar Fazenda Zuculin](imagens/mapas_gerais_p0_i0.webp) |

        | :--: |

        | *Como chegar Fazenda Zuculin* |


        Para chegar até aqui saindo de Montes Claros é necessário chegar até a avenida
        João 23 (avenida do hospital Aroldo Tourinho) e continuar até o trevo do distrito
        industrial. Após o trevo pegar reto sentido Fábrica de Cimento Lafarge em
        direção a Mirabela (ou Januária). Logo após a fábrica de cimento já estará
        na rodovia João Silva Maia. A partir de agora é só seguir até o Km 298, passando
        pela Polícia Militar Rodoviária.


        # Trilha de Acesso - Área de Escalada


        | ![Trilha de Acesso Área de Escalada](imagens/mapas_gerais_p1_i0.webp) |

        | :--: |

        | *Trilha de Acesso Área de Escalada* |'
