botoes:
- texto: Capa
  destino:
    secao_textual:
      conteudo: '| ![capa](imagens/capa_p0.webp) |

        | :--: |

        | *capa* |


        # afloramento RASTRO

        ## Arcos - MG - Brasil

        ## CROQUI - JUNHO - 2023


        Desenvolvido por: alexsandro'
- texto: Mapas Gerais
  destino:
    secao_textual:
      conteudo: '# Mapas Gerais


        ## Mapa dos Afloramentos da Regional

        Neste mapa é possível visualizar a localização do Afloramento Rastro em relação
        aos outros picos da região de Arcos e Pains.


        | ![Mapa Regional](imagens/mapas_gerais_p0_i0.webp) |

        | :--: |

        | *Mapa Regional* |


        ## Mapa dos Setores

        Este mapa detalha a localização de cada setor no Afloramento Rastro, bem como
        o estacionamento e os pontos de água (H2O).


        | ![Mapa dos Setores](imagens/mapas_gerais_p1_i0.webp) |

        | :--: |

        | *Mapa dos Setores* |


        ### Recomendações e Informações

        - É imprescindível o **USO DE CAPACETE** (escalador, "segue" e pessoas nas
        bases das vias) pode haver possíveis pedras soltas; cuidado com abelhas, marimbondos
        e animais peçonhentos; Utilize cordas de 60 metros ou mais.

        - **COMO CHEGAR**: O afloramento de calcário do **Rastro** fica a 8km do município
        de Arcos (chegando no setor da Chegada); outro acesso é do Corumbá ao Rastro
        (3km) chegando no setor do Camping Antigo.

        - **ATENÇÃO**: em ambos estacionar de forma a não atrapalhar a passagem/porteiras
        dos locais (carros, charretes, gado, etc.). no segundo atravessa o córrego
        em trilha sobre as pedras colocadas.'
- texto: Atenção e Regras
  destino:
    secao_textual:
      conteudo: '# Atenção e Regras


        Este croqui é apenas um auxílio de consulta a localização, não serve como
        instruções a prática da escalada. Não nos responsabilizamos pelas informações
        aqui contidas, são apenas ponto de vista.


        ## ATENÇÃO

        Os nomes das vias, seus respectivos conquistadores e a graduação sugerida
        para cada uma delas são resultados de uma pesquisa oral conduzida entre os
        escaladores que frequentam o pico, uma vez que não foi encontrado nenhum registro
        prévio sobre o tema (exceto os guias anteriores). O resultado desse trabalho
        pode eventualmente conter erros, os quais peço que não sejam entendidos como
        desrespeito. O objetivo é documentar e divulgar a prática da escalada no centro-oeste
        mineiro da maneira mais exata possível.


        ## OBSERVAÇÃO

        Como algumas vias são de conquistadores desconhecidos foi utilizado apelido
        + (*) para identificá-las. Caso encontre algum engano nos dados citados neste
        croqui, peço que me envie a correção. Terei satisfação em atendê-lo, pois
        todos os envolvidos com a escalada tem a ganhar com o aprimoramento desse
        trabalho.


        Muito obrigado aos conquistadores e conquistadoras, **GRATIDÃO** a vocês sempre!!!


        Arte/Organização/Produção: **alexsandro martins** / 7ª versão / atualização
        2023 / Revisão e graduação sugerida das vias: **Grupo de Trabalho**


        ## SEJA CONSCIENTE!

        - **UTILIZE APENAS AS TRILHAS PRINCIPAIS**;

        - **As grutas não são banheiros!** Faça suas necessidades fisiológicas em
        casa, caso não consiga segurar, faça longe das pedras e cubra com folhas ou
        terra;

        - **Leve todo seu lixo de volta** e o lixo de outros visitantes descuidados
        (inclusive papel higiênico, garrafas plásticas, bitucas, pontas, papel de
        bala...);

        - Os animais locais e plantas nativas devem permanecer em seus lugares. Lembre-se
        que eles estão em seu habitat natural e precisam ser respeitados;

        - Os animais domésticos (ex. cães) não devem ser trazidos a este local, desta
        forma, você os protege de doenças silvestres e vice versa;

        - Fogueiras além de provocar queimadas, danificam o local;

        - Estacione de maneira adequada e no local adequado a fim de não atrapalhar
        o fluxo de outros veículos;

        - Utilize equipamentos de segurança e verifique seu estado de conservação;

        - Cuidado com pedras soltas principalmente em setores e vias novas;

        - Antes de conquistar uma via de escalada entre em contato com o GT.'
