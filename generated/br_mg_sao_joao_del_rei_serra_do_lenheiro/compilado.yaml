                data_abertura: '1984-07-22'
                descricao: Tem a mesma saída da via anterior, mas logo pega a fenda
                  à direita. Mais na parte final, em um platô, seguir para a esquerda
                  cruzando um outro platô com vegetação.
            - uid: 5N9CGfdnyvJOZg
              via_movel:
                nome: Variante da Rubycon
                dificuldade: BR_7B
                descricao: Saída negativa no início do grande teto. Porém segue reto
                  ao invés da diagonal da via à seguir.
            - uid: BAcot5zBcZggD4
              via_movel:
                nome: Variante Teto da Guerra e Paz
