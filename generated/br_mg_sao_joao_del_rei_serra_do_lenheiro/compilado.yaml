        descricao: |-
          # Pedra da Boina

          Bloco bem peculiar com aspecto de uma “pedra que pode rolar” ao ser vista por quem está subindo a estrada para o CEMONTA do lado oposto do vale. Porém, seu acesso fica logo no início da subida, após passar pela ponte de ferro, tem um areal com um campinho de futebol onde pode-se deixar os veículos e pegar a trilha que começa bem na lateral do campo.

          Um pouco depois de atravessar o riacho a trilha vai um pouco esquerda e depois pra direita, mas logo vira de novo pra esquerda pra subir a serra em diagonal por um tempo. Já mais no alto, após uma parede um pouco mais vertical na direita, haverá dois blocos na esquerda, descer a trilha apagada por entre os blocos, em alguns pontos desescalando partes da rocha.
