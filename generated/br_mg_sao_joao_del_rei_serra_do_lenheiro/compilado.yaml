                data_abertura: '2021-11-07'
                descricao: Via esportiva com saída em pequenos regletes, passa por
                  um platô pra descanso e segue até parada dupla.
            - uid: D94iMhPOI2XdH5
              via_esportiva:
                nome: Dois Bruxos e Uma Feiticeira
                dificuldade: BR_8A
                extensao: 25
                quantidade_protecoes_intermediarias: 9
                conquistadores:
