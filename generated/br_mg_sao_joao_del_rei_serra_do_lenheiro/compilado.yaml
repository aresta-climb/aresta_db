                data_abertura: '2023-03-12'
                descricao: Via que começa na mesma face à direita da Dança Macabra
                  e no meio vira pro outro lado da aresta onde segue até o final.
                  Diferente do padrão local, seu estilo positivo de equilíbrio com
                  poucas agarras exige bom trabalho de pés, lembrando vias de parede.
                  9+2
            - uid: HiyHr9TmE8ncwe
              via_esportiva:
                nome: Sangue Frio
                dificuldade: BR_6SUP
                extensao: 25
                quantidade_protecoes_intermediarias: 9
                quantidade_protecoes_parada: 2
                conquistadores:
                - Pedro Naves
                - Gabriel Defelippe (Ripa)
                data_abertura: '2023-03-19'
                descricao: Saída utiliza um grampo amarelo para atingir o platô, depois
                  passa para a face à esquerda. 9+2 chapas.
            - uid: v2LFpfev1WqKZ3
              via_movel:
                nome: Sonho de Valsa
                dificuldade: BR_3
                extensao: 30
                protecoes_moveis: Friends médios e grandes
                conquistadores:
