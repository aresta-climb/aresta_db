                descricao: Linha que segue um sistema de agarras escorridas e batentes,
                  passando a agarras grandes. Uma linha totalmente reta que emenda
                  na parada da Guerra e Paz, podendo assim chegar ao cume em um único
                  esticão. Sua base fica ao lado da trilha principal e as primeiras
                  chapas são facilmente vistas por quem passa.
            - uid: 5Ncp7kfdgzL87M
              via_esportiva:
                nome: Tempos de Guerra
                dificuldade: BR_7A
                extensao: 18
                conquistadores:
