                dificuldade: BR_6SUP
                extensao: 30
                conquistadores:
                - Jonatas Lima
                - Lucas Hostalácio
                data_abertura: 2024-04
                descricao: Via longa com movimentação bem variada. Saída vertical,
                  depois faz um contorno pra esquerda onde compartilha um grampo com
                  suas duas vizinhas, seguido do crux em uma barriga delicada, logo
                  após pega pra direita novamente em um rampado de equilíbrio até
                  atingir o negativo final com ótimas agarras.
            - uid: KKz4CPZGmoocVO
              via_movel:
                nome: Pitelzinho Apimentado
                dificuldade: BR_6SUP
                exposicao: E3
                extensao: 40
                quantidade_protecoes_intermediarias: 1
                protecoes_moveis: 1 jogo de nuts, friends médios e pequenos
                conquistadores:
                - Flávio Daflon
                - Cintia Daflon
                descricao: Possui seu trecho mais fácil no meio, mas as proteções
                  são escassas, tornando a exposição alta. Possui um grampo para aliviar
                  a tensão, ainda no início. 1 jogo de nuts, friends médios e pequenos.
            - uid: paDq1IqUro5t2s
              via_movel:
                nome: Dança Macabra
                destaque: true
                dificuldade: BR_5SUP
                extensao: 30
                protecoes_moveis: 1 jogo de nuts e 1 de friends do .3 ao 4
                conquistadores:
