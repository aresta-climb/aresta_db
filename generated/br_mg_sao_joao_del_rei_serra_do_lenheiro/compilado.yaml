                protecoes_moveis: Camalots
                descricao: Tem seu início na fenda larga ao lado do grande teto, onde
                  Camalots 5 e 6 ajudam a proteger melhor. Depois segue para a esquerda,
                  cruza com a Rosa de Hiroshima e segue por uma bonita fenda até o
                  cume.
            - uid: uw4N8al8drNvDw
