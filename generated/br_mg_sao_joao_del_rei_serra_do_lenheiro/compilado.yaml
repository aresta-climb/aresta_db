                - Marcelo Júnior
                - Aline Nascimento
                data_abertura: '2021-08-28'
                descricao: Situada no pontão mais frequentado, é uma linha que impressiona,
                  seja por lances de força ou por passadas técnicas. Um começo de
                  regletes potentes tijolam os braços se não decifrar os lances rapidamente,
                  até uma virada habilidosa para chegar no platô, onde se pode relaxar.
                  Eis que chega na segunda parte da via e mais delicada, passadas
                  técnicas com apertâncias certeiras, seja em regletes ou pinças.
                  São 9 chapas ao todo.
