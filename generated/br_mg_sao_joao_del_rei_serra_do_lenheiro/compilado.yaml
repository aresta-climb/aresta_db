              # Setor Thundercats

              Bem ao lado do setor anterior, descendo alguns metros pra direita. Possui apenas duas vias bem bonitas e com vista incrível do top. Sombra o dia todo na base, sol na via de tarde.

              ## Vias

              ### 6 – Thundercats (5º – 17m – fixa)
              **Conquistadores:** Pedro Naves, Mariana Fiche e Paulo Martins

              Via muito boa para iniciantes. Além de fácil, proporciona um lindo visual e uma foto incrível do escalador se for tirada da trilha que sobe pro Setor de Cima. Boa para top-rope e primeiras guiadas. 5 + 2 chapas.

