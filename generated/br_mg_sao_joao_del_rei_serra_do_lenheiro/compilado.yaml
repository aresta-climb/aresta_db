                - Escaladores Militares
                data_abertura: '1984-07-26'
                descricao: Esta é a melhor opção para se chegar ao cume do Pontão
                  Menor, para montar top-rope nas vias deste setor, pois além de curta
                  e de baixa graduação, possui duas proteções fixas intermediando
                  a linha.
            - uid: 1CWrv3dUdqlm4Q
              via_movel:
                nome: O Retorno das Abelhas
                dificuldade: BR_6SUP
                extensao: 20
                protecoes_moveis: Friends pequenos e médios e nuts
                conquistadores:
                - André Ilha
                - Lúcia Duarte
                data_abertura: '1984'
                descricao: Ótima via que tem seu crux e beleza logo na saída. Em sua
                  metade cruza com a via anterior e segue para a esquerda com boas
                  agarras até o cume. Boa proteção em friends pequenos e médios e
                  nuts.
            - uid: J0Uz1hbcLo7T2m
              via_movel:
                nome: Chaminé dos Militares
                dificuldade: BR_3
                extensao: 20
                descricao: Pequena e fácil chaminé que pode ser feita em top-rope.
            - uid: 1NmD2i60P71wEd
              via_esportiva:
                nome: Os Iluminados
                dificuldade: BR_7B
                extensao: 20
                conquistadores:
                - Jonatas Lima
                - Pablo Veloso
                data_abertura: '2021-09-02'
                descricao: Aresta de visual incrível, inicia em regletes potentes
                  e pés altos, passando a agarras escondidas. Entre a segunda e terceira
                  chapa é o crux com lances delicados e potentes.
            - uid: EDq6ou05loNIcu
              via_movel:
                nome: Alta Tensão
                dificuldade: BR_6
                exposicao: E3
                extensao: 15
                conquistadores:
                - André Ilha
                - Lúcia Duarte
                data_abertura: '1984-07-22'
                descricao: Via muito bonita, porém exposta e de difícil proteção em
                  seu início onde se encontra o crux, conferindo ao guia uma boa dose
                  de alta tensão! Depois é desfrutar de uma boa fenda e agarras grandes.
            - uid: H1eyqF1sFbTcry
              via_esportiva:
                nome: Esquina da Alegria
                dificuldade: BR_4
                extensao: 30
                conquistadores:
                - Escaladores Militares
                descricao: Via que intercala grampos e pittons fixos. Após a virada
                  da aresta, vai por uma horizontal até uma chaminé ao fundo, por
                  onde segue até o cume.
            - uid: nHUi37zFgAR4vt
              via_movel:
                nome: Briga de Espadas
                dificuldade: BR_6SUP
                extensao: 20
                conquistadores:
                - Rodrigo Ferreira
                - Carlos Henrique
                descricao: Via exposta. Sua saída não é complicada, mas a primeira
                  proteção é alta em uma fenda onde fica o crux. Logo deve-se passar
                  para uma outra fenda mais à esquerda e segue por ela até o cume.
            descricao: |-
              Esta face fica na parte de trás do Pontão da esquerda de quem olha da estrada, ou seja, não pode ser vista da entrada do Cemonta.

              Por ser voltada para Leste, as vias pegam sol de manhã e ficam totalmente na sombra na maior parte da tarde.

              São vias bastante usadas por quem está começando a frequentar os Três Pontões, pelo fato de serem mais curtas e também servir de fácil acesso ao cume, permitindo assim a montagem de Top-rope nas vias deste Pontão.

              Para acessar esta área pode-se pegar a trilha principal (início no pequeno portão de ferro que fica ao lado do abrigo) ou, caso não tenha entrado nas dependências do Cemonta, existe um acesso para esta trilha seguindo pela estrada de terra, 150 metros após a porteira principal, conforme desenho acima. Esta trilha chega na base do Pontão Maior, neste ponto deve-se seguir para a esquerda passando pelo Pontão Médio e contornando toda a rocha.

              Existe também uma trilha mais curta para esta área, sem passar pelos outros Pontões, ela se inicia atrás do abrigo.
