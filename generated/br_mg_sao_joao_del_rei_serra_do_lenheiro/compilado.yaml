                extensao: 15
                quantidade_protecoes_intermediarias: 3
                quantidade_protecoes_parada: 2
                protecoes_moveis: Friends pequenos, médios e nuts
                descricao: Interessante horizontal, com boas proteções em friends
                  pequenos, médios e nuts, além de dois pitons e um grampo, cruzando
                  todo o grande teto por baixo. Ao término do teto, logo após virar
                  a aresta, há uma parada dupla onde se junta com a via original.
                  Possibilita realizar fotos incríveis.
            - uid: HSMZ9QG4YjIZWy
              via_movel:
                nome: Guerra e Paz
                dificuldade: BR_7C
                dificuldade_artificial: A1
                extensao: 35
                quantidade_protecoes_parada: 2
                conquistadores:
                - André Ilha
                - Leonardo Rodrigues
                data_abertura: '1998-05-02'
                protecoes_moveis: 1 jogo de nuts, 1 jogo de camalots até
                descricao: Sua base é bem abaixo das vias anteriores, descendo pela
                  trilha principal. Sua saída fica entre duas rochas e segue em diagonal
                  pra direita, abaixo do teto até a parada dupla. Porém esta primeira
                  parte caiu um pouco em desuso, pois sua variante tem sido mais usada.
                  Após a parada a via segue levemente para a esquerda em um sistema
                  de fendas que impressiona pela qualidade, onde se encontra o crux.
                  1 jogo nuts/1 jg camalot até
            - uid: so6ZRPHt1SIMt9
