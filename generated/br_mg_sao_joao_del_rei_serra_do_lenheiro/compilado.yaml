                data_abertura: '1986-05-02'
                descricao: Tem uma saída em móvel com proteções escassas. Depois encontra
                  com a Esquina da Alegria e segue pelo grande platô com proteções
                  fixas. Após alguns lances em horizontal deve-se ir pra direita e
                  pegar a outra face da rocha seguindo por uma fenda óbvia. Enquanto
                  que a Esquina segue para a grande fenda ao fundo.
