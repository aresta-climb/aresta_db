            - Dalton Chiareli
            - P. C. Caliano
            - Guilherme
            data_abertura: '1988-04-17'
            descricao: Inicia na aresta à esquerda do “Portal”, mas também é feita
              saindo pela fenda óbvia bem ao lado do portal devido à sua beleza e
              dá menos arrasto na corda, desta forma o grau deve subir pra casa do
              sexto grau.
        - uid: auYvOZ1jzPCJNJ
          via_movel:
            nome: Outra Dimensão
            dificuldade: BR_7A
            extensao: 25
            conquistadores:
            - Pedro Naves
            - Bruno Bastos
            data_abertura: '2021-10-12'
            descricao: 'Apesar de ter sido conquistada recentemente, é clássica e
              uma das móveis mais difíceis do setor. Pois além do crux estilo Boulder
              no final possui mais outros lances técnicos. Foi conquistada saindo
              pela bela fissura que já era usada como variante da via anterior, no
              platô segue reto entre blocos de pedra até atingir uma canaleta negativa
              que também é exigente. Levar um jogo de friends até BD #4(final da via)
              e um de nuts.'
        - uid: VGSteh9NLivxiN
          via_movel:
            nome: Variante Teto do Portal
            dificuldade: BR_7A
            conquistadores:
            - Antônio Paulo de Faria
            - Dalton Chiareli
            - P. C. Caliano
            - Guilherme
            data_abertura: '1988-08-14'
        - uid: t5JIGOMCvUxTsN
          via_movel:
            nome: Mano de Quartzito
            dificuldade: BR_5
            extensao: 30
            quantidade_protecoes_parada: 2
            conquistadores:
            - Pedro Bugim
            - Vivianne Sawczuk
            data_abertura: '2015-04-26'
            descricao: Inicia na aresta à direita do portal, em grampos. Sua metade
              superior é feita toda em móvel, cruzando com a “Portal do Delírio” no
              grande platô no meio da parede. Parada dupla no topo, para segurança
              e rapel.
        - uid: WQ2LCVCVgYCo5z
          via_movel:
            nome: Garimpeiros
            dificuldade: BR_6SUP
            extensao: 30
            conquistadores:
            - Pedro Naves
            - Guilherme Otoni
            data_abertura: '2021-12-08'
            descricao: 'Outra conquista recente bem interessante. Início em uma fenda
              escura, segue por um sistema de canaletas passando bem ao lado direito
              de uma árvore, até chegar no grande platô onde encontra-se o crux: uma
              proteção antes de entrar no lance ajuda a dar confiança no movimento
              dinâmico para alcançar um bico, no qual bloca-se para proteger com um
              Camalot #4 e terminar a virada do negativo. Mais acima passa por uma
              fenda branca e segue por uma fissura perfeita até o cume. Levar um jogo
              de friends até BD#4 e um de nuts.'
        - uid: Wz8EiPQRlPgqsL
          via_esportiva:
            nome: Um Minuto de Silêncio
            dificuldade: BR_7B
            extensao: 12
            conquistadores:
            - Fernando Honse
            - Mahananda Vargas
            data_abertura: '2011-01-15'
            descricao: Via curta, mas explosiva do início ao fim. Difícil de sacar
              as costuras, melhora muito com elas no lugar.
        - uid: 4At4ETcm2r2RnW
          via_movel:
            nome: Mina de Cristal
            dificuldade: BR_6
            extensao: 15
            quantidade_protecoes_parada: 1
            conquistadores:
            - Pedro Bugim
            - Vivianne Sawczuk
            data_abertura: '2015-04-26'
            descricao: Via curta e levemente negativa, com boas passadas de oposição.
              Grampo no topo para segurança e rapel.
        - uid: YuWr3n1ojM0zyV
          via_movel:
            nome: Erva do Diabo
            dificuldade: BR_5
            extensao: 25
            conquistadores:
            - Juratan Câmara
            data_abertura: '2001'
            descricao: Bela via, principalmente na sua parte final. Sua base fica
              atrás do top da via anterior. Na conquista seu final foi feito pela
              aresta à direita, mas tem sido repetida tocando reto na bonita e óbvia
              fenda principal.
        - uid: KqUpniGlfDVB6g
          via_movel:
            nome: Olhos de Lince
            dificuldade: BR_5
            conquistadores:
            - Luiz Cláudio
            - Leonardo Rodrigues
            descricao: Variante da via anterior. Compartilha a mesma saída e segue
              pra esquerda em uma fenda após o platô.
        - uid: 429svd4mQSpFQf
          via_esportiva:
            nome: Da Toca Pra Cima
            dificuldade: BR_7A
            extensao: 12
            conquistadores:
