        \ do Guia de Escalada da Serra do Lenheiro](imagens/capa_p0_i2.webp) |\n|\
        \ :--: |\n| *Capa do Guia de Escalada da Serra do Lenheiro* |\n\n**São João\
        \ Del Rei – MG**  \n\n**Atenção:** Para escalar no CEMONTA é necessário pegar\
        \ autorização prévia!"
- uid: 5TwqFVNnblyrkV
  texto: Apresentação
  destino:
    secao_textual:
      conteudo: |-
        # Apresentação

        ## O Guia

        Este guia foi feito através de um trabalho colaborativo de alguns escaladores com o intuito de servir como orientação para os praticantes que desejam escalar na Serra do Lenheiro, assim como organizar e eternizar as informações que estavam espalhadas em arquivos antigos e na cabeça dos escaladores, correndo o risco de se perderem no tempo.

        Este trabalho teve início com uma grande catalogação de vias feito pelo então capitão do 11BIMth Douglas Oliveira, que serviu de base para tudo. Partindo desse levantamento, em 2015 o próprio Douglas se juntou com o instrutor de escalada Jonatas Lima que além de seu conhecimento, veio a somar com repetição de várias vias, fotos e outros materiais que foram digitalizados pelo atual presidente da FEMERJ Pedro Bugim que também contribuiu com material próprio. Após uma paralisação de alguns anos, em 2020 foi dado continuidade no trabalho pelos escaladores sanjoanenses Pedro Naves e Michel Rodrigues que levantaram mais informações faltantes para então finalizar o trabalho, contando com grande ajuda de Luiz Cláudio e Leonardo Rodrigues que compartilharam conhecimentos.

        Por se tratar de um guia voltado mais pra escalada recreativa, também não foram incluídas muitas das rotas de treinamento do exército.

        Por possuir vias com quase 40 anos conquistadas por escaladores de várias regiões, catalogá-las não foi tarefa fácil e por isso podem haver erros. Qualquer observação será sempre bem-vinda para que correções possam ser feitas ao longo do tempo. Para isso, favor fazer contato com Pedro Naves no (32) 9 9945-7715 ou Michel (32) 9 9932-5359.

        A escalada é um esporte de risco e este guia não capacita o leitor a praticar o esporte de forma segura. Para isso, procure por instrutores/guias capacitados. Além de ser um esporte de alta intensidade que requer uma boa preparação e cuidados com o corpo.

        Portanto, pratique de forma responsável, seguindo a ética local e não tome nenhuma atitude sem comunicar com escaladores locais. Boas escaladas!

        | ![Abrigo Lagos e Jonatas Lima](imagens/apresentacao_p0_i2.webp) |
        | :--: |
        | *Abrigo Lagos e Jonatas Lima* |

        | ![Espaço Amari - Fisioterapia e Pilates](imagens/apresentacao_p0_i3.webp) |
        | :--: |
        | *Espaço Amari - Fisioterapia e Pilates* |
- uid: QDo013G64e2lNr
  texto: A Cidade
  destino:
    secao_textual:
      conteudo: |-
        # A cidade

        O município de São João Del Rei está localizado na região do Campo das Vertentes no sudeste de Minas Gerais e possui uma população estimada em torno de 90.000 habitantes. Cidade histórica, teve sua ocupação iniciada em 1701 e conta com um rico patrimônio arquitetônico/cultural. É também considerada uma cidade universitária devido à presença da UFSJ. Possui um batalhão do Exército especializado em operações de montanha, o 11º Batalhão de Infantaria e Montanha (11BIMth) que tem como um dos centros de treinamentos a própria serra tratada neste guia. Os principais atrativos de São João são as belas igrejas no estilo barroco com seus famosos “sinos que falam”, passeio de trem, ótima gastronomia, sua vizinha Tiradentes e belezas naturais como cachoeiras e a Serra do Lenheiro.

        | ![Sino de igreja barroca com vista da cidade histórica de São João Del Rei](imagens/a_cidade_p0_i2.webp) |
        | :--: |
        | *Sino de igreja barroca com vista da cidade histórica de São João Del Rei* |

        # Hospedagem

        A cidade por ser histórica conta com muitos hotéis. Mas também tem o @AbrigoLagos, voltado para escaladores com quarto e camping, fone (32) 99945-7715.

        # Serra do Lenheiro

        Geograficamente, a Serra do Lenheiro é a continuação da Serra de São José. Com altitude máxima de 1.218 metros, ela é uma formação cuja origem remonta a 1,6 bilhões de anos e é constituída principalmente por Quartzito. A lenha das árvores provenientes da Serra e as pedras nela encontradas serviram para construir igrejas e pontes da cidade, daí a origem de seu nome. Na Serra do Lenheiro, há atrativos como: pinturas rupestres, canal dos ingleses, gruta do catitú, cachoeira dos sete metros e poço olho d’agua.

        # Escalada

        A conquista das primeiras vias se deu no final dos anos 70 por militares que passaram a usar os Três Pontões para treinamentos e no início da década de 80, através principalmente dos escaladores cariocas André Ilha, Tonico Magalhães e Lúcia Duarte. Estes encontraram nas fendas de ótima qualidade da Serra do Lenheiro um local para praticar escalada móvel, uma vez que as rochas do Rio de Janeiro não possuem a mesma característica. Nesse início a escalada da região se desenvolveu basicamente em torno da escalada móvel e assim tomou fama, chegando a ganhar destaque até em revistas internacionais como *Mountain* e *Climbing*, sendo reconhecida como primeiro pólo de escalada móvel do Brasil.

        Já nos anos 90, começaram a surgir os primeiros escaladores locais que, seguindo uma tendência do país na época, se organizaram em grupos e clubes como Tripon Aventuras, CSM (Centro Sanjoanense de Montanhismo) e Centro Excursionista Lenheiro. Nesse mesmo período organizaram vários encontros de escalada que foram importantes para trazer conhecimento através de escaladores de outras cidades e visibilidade pro esporte que passou a crescer em São João desde então, deixando assim um legado.

        Com a virada do século, seguindo uma tendência da época, setores de escalada esportiva e boulder começaram a ser desenvolvidos através de mais escaladores locais, mostrando que a cidade também possui enorme potencial para estes tipos de escalada. Nascendo assim alguns setores incríveis como a Ave Maria, que depois viria a se tornar famosa país afora.

        Mas o potencial dessa serra parece não ter fim. Recentemente foi descoberto mais um setor, o Rio das Mortes no outro extremo da serra e tem se tornado bastante popular.

        Com certeza essa história não acaba por aqui, pois ainda há muito o que se desenvolver em termos de novas vias e quem sabe até novos setores.
- uid: 30BizbauIszT3n
  texto: Ética
  destino:
    secao_textual:
      conteudo: |-
        # Ética

        | ![FEMERJ - Federação de Esportes de Montanha do Estado do Rio de Janeiro](imagens/etica_p0_i3.webp) |
        | :--: |
        | *FEMERJ - Federação de Esportes de Montanha do Estado do Rio de Janeiro* |

        - Como visto acima, a escalada na região tem suas raízes na escalada móvel. Portanto, deve-se preservar este estilo ao máximo, priorizando o uso de proteções móveis sempre que possível.
        - De qualquer forma, sempre que for abrir alguma via consulte, além deste Guia, algum escalador local pois podem haver restrições, projetos ou até mesmo vias antigas que ainda não foram catalogadas.
        - Em hipótese alguma pode-se cavar ou acrescentar agarras para facilitar a escalada.
        - Evitar uso excessivo de magnésio, limpe as agarras caso tenha deixado marcas. Um dos encantos da escalada é desvendar os movimentos, não tire esse privilégio dos outros.
        - As áreas de escalada estão em propriedades privadas, portanto respeite essas pessoas ao máximo e não faça nada que não faria em sua casa. Deixe porteiras e tronqueiras conforme as encontrou, não obstrua passagens com o veículo, não acampe sem permissão, não faça fogueiras, não deixe rastros. Siga à risca as regras de uso do CEMONTA quando for nos Três Pontões, sempre com autorização e uso do capacete.
        - Preserve a natureza, leve todo o lixo embora.
        - Não fazer necessidade fisiológica próximo das trilhas ou áreas de escalada. Em caso de necessidade afastar-se ao máximo e enterrar os resíduos.
        - Caso encontre costuras ou outro equipamento em alguma via, não remova! Com certeza é de algum escalador que está malhando a via e vai retirar depois.
        - Escaladores de fora se possível fazer contato com alguém local antes de ir escalar.
