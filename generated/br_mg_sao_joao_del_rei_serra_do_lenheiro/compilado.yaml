            - uid: 4gYD3G9I4kE4CX
              via_esportiva:
                nome: Barbatana
                dificuldade: BR_4SUP
                extensao: 25
                conquistadores:
                - Pedro Naves
                - Lucas Agostini
                data_abertura: '2024-04-13'
                descricao: Via esportiva mais fácil do Cemonta, ótima para iniciantes
                  tanto de top-rope quanto para aprender a guiar. Variante da via
                  à seguir, se separam no platô, esta segue por uma aresta ao fundo
                  e termina no mesmo top.
            - uid: C9xzsW8pEoIGV8
              via_esportiva:
                nome: Roubadas
                dificuldade: BR_5SUP_BARRA_6
                extensao: 25
                quantidade_protecoes_intermediarias: 8
                quantidade_protecoes_parada: 2
                conquistadores:
                - Pedro Naves
                - Guilherme Otoni
                - Bruno Bastos
                data_abertura: '2023-08-12'
                descricao: Via que compartilha a mesma saída das três anteriores,
                  porém no platô vai pra face da direita, terminando na torre de rocha
                  ao fundo. Possui movimentação variada, alterna partes de negativo
                  com lances de equilíbrio. Seu crux favorece quem é mais alto, por
                  isso os baixos tendem a achar um pouco mais difícil. 8+2.
            descricao: |-
              Esta face fica um pouco escondida, pois a trilha principal não passa por sua base. Seguindo as orientações da trilha principal citada anteriormente, deve-se ficar atento para pegar uma trilha à direita alguns metros antes da via Tempos de Guerra. Esta trilha sobe por alguns blocos de pedra e logo estará na base das vias. A trilha também dá acesso à uma das entradas da Rota Interna e para a base das primeiras vias do Pontão Médio. Sombra pela manhã.

