                - Michel Rodrigues
                data_abertura: 2022-04
                descricao: Outra via que se junta na parada da Guerra e Paz. Via esportiva
                  clássica por sua variação de estilo e beleza. Saída em lances de
                  negativo e no meio toca para a linda aresta onde muda o estilo pra
                  positivo de equilíbrio.
