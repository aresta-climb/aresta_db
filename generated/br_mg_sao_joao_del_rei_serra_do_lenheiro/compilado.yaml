        escaladas:
        - uid: fH9meA18Hte60z
          via_movel:
            nome: Fissura Santíssima Trindade
            dificuldade: BR_3
            extensao: 20
            conquistadores:
            - Centro Excursionista Lenheiro
            data_abertura: '1988'
            descricao: Via curta e fácil por uma fissura reta e um pouco suja. Sem
              relatos de repetições.
        - uid: zTsT08fXXcl2I9
          via_esportiva:
            nome: Boca Murcha
            dificuldade: BR_3SUP
            extensao: 10
            conquistadores:
            - Michel Rodrigues
            - Douglas Marques
            data_abertura: '2023-07-27'
            descricao: Primeira via fixa da esquerda pra direita do setor. Via bem
              fácil, interessante pra uma primeira guiada.
        - uid: xiAzRu2EWQTMeK
          via_esportiva:
            nome: Sorte de Principiante
            dificuldade: BR_5
            extensao: 12
            conquistadores:
            - Michel Rodrigues
            - Douglas Marques
            data_abertura: '2023-07-27'
            descricao: Via começa vertical em boas agarras, passa por um fácil positivo
              e termina com um crux vertical mais técnico.
        - uid: ssn2x8RGX21pbr
          via_esportiva:
            nome: Pescador de Ilusões
            dificuldade: BR_6SUP
            extensao: 15
            conquistadores:
            - Michel Rodrigues
            - Douglas Marques
            data_abertura: '2023-07-27'
            descricao: Bem ao lado da via anterior, se parecem no estilo. Porém essa
              tem um crux mais negativo e de difícil leitura.
        - uid: zmPEFqN96jQIrC
          via_esportiva:
            nome: Malvado Favorito
            dificuldade: BR_6
            extensao: 20
            conquistadores:
            - Jonatas Lima
            - Pablo Veloso
            - Carlos Pádua
            data_abertura: '2021-10-12'
            descricao: Saída embaixo da copa de uma árvore. Início em positivo e crux
              no final em uma bonita sequência negativa.
        - uid: jPAltt7zZixKe7
          via_movel:
            nome: A Primeira e Gente Nunca Esquece
            dificuldade: BR_5
            extensao: 20
            quantidade_protecoes_intermediarias: 2
            quantidade_protecoes_parada: 2
            conquistadores:
            - Luiz Cláudio
            descricao: Via bem no meio do bloco rochoso vertical de cor mais clara.
              Possui apenas duas chapeletas em sua metade superior e parada dupla
              no cume. Para montagem de top-rope levar ao menos duas fitas de 1,20m.
        - uid: bxnlGD0vbwsDIU
          via_movel:
            nome: Fissura dos Dois Dedos
            dificuldade: BR_4SUP
            extensao: 40
            conquistadores:
            - André Ilha
            data_abertura: '1984-04-28'
            descricao: Primeira via do setor e uma das mais belas, foi conquistada
              em solo. Saída ao lado da via anterior, depois segue pelo diedro e termina
              no topo da formação que dá nome ao setor. Um jogo de friends é o suficiente.
              Para descer, desescalar um lance pra direita, subir o trepa-pedras e
              ir até a parada fixa no final da via Portal do Delírio ou descer por
              caminhada.
        - uid: UQQNyI4JCAmyR0
          via_movel:
            nome: O Retorno
            dificuldade: BR_4
            extensao: 20
            conquistadores:
            - Luiz Cláudio
            - Márcio Andrade
            - Leonardo Rodrigues
            - Rodrigo Araujo
            - Gelson
            data_abertura: '2020'
            descricao: Variante da via anterior. Parada fixa no topo.
        - uid: kdbgW74YHDj4BR
          via_esportiva:
            nome: Sinergia
            dificuldade: BR_5
            extensao: 20
            conquistadores:
            - Luiz Cláudio
            - Márcio Andrade
            data_abertura: 2021-09
            descricao: Esta linha cruza com as anteriores e crux no final.
        - uid: PSBJHMoJ0vdwI5
          via_esportiva:
            nome: Chapeleta
            dificuldade: BR_4
            extensao: 20
            conquistadores:
            - Ronan Morais
            - Dircinei Paulo
            data_abertura: '2017'
        - uid: Zb0d8qAFDkedRV
          via_movel:
            nome: Elo Perdido
            dificuldade: BR_4
            extensao: 30
            conquistadores:
            - Leonardo Rodrigues
            - Márcio Andrade
            descricao: Via inicia em uma fenda larga e suja entre duas vias fixas.
              Depois entra na grande cavidade da rocha e segue por uma fissura perfeita
              ao fundo. Costuma ficar bastante húmida na época de chuvas. Um jogo
              de friends.
        - uid: 8wDJrxOyROFxq2
          via_esportiva:
            nome: Investida Invertida
            dificuldade: BR_5SUP
            conquistadores:
            - Luiz Cláudio
            - Márcio Andrade
            - Leonardo Rodrigues
            - Rodrigo Araujo
            - Gelson
            data_abertura: '2020'
        - uid: sOeHR8ZHlGg12P
          via_movel:
            nome: Domingão com Viagra
            dificuldade: BR_5SUP
            extensao: 30
            conquistadores:
            - Leonardo Rodrigues
            - Márcio Andrade
            descricao: Diedro oposto ao da Fissura dos Dois Dedos. Depois segue por
              uma bonita fenda em diagonal pra direita.
        - uid: da9IBfGwU1vpzm
          via_movel:
            nome: Portal do Delírio
            dificuldade: BR_4
            extensao: 30
            conquistadores:
