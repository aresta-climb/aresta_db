- texto: A Escalada
  destino:
    secao_textual:
      conteudo: '# A Escalada


        | ![O Sítio do Rod é perfeito para iniciar crianças na escalada e vivências
        em ambientes naturais. Foto: Portugal Braga](imagens/pagina_5_imagem_0.webp)
        |

        | :--: |

        | *O Sítio do Rod é perfeito para iniciar crianças na escalada e vivências
        em ambientes naturais. Foto: Portugal Braga* |


        Este é um esporte fascinante, bonito para se ver e incrivelmente prazeroso
        de se praticar.


        Para muitos uma filosofia de vida, um estilo, uma devoção a este esporte que
        uni força e concentração, técnica e resistência, domínio de técnicas específicas
        e uso de equipamentos, além de proporcionar um intimo contato com a natureza.


        Dividido em estilos e modalidades a escalada é pessoal, superação dos próprios
        limites, aliado a busca da essência deste esporte e o prazer que ele pode
        proporcionar.


        Que possamos encontrar este fluxo e sentir está essência...


        Boas escaladas...


        Marcus Vinicius'
- texto: Regras e Código de Conduta
  destino:
    secao_textual:
      conteudo: '# Regras e Conduta


        | ![Marcus "Rufino" escalando a via "Fósseis do velho mundo", uma ótima opção
        para quem gosta de escalar vias com proteções móveis. Foto: Elton Soares](imagens/pagina_6_imagem_0.webp)
        |

        | :--: |

        | *Marcus "Rufino" escalando a via "Fósseis do velho mundo", uma ótima opção
        para quem gosta de escalar vias com proteções móveis. Foto: Elton Soares*
        |


        ### Regras de Segurança do Sítio Do Rod:


        * Muita atenção com a segurança sua e de seu parceiro

        * É importante conferir seus equipamentos e de seu parceiro antes de começar
        a escalar

        * Use Capacete

        * Muito cuidado com Abelhas, Cobras e Aranhas


        Somente pratique escalada se já tiver o domínio de uso dos equipamentos ou
        acompanhado por um instrutor qualificado.


        ### Código de conduta do visitante:


        * Respeite os animais e o ambiente a sua volta

        * Proibido a retirada de plantas e pedras

        * Traga seu lixo de volta

        * É proibido o uso de aparelhos sonoros

        * Use os banheiros do camping

        * É necessário autorização para entrar nas Cavernas'
- texto: O Sítio do Rod e Hospedagem
  destino:
    secao_textual:
      conteudo: '# O Sítio do Rod:


        O Sítio está Localizado na região que é considerada um dos berços da escalada
        esportiva em Minas Gerais. Desde a abertura de suas primeiras vias, na segunda
        metade da década de 90, se destaca como um importante Campo Escola de escalada
        na região.

        Desde então o Sítio do Rod foi e continua sendo palco de inúmeras histórias
        de escaladores que por aqui passam e desfrutaram desse pequeno reduto da escalada
        esportiva mineira.


        Fica localizado a apenas 50 km do centro de Belo Horizonte e 16 km do Aeroporto
        Internacional de Confins.

        Possui hoje cerca de 70 vias de escalada entre esportivas e móveis com graduações
        que vão do 4° ao 10° grau, com qualidade e variedade de estilos e algumas
        vias se mantém secas mesmo nos dias mais chuvosos.

        É muito fácil o acesso aos setores de escalada, são cerca de cinco minutos
        de caminhada do estacionamento até a base da Rocha, com isso também se torna
        perfeito para as Crianças terem seus primeiros contatos com a escalada e vivências
        em ambiente de natureza.


        A proximidade com outras áreas de escalada como a Lapa do Seu Antão, as Grutas
        da Lapinha e do Baú e Serra do Cipó, formando assim o maior circuito de escalada
        em Calcário do Brasil, atraindo escaladores de todas as partes do país e do
        mundo inteiro.


