- texto: Como usar este guia
  destino:
    secao_textual:
      conteudo: '# Como usar este guia:


        * Este Guia vem com a finalidade de facilitar, informar e divulgar as vias
        de escalada no Sítio do Rod.

        * Nele as vias vem divididas em circuitos de cores, cada cor corresponde a
        uma graduação.

        * Traz também informações rápidas sobre o estilo da escala da via seja ela
        esportiva ou móvel.


        **Legenda:**

        * 4º e 5º grau: Amarelo

        * 6º grau: Verde

        * 7º grau: Azul

        * 8º grau: Roxo

        * 9º grau: Vermelho

        * 10º grau: Preto

        * V: Variante

        * B: Boulders

        * T: Travessias

        * o: Vias Fixas

        * +: Vias Móveis


        | ![Como usar guia](imagens/como_usar_guia_p0.webp) |

        | :--: |

        | *Como usar guia* |'
- texto: Mapa dos Setores
  destino:
    secao_textual:
      conteudo: '# Mapa dos setores


        O Sítio do Rod possui três setores principais: G1, G2 e G3.

        A caminhada do estacionamento até a base da rocha leva cerca de cinco minutos.

        Existem também vários boulders e travessias espalhados pelos setores.


        | ![Mapa dos Setores](imagens/pagina_14.webp) |

        | :--: |

        | *Mapa dos Setores* |'
