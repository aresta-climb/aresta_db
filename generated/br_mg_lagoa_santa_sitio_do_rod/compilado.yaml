- texto: Parque Estadual do Sumidouro
  destino:
    secao_textual:
      conteudo: '# Parque Estadual do Sumidouro


        | ![Escaladores Dimitri e Bernado durante o curso básico de escalada em rocha.
        Foto: Marcus "Rufino"](imagens/pagina_8_imagem_0.webp) |

        | :--: |

        | *Escaladores Dimitri e Bernado durante o curso básico de escalada em rocha.
        Foto: Marcus "Rufino"* |


        Caracterizado como Unidade de Proteção Integral, O Parque tem o objetivo principal
        de promover a preservação ambiental e cultural, possibilitando atividades
        de pesquisa, conservação, educação ambiental e turismo.


        A unidade recebeu este nome devido a sua lagoa, que possui um ponto de drenagem
        das águas da bacia típica dos terrenos calcários. Trata-se de uma abertura
        natural para uma rede de galerias, por meio da qual um curso d''água penetra
        no subsolo denominado "sumidouro", termo que vem da palavra indígena "Anhanhonhacanhuva",
        que significa "água parada que some no buraco da terra".


        **Algumas das atividades oferecidas pelo Parque:**


        Visita a Gruta da Lapinha, com acompanhamento de um guia especializado, onde
        turistas entre crianças e adultos podem conhecer um pouco do fantástico mundo
        das cavernas e seus arredores, com direito a entrada no Museu Peter Lund;
        Circuito Lapinha; Trilha Sumidouro; Escalada; Trilha da Travessia.


        Mais informações: www.pesumidouro.blogspot.com

        Telefone: (31) 3689 8592'
- texto: APA Carste Lagoa Santa
  destino:
    secao_textual:
      conteudo: '# APA Carste Lagoa Santa:


        O **Sítio do Rod** fica na Lapinha em Lagoa Santa MG, que é uma das regiões
        brasileiras mais importantes em termos de paisagens cárstica carbonática e
        da história das ciências naturais do Brasil.


        Nesta região foram encontrados grande quantidade de fósseis de animais extintos
        da megafauna como Preguiças gigantes, Tigres dentes-de-sabre, bem como vestígios
        de fosseis humanos, o padrão morfológico definido como Homem de Lagoa santa
        esta fauna extinta viveu na região nos períodos entre 13,5 a 9,5 mil anos
        atrás.


        Grande parte destas descobertas se deve ao trabalho do naturalista dinamarquês
        Peter Wilhelm Lund e outros estudiosos que por aqui passaram e outros que
        ainda estudam sobre a região nos dias atuais.


        | ![Setor G1, tem ótimas vias e boulder. Porem é necessário manter o silêncio
        e prestar muita atenção quanto a presença de abelhas. Foto: Jean Carlos](imagens/pagina_9_imagem_0.webp)
        |

        | :--: |

        | *Setor G1, tem ótimas vias e boulder. Porem é necessário manter o silêncio
        e prestar muita atenção quanto a presença de abelhas. Foto: Jean Carlos* |'
