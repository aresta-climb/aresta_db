- texto: Como Chegar
  destino:
    secao_textual:
      conteudo: '# Como chegar:


        R. Nossa Sra. do Rosário, 333 - Lapinha, Lagoa Santa - MG.


        **Distâncias:**

        * Belo Horizonte (centro) 50 km

        * Rio de Janeiro - 494 km

        * São Paulo - 630 km

        * Brasília - 710 km


        **De ônibus:**

        Saindo da Rodoviária de Belo Horizonte: Pegar o ônibus 5782 até Rodoviária
        de Lagoa Santa, lá linhas 3003/3004 e descer no ponto mais próximo da Igreja
        Nossa Sra. do Rosário, a 100m do Sítio do Rod.


        **Saindo do Aeroporto:**

        Pegar sentido Lagoa Santa, seguir para a Lapinha o Sítio está a 1 km da Gruta
        da Lapinha.


