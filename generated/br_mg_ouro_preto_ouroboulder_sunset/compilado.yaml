- texto: Introdução
  destino:
    secao_textual:
      conteudo: '# Introdução


        O Ouroboulder é um encontro de escaladores que acontece na cidade de Ouro
        Preto desde 2006. O grande potencial do pico reuniu atletas de todo país logo
        no primeiro ano, desde então faz parte do circuito de escaladores durante
        a alta temporada no Brasil.


        ## Linha do Tempo


        - **2006**: 1º Festival Pico do Itacolomi

        - **2007**: Descoberta Setor da Pedreira; Visita do espanhol Dani Andrada

        - **2008... 2012**

        - **2013**: Felipe Camargo cadena o Libertadores, o que seria o primeiro V14
        do Brasil; 1º Croqui impresso do Brasil

        - **2014**

        - **2015**: 10 anos de Ouroboulder

        - **2016... 2018**

        - **2019**: O Japonês Jun Shibanuma manda o Libertadores de flash, decota
        para V13 e abre o Last Samurai V14

        - **2020**: Primeiro ano sem festival (COVID-19); Descoberta do setor Sunset


        | ![Registro durante a confraternização do Ouroboulder de 2013](imagens/introducao_p0_i0.webp)
        |

        | :--: |

        | *Registro durante a confraternização do Ouroboulder de 2013* |


        *Registro durante a confraternização do Ouroboulder de 2013. Foto: Estúdio
        Buena Onda.*'
- texto: Conversão e Legenda
  destino:
    secao_textual:
      conteudo: '# Tabela de Conversão e Legenda


        ## Considerações

        Este croqui foi produzido para orientar escaladores a respeito dos setores
        de escalada, vias e cuidados a se tomar ao se praticar a escalada de boulder
        em Ouro Preto. As graduações dos boulders são apenas uma sugestão embasadas
        em conhecimento local e pesquisas no site 8a.nu.


        ## Tabela de Conversão (V -> Francesa)

        | Brasil (V) | Francesa |

        | :--- | :--- |

        | V0 | 5B |

        | V1 | 5C |

        | V2 | 6A/6A+ |

        | V3 | 6B/6B+ |

        | V4 | 6C/6C+ |

        | V5 | 7A |

        | V6 | 7A+ |

        | V7 | 7B |

        | V8 | 7B+ |

        | V9 | 7C |

        | V10 | 7C+ |

        | V11 | 8A |

        | V12 | 8A+ |

        | V13 | 8B |

        | V14 | 8B+ |

        | V15 | 9C |

        | V16 | 9C+ |


        ## Legenda

        | ![Legenda](imagens/conversao_e_legenda_p0.webp) |

        | :--: |

        | *Legenda* |


        - **Número (ex: ①)**: Indicação de onde o boulder se inicia.

        - **Letra (ex: Z)**: Indica o final do boulder.

        - **Diamante**: Linha clássica.

        - **Emoji Braço**: Escala de dificuldade.

        - **Emoji Cocô**: Linha forçada (Problema).


        ### Escala de Dificuldade

        - **Fácil**: V0 a V3 (Amarelo)

        - **Médio**: V4 a V6 (Verde)

        - **Forte**: V7 a V9 (Azul)

        - **Muito Forte**: V10 e V11 (Vermelho)

        - **Extremo**: Acima de V11 (Preto)'
- texto: Mapas Gerais
  destino:
    secao_textual:
      conteudo: '# Mapas Gerais


        ## Como Chegar


        ### Distâncias

        - **São Paulo**: 628km

        - **Rio de Janeiro**: 393km

        - **Brasília**: 827km

        - **Vitória**: 444km


        ### Em Ouro Preto

        O principal setor de escalada é a Pedreira que se localiza no Morro São Sebastião.
        O acesso ao morro é através da Rua Henri Gorceix, uma íngreme e longa ladeira
        que se inicia ao lado esquerdo do antigo casarão da Escola de Minas, localizado
        na Praça Tiradentes. Ao final da ladeira, chega-se à praça principal do morro
        São Sebastião.


        | ![Mapa de Acesso Ouro Preto](imagens/mapas_gerais_p0.webp) |

        | :--: |

        | *Mapa de Acesso Ouro Preto* |


        - **Linha Vermelha Contínua**: Acesso aos setores de boulder.

        - **Linha Vermelha Tracejada**: Trilha.

        - **Linha Azul**: Acesso aos setores de vias.

        - **Estrela Amarela (*)**: Praça do Morro São Sebastião.

        - **Círculo Azul (Nascente)**: Nascente Rio das Velhas.

        - **Exclamação (!)**: Sinalização do Ouroboulder.'
- texto: Responsabilidade e Orientações
  destino:
    secao_textual:
      conteudo: '# Responsabilidade e Orientações


        O principal objetivo do guia de montanha é fortalecer as práticas na natureza
        de forma consciente, segura e controlada. Portanto, é responsabilidade de
        cada leitor se atentar aos cuidados, normas e diretrizes de cada local, respeitando
        a ética local, os moradores e horários de visitação.


        ## Atenção


        - **Risco**: A prática de atividades na natureza oferece risco. Procure orientações
        corretas.

        - **Fogueiras**: Não é permitido fazer fogueiras nos parques e ambientes públicos.

        - **Prudência**: Evite praticar atividades outdoor sozinho. Avise familiares
        e amigos.

        - **Acidentes Naturais**: Fique atento a pedras soltas, buracos, animais,
        penhascos, raios, etc.

        - **Respeito**: Preserve a vida do próximo e respeite o momento de cada um.

        - **Lixo**: **RECOLHA SEU LIXO.** Caminhe sempre dentro das trilhas existentes.

        - **Prevenção**: Previna-se contra desidratação, insolação, frio e fome.


        ## Cães e Animais Domésticos


        - Os principais picos estão em áreas de preservação ambiental com espécimes
        endêmicas ameaçadas.

        - Cães podem cavar buracos, caçar fauna local e danificar a vegetação (como
        orquídeas raras).

        - Animais domésticos podem ser vetores de doenças para a fauna local.

        - Respeite o espaço individual; muitas pessoas ficam desconfortáveis com animais
        circulando nos crash pads e perto de alimentos.


        ## Gestão Local

        Antes de praticar qualquer atividade, atente-se aos gestores:

        - **Parque Municipal das Andorinhas**

        - **Parque Estadual do Itacolomi**'
