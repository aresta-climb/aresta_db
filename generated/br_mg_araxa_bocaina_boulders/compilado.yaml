        - boulder:
            nome: Trip Eterna
            dificuldade: V6
            descricao: Saída do Pretinho Irlandes indo para pinça a direita da agarra
              de saída, seguindo para batentes escorridos virando a direita do bloco.
        - boulder:
            nome: Mecanismo
            dificuldade: V7
            descricao: Saída sentado com a mao esquerda em batentee mao direita em
              reglete e calchanhar equerdo na altura da mão esquerda, passando por
              buracos no teto, seguindo para agarra triangular e virando no Trip Eterna.
        - boulder:
            nome: Pedrada
            dificuldade: V3
            descricao: Saida sentado com as mãos em dois batentes escorridos, virando
              no Pretinho Irlandês.
        - boulder:
            nome: Aedes Egipse
            dificuldade: V5
            descricao: Saída sentado em batentes escorridos seguindo para esquerda
              em sequencia de regletes no meio do bloco virando em abaulado grande.
        - boulder:
            nome: V9 do Rafinha
            dificuldade: V9
            descricao: Saída do pedrada, e seguir sequencia de batentes e regletes
              pela parte debaixo do bloco virando na aresta esquerda.
        - boulder:
            nome: Os Trabalhos Não Param
            dificuldade: V6
            descricao: Saída sentado com as duas mãos em reglete grande baixo e calcanhar
              esquerdo mais alto que as mãos, virando no Trip Eterna.
        - boulder:
            nome: Trabalho em Equipe
            dificuldade: V5
            descricao: Saída sentado com a mão esquerda em batente de compressão e
              direita em reglete aberto acima da cabeça.
