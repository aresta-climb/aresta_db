- texto: Introdução
  destino:
    secao_textual:
      conteudo: '---

        ---

        # Introdução


        O **Bocaina Park** é um parque particular de esportes, lazer e bem estar que
        esta localizado a 30 km do centro de Araxá aos pés da serra da Bocaina. Ele
        nasceu de um sonho e da união de amigos escaladores locais que começaram o
        desenvolvimento do lugar há cerca de 15 anos conquistando as primeiras vias
        e setores de escalada, e viabilizando o acesso através de trilhas de acesso
        e uma boa convivência com a comunidade local, e ao mesmo tempo realizando
        um trabalho de reflorestamento e preservação da fauna e flora em conjunto
        com uma conscientização dos visitantes.


        Foi criado para atuar no desenvolvimento de esportes de montanha na serra
        da Bocaina com a pratica de atividades conscientes nos meios naturais e fortalecendo
        o turismo de esportes de montanha na cidade através com eventos de qualidade,
        canais de comunicação eficientes, promovendo saúde e sustentabilidade, que
        após um trabalho de estruturação e viabilização podem ser praticados diversos
        esportes e atividades de montanha como: Escalada, Highline, corrida, caminhadas,
        montain bike, voo livre, meditação e descanso, tudo isso em contato pleno
        com a natureza.


        Atualmente no **Bocaina Park** oferecemos serviços de hospedagem com o **Camping
        Bocaina** com uma estrutura adequada e confortável para os visitantes, praça
        de alimentação com o **Açaí Bocaina** que funciona de Quarta a Domingo com,
        lanches, açaís, bebidas, almoços e jantas, a casa dos guardiões que é um local
        destinado para as pessoas que ajudam a cuidar do Bocaina Park e serra da Bocaina.


        **Bocaina Park** está localizado em um ambiente natural e preservado. Nossa
        intenção é deixar para as futuras gerações um local ainda melhor e mais preservado
        do que quando chegamos aqui. Para isso, solicitamos a todos que sejam conscientes
        em cada ato, economizem água, respeitem todo e qualquer animal que encontrar
        e preservem as formas de vida que temos ao nosso redor.


        | ![Graduações de boulders no croqui](imagens/introducao_p1.webp) |

        | :--: |

        | *Graduações de boulders no croqui* |'
