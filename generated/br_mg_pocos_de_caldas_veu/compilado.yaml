- texto: Informações
  destino:
    secao_textual:
      conteudo: '# Como Chegar


        **Endereço:** Av. João Pinheiro, 5501 - Centro, Poços de Caldas - MG, 37704-720


        | ![Entrada](imagens/como_chegar_p0_i0.webp) |

        | :--: |

        | *Entrada* |


        **Coordenadas do Estacionamento:** 21°46''31.5"S 46°37''06.5"W (-21.775417,
        -46.618472)


        Após entrar na mata siga a trilha por aproximadamente 80/100 metros. Fique
        atento para a primeira bifurcação a direita, que pode passar desapercebida,
        pegue a direita e continue até atravessar uma cerca cortada e logo a frente
        um pequeno riacho, passe por ele e logo encontrará o setor a poucos metros.


        **Coordenadas do Setor:** 21°46''31.5"S 46°37''06.5"W (-21.775417, -46.618472)'
