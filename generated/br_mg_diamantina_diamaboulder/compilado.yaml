                nome: Monobloco
                dificuldade: V3
                descricao: Saída com as mãos e pés no bloco menor que sustenta o bloco
                  principal, finalizando logo acima.
            - boulder:
                nome: Canela Queimada
                dificuldade: V2
                descricao: Saída em batentes bem marcados e segue para a esquerda
                  (sem utilizar os pés no bloco de sustentação).
            - boulder:
                nome: Canela de Ema
                dificuldade: V3
                descricao: Mesma saída do canela queimada mas segue a linha de agarras
                  da direita.
            - boulder:
                nome: Primavera nos Dentes
                dificuldade: V7
                descricao: Saída com as mãos juntas na agarra protuberante (sem utilizar
                  o bloco de sustentação como apoio de pés), seguindo pelos pequenos
                  regletes escorridos e pockets.
            - boulder:
                nome: Suave Coisa Nenhuma
                dificuldade: V6
                descricao: Saída com a mão esquerda na agarra protuberante e mão direita
                  no batente abaulado, seguido de dinâmico no pocket estreito, finalizando
                  como o primavera nos dentes (utiliza-se livremente o(s) pé(s) no
                  bloco de sustentação).
            - boulder:
                nome: Primavera Latina
                dificuldade: V10_BARRA_V11
                descricao: Saída nas agarras da quina do bloco (logo à direita da
                  saída do joelho de porco) e segue em travessia para a esquerda até
                  finalizar como o primavera nos dentes.
            - boulder:
                nome: Sangue Latino
                dificuldade: V9
                descricao: Mesma saída do primavera nos dentes, mas segue em diagonal
                  para a direita por abaulados e invertidas até finalizar como o joelho
                  de porco.
            - boulder:
                nome: Joelho de Porco
                dificuldade: V3
                descricao: Saída com as mãos em copos idênticos quase ao final do
                  abrigo, seguindo por movimentos espremidos rumo à face externa do
                  bloco.
            descricao: |-
              # Bloco: Primavera nos Dentes
              ## Região 2

              O bloco Primavera nos Dentes é um dos principais do setor, com linhas de alta dificuldade.
            precomputados:
              total_escaladas: 8
