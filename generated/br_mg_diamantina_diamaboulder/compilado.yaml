                  ligar no boulder coragem.
            - boulder:
                nome: Caldeirão do Groove
                dificuldade: V7
            - boulder:
                nome: Coragem
                dificuldade: V5
                descricao: Saída com as duas mãos no buraco do teto e segue pelo caminho
                  inverso do caldeirão, finalizando por agarrões na face vertical
                  do bloco.
