          em direção ao banheiro. Depois de passar pela base das vias “Retorno de
          Pitu” e “Mar Revolto” seguir por mais alguns metros e chegará na base da
          via “Sentinela”.


          **Coordenadas na base da via Sentinela:** -19º32.867’ -43º59.381’'
