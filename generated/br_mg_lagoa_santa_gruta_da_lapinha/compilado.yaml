    **ATENÇÃO:** A Gruta da Lapinha está inserida em unidade de conservação (Parque Estadual do Sumidouro / Refúgio de Vida Silvestre). Respeite as normas do parque, não faça fogueiras, traga todo o seu lixo de volta e preserve a flora, a fauna e os sítios arqueológicos e espeleológicos.
