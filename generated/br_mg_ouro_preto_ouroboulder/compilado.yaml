- uid: PP4tm5IVd53toE
  texto: Regras e Boa Convivência
  destino:
    secao_textual:
      conteudo: |-
        # REGRAS PARA BOA CONVIVÊNCIA

        O OUROBOULDER adota os princípios e valores fundamentais para os esportes de montanha consagrados no texto da Declaração de Tirol.

        1. **Respeite a natureza** - Não retire plantas, pedras ou qualquer elemento natural do ambiente. Evite abrir trilhas alternativas e utilize apenas os acessos autorizados.

        2. **Leve todo o seu lixo de volta** - Nada deve ser deixado na área de escalada. Traga uma sacola para recolher seus resíduos e, sempre que possível, recolha também o lixo encontrado pelo caminho.

        3. **Preserve a fauna local** - Não alimente animais silvestres e mantenha distância para evitar interferências em seu comportamento natural. Cães e outros animais domésticos não são permitidos.

        4. **Utilize os sanitários e estruturas disponibilizadas** - Evite qualquer descarte inadequado de resíduos. Caso seja necessário utilizar áreas naturais, siga as orientações da organização e dos gestores da Unidade de Conservação.

        5. **Respeite as áreas permitidas** - Alguns setores podem possuir restrições de acesso para proteção ambiental. Siga sempre as orientações dos organizadores, monitores e gestores da Unidade de Conservação.

        6. **Mantenha o ambiente tranquilo** - Evite o uso excessivo de caixas de som e ruídos que possam prejudicar a experiência dos demais participantes e causar impactos à fauna local.

        7. **Compartilhe os blocos e respeite a fila** - Todos estão no setor para se divertir. Revezar as tentativas, incentivar os colegas e manter uma postura colaborativa fazem parte do espírito da escalada.

        8. **Valorize a diversidade e o espírito de comunidade** - O OUROBOULDER é um espaço de inclusão, amizade e respeito mútuo. Não serão toleradas atitudes discriminatórias, agressivas ou que comprometam a integridade física ou moral de qualquer pessoa.

        9. **Preserve o espírito do montanhismo** - Busque o desafio, a superação e a aventura com honestidade, sem comprometer os valores que fazem da escalada uma atividade única.

        10. **Deixe o local melhor do que encontrou** - A melhor lembrança que podemos deixar para os próximos 20 anos é um ambiente preservado. Seja um exemplo de cuidado com a natureza e de respeito à comunidade da escalada.

        > "As montanhas estão chamando, e eu preciso ir." — John Muir
- uid: IGVTaj2bBBeW4C
  texto: Geologia e História
  destino:
    secao_textual:
      conteudo: |-
        # A Pedreira do Morro São Sebastião: Geologia, História e Revalorização Social

        Por Artur Simões e Gabriel Amora

        ## A Paisagem Forjada ao longo de Bilhões de Anos

        Os setores de escalada acessados pelo Morro São Sebastião em Ouro Preto (MG) são localizados na área do Parque Natural Municipal da Andorinhas. É um espaço que reúne um passado geológico complexo, uma história de exploração mineral intensa e uma recente transformação social e ambiental.

        As rochas que formam a pedreira do Morro São Sebastião pertencem à Formação Moeda, unidade geológica registrada no Quadrilátero Ferrífero. Há aproximadamente 2,5 bilhões de anos, a crosta terrestre dessa região foi alongada e fragmentada por grandes falhas, formando depressões chamadas bacias rifte.

        Ao longo de milhões de anos, essas bacias foram preenchidas por sedimentos trazidos por rios e leques aluviais. Esses sedimentos, inicialmente arenosos, passaram por processos de compactação, acumulando um volume significativo de material ao ponto de atingir condições de temperatura e pressão que favoreceram a cimentação e recristalização mineral, etapas da litificação: nome dado ao conjunto de processos que permitem a “transformação” de sedimentos em rochas sedimentares.

        Esses processos deram origem a uma série de rochas sedimentares, dentre elas, arenitos que posteriormente passaram por processos de metamorfismo que resultaram nos quartzitos que observamos hoje.

        Dois eventos tectônicos são descritos na literatura como os principais processos responsáveis pelo metamorfismo observado na região do QF: A Orogênese Transamazônica, que ocorreu entre 2,2 e 2,0 bilhões de anos (Renger & Chemale Jr., 1989; Noce et al., 2007), e a Orogênese Brasiliana, ocorrida entre 650 e 500 milhões de anos (Alkmim & Marshak, 1998; Noce et al., 2007).

        Os processos metamórficos deformam as rochas, conferindo-lhes planos naturais denominados foliações. Essas estruturas são responsáveis pela inclinação dos blocos que observamos, por exemplo, na área da Pedreira – os famosos “tetos ouropretanos” representados na logo do evento.

        Pela mesma razão é comum que os blocos, em sua grande maioria compostos por afloramentos naturais, apresentem agarras em posições similares uma vez que essas mesmas foliações são também planos naturais por onde normalmente as agarras são formadas. Também por isso o quartzito da região se destaca pela formação de placas, muito valorizadas como revestimento ornamental e amplamente exploradas pela mineração local na segunda metade do século XX.

        ## A Exploração Mineral e Seus Impactos

        Durante muitos anos, o quartzito do Morro São Sebastião foi amplamente explorado como rocha ornamental, sendo utilizado na construção civil, especialmente para revestimentos e calçamentos. A extração mineral foi uma importante fonte de renda para as comunidades locais, mas também trouxe consequências ambientais. O desmatamento, a degradação do solo e o assoreamento do Rio das Velhas, um dos principais rios da região, foram alguns dos impactos diretos causados pela mineração desordenada.

        Com a criação da Área de Proteção Ambiental (APA) Cachoeira das Andorinhas, a extração mineral foi progressivamente restringida, o que gerou tensões sociais. Muitas famílias que dependiam da atividade se viram obrigadas a buscar novas formas de sustento, e surgiram movimentos comunitários reivindicando alternativas econômicas viáveis.

        ## A Ressignificação da Pedreira: Esporte e Sustentabilidade

        Após o encerramento das atividades mineradoras, a antiga pedreira foi gradualmente transformada em um espaço de convivência e prática esportiva. A partir de meados dos anos 2000, o local se tornou um dos principais pontos de escalada no estilo boulder da região e do Brasil, atraindo escaladores de todo o mundo, especialmente devido à proximidade com Belo Horizonte e à facilidade de acesso.

        A escalada no Morro São Sebastião representa um exemplo de uso sustentável de áreas degradadas, promovendo a valorização ambiental e social do espaço. A atividade contribui para o turismo local, incentiva a conservação e aproxima as pessoas da natureza, despertando o interesse pela geologia e pela proteção ambiental. Ressalta-se, no entanto, a importância dessa prática continuar sendo realizada com responsabilidade, respeitando os princípios do mínimo impacto e contribuindo para a preservação da vegetação e fauna locais.

        ## Um Espaço de Memória e Convivência

        A história do Morro São Sebastião é marcada por transformações profundas. De uma área formada por processos geológicos de bilhões de anos, a um espaço de intensa exploração mineral, o local passou por um ciclo de degradação e hoje se destaca como um exemplo de reaproveitamento positivo. A escalada trouxe uma nova identidade para a antiga pedreira, integrando o esporte, a educação ambiental e o lazer de forma harmônica com a natureza.

        Os autores são geólogos formados pela Universidade Federal de Ouro Preto (UFOP). Ambos tiveram a pedreira como uma segunda casa em Ouro Preto, espaço que proporcionou encontros, experiências e memórias clássicas!

        **Viva a escalada ouropretana!**
- uid: q2lbnCpN6AFs1e
  texto: Agradecimentos
  destino:
    secao_textual:
      conteudo: "# AGRADECIMENTOS\n\nDuas décadas de história.\n\nMilhares de movimentos,\
        \ incontáveis tentativas, amizades construídas sobre a rocha e um legado escrito\
        \ coletivamente por pessoas apaixonadas pela escalada.\n\nAo longo desses\
        \ 20 anos, o OUROBOULDER acompanhou o crescimento da escalada no Brasil, fortaleceu\
        \ os laços entre diferentes gerações e reafirmou o compromisso da comunidade\
        \ com a conservação das áreas naturais que tornam essa experiência possível,\
        \ consolidando-se como um espaço de convivência, aprendizado, celebração e\
        \ respeito à natureza.\n\nEsta edição comemorativa presta homenagem a todos\
        \ aqueles que fizeram parte dessa caminhada: aos pioneiros que enxergaram\
        \ potencial onde muitos viam apenas pedras; aos conquistadores de novas linhas;\
        \ aos voluntários que dedicaram seu tempo e sua energia para manter vivo o\
        \ evento; aos gestores das áreas que tornaram possível a prática responsável\
        \ da escalada; aos patrocinadores e apoiadores; e a cada participante que,\
        \ em algum momento destas duas décadas, contribuiu para fortalecer a comunidade\
        \ da escalada em Ouro Preto.\n\nRegistramos também nosso agradecimento especial\
        \ às pessoas que contribuíram diretamente para a elaboração deste croqui e\
        \ para a realização desta edição comemorativa, dando continuidade ao trabalho\
        \ coletivo que tornou possível preservar, organizar e compartilhar este patrimônio\
        \ da escalada.\n\nQue este croqui seja mais do que um guia de blocos: que\
        \ seja um registro vivo da memória construída por centenas de mãos e uma homenagem\
        \ àqueles que fizeram do OUROBOULDER uma referência para a escalada brasileira.\
        \ Que ele inspire as próximas gerações a continuar escrevendo essa história.\n\
        \nObrigado por fazer parte destes 20 anos. Que venham os próximos 20.\n\n\
        Diretoria da SIME  \nGestão 2026-27"
- uid: YHUNjCcXQFDInl
  texto: A Artista e a Arte
