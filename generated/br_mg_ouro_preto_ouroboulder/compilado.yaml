- texto: Agradecimentos
  destino:
    secao_textual:
      conteudo: '# AGRADECIMENTOS


        Este croqui é uma realização da SIME, entidade representativa de montanhistas
        e escaladores da Região dos Inconfidentes, e foi possibilitado por todos os
        associados que acreditaram e apoiaram o montanhismo organizado a várias mãos.


        Ele é fruto do trabalho de diversas pessoas, associadas ou não, que doaram
        seu tempo e se dedicaram a fazê-lo para que todos possam ter a melhor experiência
        possível quando estiverem escalando boulder em Ouro Preto.


        As informações nele contidas podem divergir de croquis anteriores, e foram
        consideradas conforme as conhecemos atualmente, com dúvidas sendo sanadas
        no site 9a.nu, especialmente para conferência da graduação atual das linhas.
        Apesar de revisado por grande parte das pessoas que abriram as linhas e continuam
        escalando conosco atualmente, não está livre de erros. Portanto, se você tiver
        alguma crítica ou sugestão, envie-nos um email e teremos o prazer de realizar
        correções e incluir novas linhas em versões posteriores.


        Agradecemos a todos que já participaram dessa estória, seja abrindo linhas,
        construindo bases, fotografando, patrocinando ou apoiando de alguma forma
        na realização do OuroBoulder, mas especialmente às seguintes pessoas que auxiliaram
        de forma direta na realização desse trabalho: Lincoln “Mônika”, Mari Miranda,
        Rodrigo “Mussula”, Artur “Cunha”, Nathan Monge, Gustavo Broglio, Inaê Magalhães,
        Lídia Botelho, Pedro Rocha, Ana Carla, Lucas “Rino”, Jimi Maggi, Thainá Leão,
        Lucas Gaião, Gabriel Amora, Gabriel Trópia, Júnior Conca, Thalita Barbosa,
        Tomaz “Droza” e Pedro “Cisco”.


        Diretoria da SIME

        Gestão 2024-25'
