        | ![Logos de apoiadores](imagens/apoio_p0.webp) |

        | :--: |

        | *Logos de apoiadores* |'
- texto: O Evento
  destino:
    secao_textual:
      conteudo: '# O EVENTO


        ## História e Tradição


        O OUROBOULDER é um tradicional encontro de escaladores que acontece anualmente
        na histórica cidade de Ouro Preto, Minas Gerais. Em 2025, o evento celebra
        sua 17ª edição, reunindo atletas e praticantes da escalada em boulder, aproveitando
        a alta temporada e a excelente qualidade das formações rochosas da região.


        Surgido em meados de 2006, ocorre atualmente nos setores de escalada localizados
        no Parque Municipal das Andorinhas, como Pedreira, Bonsai, Mont Blanc e Sunset.
        Desde 2024 passou ser organizado pela SIME, entidade representativa de montanhistas
        e escaladores da Região dos Inconfidentes.


        Ao longo dos anos, o evento tem atraído um público cativo e grandes nomes
        do esporte, como o escalador espanhol Daniel Andrada, que participou da segunda
        edição em 2007. O evento busca evoluir a cada edição, sempre mantendo o foco
        na sustentabilidade e na conscientização ambiental, utilizando materiais biodegradáveis
        e promovendo a preservação da fauna e flora local.


        Além da escalada, o OUROBOULDER visa oferecer uma experiência completa aos
        participantes, com tenda de apoio, croquis dos setores, desafios, sorteio
        de brindes e outras atividades. É um evento que promove a união de pessoas
        de diversos países e estados com o mesmo intuito: escalar e se conectar com
        a natureza e a comunidade da escalada.'
- texto: A Cidade
  destino:
    secao_textual:
      conteudo: '# A CIDADE


        Ouro Preto é um tesouro histórico e cultural do Brasil, reconhecida como Patrimônio
        Cultural da Humanidade pela UNESCO em 1980. Sua origem remonta ao final do
        século XVII, com a descoberta de ouro aluvião por bandeirantes paulistas,
        o que impulsionou o desenvolvimento da região e a transformou em um dos principais
        centros econômicos do Brasil Colônia. Inicialmente conhecida como Vila Rica,
        a cidade foi elevada à categoria de vila em 1711 e tornou-se capital da Capitania
        de Minas Gerais em 1720. Em 1823, após a Independência do Brasil, recebeu
        o título de Imperial Cidade de Ouro Preto.


        A arquitetura de Ouro Preto é um dos seus maiores atrativos, com um conjunto
        homogêneo de construções barrocas que refletem a riqueza e o esplendor da
        época do ouro. As igrejas, muitas delas projetadas e adornadas por artistas
        renomados como Aleijadinho e Mestre Ataíde, são verdadeiras obras de arte,
        destacando-se pela riqueza de detalhes, adornos e o uso abundante de ouro
        em seu interior. Exemplos notáveis incluem a Basílica Nossa Senhora do Pilar,
        com mais de 400 quilos de ouro, e a Igreja de São Francisco de Assis, considerada
        uma das mais importantes obras coloniais do Brasil.


        Além de sua importância histórica e arquitetônica, Ouro Preto oferece uma
        rica vida cultural e turística. A cidade possui diversos museus, como o Museu
        da Inconfidência e o Museu Casa dos Contos, que preservam a memória do Ciclo
        do Ouro e da Inconfidência Mineira. O turismo é uma atividade econômica fundamental
        para a cidade, que atrai visitantes de todo o mundo interessados em sua história,
        art e paisagens montanhosas.'
- texto: Parque Municipal das Andorinhas
  destino:
    secao_textual:
      conteudo: '# PARQUE MUNICIPAL DAS ANDORINHAS


        O Parque Municipal Natural das Andorinhas (PNMA), localizado em Ouro Preto,
        é um refúgio ecológico de grande beleza cênica. Criado em 2005, o parque abrange
        uma área de mais de 550 hectares, caracterizada por formações rochosas impressionantes
        e uma rica biodiversidade, marcando a transição entre a Mata Atlântica e o
        Cerrado.


        Um dos grandes atrativos do PNMA é a presença de diversas cachoeiras e trilhas
        bem sinalizadas, que convidam os visitantes à prática do ecoturismo. A nascente
        do Rio das Velhas, um dos mais importantes de Minas Gerais, encontra-se dentro
        dos limites do parque, adicionando um valor hídrico e ambiental significativo
        à região.


        Além de sua importância natural, o Parque das Andorinhas também se destaca
        por seu potencial para o geoturismo, com elementos abióticos que contam a
        história geológica local. A paisagem de campos rupestres quartzíticos e cursos
        d''água oferece um cenário único para estudos e apreciação da natureza.'
- texto: Regras e Boa Convivência
  destino:
    secao_textual:
      conteudo: '# REGRAS E BOA CONVIVÊNCIA


        O OUROBOULDER adota os princípios internacionais do Leave No Trace (Não Deixe
        Rastros), filosofia de uso responsável de áreas naturais que visa minimizar
        o impacto humano no ambiente. Esses princípios devem ser rigorosamente seguidos
        por todos os participantes.


        1. Planeje e Prepare-se com Antecedência

        O planejamento adequado reduz a necessidade de improvisações que podem gerar
        impactos ambientais. Escaladores devem pesquisar as condições locais, verificar
        regulamentações específicas e preparar os equipamentos adequados antes da
        visita.


        2. Viaje e Acampe em Superfícies Resistentes

        Durante o deslocamento dentro do parque, utilize sempre trilhas já estabelecidas
        e evite abrir novos caminhos. O pisoteio em áreas de vegetação sensível pode
        causar danos permanentes, levando décadas para se recuperar. Importante: É
        estritamente proibido acampar dentro do parque. Essa regra visa proteger os
        ecossistemas noturnos e reduzir o impacto acumulado da presença humana. Durante
        o evento é permitido acampar na área designada pela organização.


        3. Descarte Adequadamente os Resíduos

        Todo resíduo gerado durante a escalada deve ser removido da área natural.
        Isso inclui não apenas lixo comum, mas também restos orgânicos, como cascas
        de frutas, que podem alterar o equilíbrio nutricional do solo e atrair fauna
        inadequada.


        4. Deixe o que Encontrar

        Evite remover ou alterar elementos naturais da área. Rochas, plantas, minerais
        e demais componentes do ecossistema devem permanecer em seus locais originais.
        A coleta de "souvenires" naturais pode parecer inofensiva, mas seu impacto
        acumulado é significativo.


        5. Minimize o Impacto das Fogueiras

        Fogueiras são proibidas em todo o parque. Essa medida visa prevenir incêndios
        florestais e proteger a vegetação local. Para aquecimento e preparo de alimentos,
        utilize equipamentos portáteis apropriados.


        6. Respeite a Vida Selvagem

        Mantenha distância segura da fauna local e nunca alimente os animais silvestres.
        A alimentação artificial altera o comportamento dos animais e pode torná-los
        dependentes da presença humana, prejudicando sua sobrevivência.


        7. Seja Cordial com Outros Visitantes

        O parque é frequentado por diversos grupos: escaladores, caminhantes, pesquisadores
        e turistas. Mantenha níveis de ruído adequados e respeite o direito de todos
        de desfrutarem o ambiente natural com tranquilidade.


        **ATENÇÃO: Assim como nas demais Unidades de Conservação - UC’s, é expressamente
        proibido trazer animais domésticos para o PNMA!**'
- texto: Geologia e História
  destino:
    secao_textual:
      conteudo: '# A Pedreira do Morro São Sebastião: Geologia, História e Revalorização
        Social


        Por Artur Simões e Gabriel Amora


        ## A Paisagem Forjada ao longo de Bilhões de Anos


        Os setores de escalada acessados pelo Morro São Sebastião em Ouro Preto (MG)
        são localizados na área do Parque Natural Municipal da Andorinhas. É um espaço
        que reúne um passado geológico complexo, uma história de exploração mineral
        intensa e uma recente transformação social e ambiental.


        As rochas que formam a pedreira do Morro São Sebastião pertencem à Formação
        Moeda, unidade geológica registrada no Quadrilátero Ferrífero. Há aproximadamente
        2,5 bilhões de anos, a crosta terrestre dessa região foi alongada e fragmentada
        por grandes falhas, formando depressões chamadas bacias rifte.


        Ao longo de milhões de anos, essas bacias foram preenchidas por sedimentos
        trazidos por rios e leques aluviais. Esses sedimentos, inicialmente arenosos,
        passaram por processos de compactação, acumulando um volume significativo
        de material ao ponto de atingir condições de temperatura e pressão que favoreceram
        a cimentação e recristalização mineral, etapas da litificação: nome dado ao
        conjunto de processos que permitem a “transformação” de sedimentos em rochas
        sedimentares.


        Esses processos deram origem a uma série de rochas sedimentares, dentre elas,
        arenitos que posteriormente passaram por processos de metamorfismo que resultaram
        nos quartzitos que observamos hoje.


        Dois eventos tectônicos são descritos na literatura como os principais processos
        responsáveis pelo metamorfismo observado na região do QF: A Orogênese Transamazônica,
        que ocorreu entre 2,2 e 2,0 bilhões de anos (Renger & Chemale Jr., 1989; Noce
        et al., 2007), e a Orogênese Brasiliana, ocorrida entre 650 e 500 milhões
        de anos (Alkmim & Marshak, 1998; Noce et al., 2007).


        Os processos metamórficos deformam as rochas, conferindo-lhes planos naturais
        denominados foliações. Essas estruturas são responsáveis pela inclinação dos
        blocos que observamos, por exemplo, na área da Pedreira – os famosos “tetos
        ouropretanos” representados na logo do evento.


        Pela mesma razão é comum que os blocos, em sua grande maioria compostos por
        afloramentos naturais, apresentem agarras em posições similares uma vez que
        essas mesmas foliações são também planos naturais por onde normalmente as
        agarras são formadas. Também por isso o quartzito da região se destaca pela
        formação de placas, muito valorizadas como revestimento ornamental e amplamente
        exploradas pela mineração local na segunda metade do século XX.


        ## A Exploração Mineral e Seus Impactos


        Durante muitos anos, o quartzito do Morro São Sebastião foi amplamente explorado
        como rocha ornamental, sendo utilizado na construção civil, especialmente
        para revestimentos e calçamentos. A extração mineral foi uma importante fonte
        de renda para as comunidades locais, mas também trouxe consequências ambientais.
        O desmatamento, a degradação do solo e o assoreamento do Rio das Velhas, um
        dos principais rios da região, foram alguns dos impactos diretos causados
        pela mineração desordenada.


        Com a criação da Área de Proteção Ambiental (APA) Cachoeira das Andorinhas,
        a extração mineral foi progressivamente restringida, o que gerou tensões sociais.
        Muitas famílias que dependiam da atividade se viram obrigadas a buscar novas
        formas de sustento, e surgiram movimentos comunitários reivindicando alternativas
        econômicas viáveis.


        ## A Ressignificação da Pedreira: Esporte e Sustentabilidade


        Após o encerramento das atividades mineradoras, a antiga pedreira foi gradualmente
        transformada em um espaço de convivência e prática esportiva. A partir de
        meados dos anos 2000, o local se tornou um dos principais pontos de escalada
        no estilo boulder da região e do Brasil, atraindo escaladores de todo o mundo,
        especialmente devido à proximidade com Belo Horizonte e à facilidade de acesso.


        A escalada no Morro São Sebastião representa um exemplo de uso sustentável
        de áreas degradadas, promovendo a valorização ambiental e social do espaço.
        A atividade contribui para o turismo local, incentiva a conservação e aproxima
        as pessoas da natureza, despertando o interesse pela geologia e pela proteção
        ambiental. Ressalta-se, no entanto, a importância dessa prática continuar
        sendo realizada com responsabilidade, respeitando os princípios do mínimo
        impacto e contribuindo para a preservação da região.


        ## Um Espaço de Memória e Convivência


        A história do Morro São Sebastião é marcada por transformações profundas.
        De uma área formada por processos geológicos de bilhões de anos, a um espaço
        de intensa exploração mineral, o local passou por um ciclo de degradação e
        hoje se destaca como um exemplo de reaproveitamento positivo. A escalada trouxe
        uma nova identidade para a antiga pedreira, integrando o esporte, a educação
        ambiental e o lazer de forma harmônica com a natureza.


        Os autores são geólogos formados pela Universidade Federal de Ouro Preto (UFOP).
        Ambos tiveram a pedreira como uma segunda casa em Ouro Preto, espaço que proporcionou
        encontros, experiências e memórias clássicas!


        **Viva a escalada ouropretana!**'
