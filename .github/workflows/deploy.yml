name: Deploy para Cloudflare R2 e D1

on:
  push:
    branches: [main]
    paths:
      - 'generated/**'
      - 'migracoes/**'
      - 'serving/**'
      - 'scripts/gerar_catalogo_sqlite_lib.py'
      - 'scripts/gerar_deltas_catalogo.py'
      - 'aresta_api'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Otimizado
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          filter: 'blob:none'
          submodules: recursive
          sparse-checkout: |
            .gitmodules
            serving/update_serving.py
            serving/sincronizar_d1_lib.py
            scripts/gerar_catalogo_sqlite_lib.py
            scripts/gerar_deltas_catalogo.py
            generated/arquivos_serving.yaml
            generated/catalogo.db
            migracoes
            aresta_api

      - name: Executar Update Serving
        run: python3 -u serving/update_serving.py
        env:
          PYTHONUNBUFFERED: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          R2_BUCKET: aresta-serving
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CATALOGO_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_CATALOGO_D1_DATABASE_ID }}
          CLOUDFLARE_CATALOGO_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_CATALOGO_D1_API_TOKEN }}
