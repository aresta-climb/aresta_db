name: Deploy para Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - 'generated/**'
      - 'migracoes/**'
      - 'serving/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Otimizado
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: 'blob:none'
          submodules: false
          sparse-checkout: |
            serving/update_serving.py
            generated/arquivos_serving.yaml
            migracoes

      - name: Executar Update Serving
        run: python3 serving/update_serving.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          R2_BUCKET: aresta-serving
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
