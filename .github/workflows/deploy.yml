name: Deploy para Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - 'generated/**'
      - 'migracoes/**'
      - 'serving/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Blobless
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
          submodules: false
          sparse-checkout: |
            .
            generated
            serving
            migracoes

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: serving/requirements-serving.txt

      - name: Cache Virtualenv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('serving/requirements-serving.txt') }}

      - name: Preparar Virtualenv
        run: |
          python -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: pip install -r serving/requirements-serving.txt


      - name: Executar Update Serving
        run: python serving/update_serving.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          R2_BUCKET: aresta-serving
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
