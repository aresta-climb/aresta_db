name: Integrador de Pull Requests

on:
  pull_request_review:
    types: [submitted]

jobs:
  integrate:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref }}
          
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: database/**
          dir_names: true
          dir_names_max_depth: 2
          
      - name: Run Deploy Generated
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          PYTHONPATH=. python scripts/deploy_generated.py --target ${{ steps.changed-files.outputs.all_changed_files }}
          
      - name: Commit and Push
        run: |
          git config user.name "Aresta Bot Integrador"
          git config user.email "bot@aresta.climb"
          git add generated/
          git commit -m "chore: compilação automática para deploy [skip ci]" || echo "Nenhuma alteração para commitar"
          git push
          
      - name: Auto Merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
