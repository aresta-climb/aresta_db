name: Integrador de Pull Requests

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  integrate:
    # Só roda se for um review 'approved' OU se for um comentário '/approve' (apenas de administradores/colaboradores)
    if: >-
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/approve') && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Gerar Token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Obter Informações do PR
        id: pr-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          BASE_BRANCH=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json baseRefName -q .baseRefName)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Checkout do Repositório
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          submodules: recursive
          ref: ${{ steps.pr-info.outputs.branch }}

      - name: Configurar uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Aguardar e Validar Checagens do Pull Request
        id: validacao_checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=. uv run --no-project python serving/integrador_pr_lib.py validar-checks \
            --pr "${{ steps.pr-info.outputs.pr_number || 0 }}" \
            --repo "${{ github.repository }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Erro Interno no Script de Validação
        if: always() && steps.validacao_checks.outputs.codigo_saida != '' && steps.validacao_checks.outputs.codigo_saida != '0' && steps.validacao_checks.outputs.codigo_saida != '1'
        run: |
          echo "🚨 ERRO INTERNO NO INTEGRADOR DE PR (exit code ${{ steps.validacao_checks.outputs.codigo_saida }})"
          exit 2

      - name: Instalar Dependências
        run: |
          uv sync --frozen --only-group deploy

      - name: Obter Arquivos Alterados
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: database/**
          dir_names: true
          dir_names_max_depth: 2
          # Garante que sempre compara a HEAD do PR com a branch base oficial do PR (ex: origin/main)
          base_sha: origin/${{ steps.pr-info.outputs.base_branch }}

      - name: Sincronizar Branch com a Branch Base
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=. uv run python serving/integrador_pr_lib.py sincronizar-base \
            --base-branch "${{ steps.pr-info.outputs.base_branch }}" \
            --app-slug "${{ steps.app-token.outputs.app-slug }}" \
            --repo "${{ github.repository }}"

      - name: Executar Deploy Generated
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          PYTHONPATH=. uv run scripts/deploy_generated.py --target ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Commitar e Enviar Alterações
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=. uv run python serving/integrador_pr_lib.py commitar-e-enviar \
            --app-slug "${{ steps.app-token.outputs.app-slug }}" \
            --repo "${{ github.repository }}"

      - name: Aguardar e Verificar Check do DCO
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=. uv run python serving/integrador_pr_lib.py verificar-dco \
            --pr "${{ steps.pr-info.outputs.pr_number }}" \
            --repo "${{ github.repository }}"

      - name: Realizar Merge do PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=. uv run python serving/integrador_pr_lib.py realizar-merge \
            --pr "${{ steps.pr-info.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --base-branch "${{ steps.pr-info.outputs.base_branch }}" \
            --pastas ${{ steps.changed-files.outputs.all_changed_files }}
