name: Build Editor Windows

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag do git para checkout'
        required: true
        type: string
      versao:
        description: 'Versão de lançamento do Editor Aresta'
        required: true
        type: string
      publicar_microsoft_store:
        description: 'Lançar também na Microsoft Store?'
        required: false
        type: boolean
        default: false

jobs:
  build_windows:
    name: Compilar e Lançar Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            .
            .github
            tests
            editor
            scripts
            serving
            migracoes
            aresta_api
            coleta_de_betas
            pytest.ini
            conftest.py
            pyproject.toml
            uv.lock
            .python-version

      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Suprimir WerFault
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name "DontShowUI" -Value 1 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name "Disabled" -Value 1 -Type DWord

      - name: Executar Testes (TDD & Coverage)
        timeout-minutes: 10
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          CI: "true"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          uv run pytest -n 0 -v -s --durations=10

      - name: Isolar Dependências Exclusivas do Editor
        run: |
          uv sync --frozen --only-group editor

      - name: Build PyInstaller (Canal Beta)
        run: |
          uv run editor/build.py dist
        env:
          PYTHONPATH: .
          ARESTA_CANAL: beta

      - name: Build MSIX Package (Canal Beta)
        shell: pwsh
        run: |
          $msixBetaDir = "msix_beta_staging"
          New-Item -ItemType Directory -Force -Path $msixBetaDir

          Copy-Item "editor\dist\EditorAresta\*" -Destination $msixBetaDir -Recurse
          Copy-Item "editor\msix_beta\AppxManifest.xml" -Destination $msixBetaDir
          Copy-Item "editor\msix_beta\Assets" -Destination "$msixBetaDir\Assets" -Recurse

          $version = "${{ inputs.versao }}"
          if (-not $version) {
              Write-Error "A versão de lançamento não foi informada ou está vazia."
              exit 1
          }
          if ($version -match "^\d+\.\d+\.\d+$") {
              $version = "$version.0"
          }
          $manifestPath = "$msixBetaDir\AppxManifest.xml"
          (Get-Content $manifestPath) -replace 'Version="1\.0\.0\.0"', "Version=`"$version`"" | Set-Content $manifestPath

          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $makeappx) {
              Write-Error "makeappx.exe not found"
              exit 1
          }

          & $makeappx pack /d $msixBetaDir /p EditorArestaBeta.msix

      - name: Assinar Pacote MSIX Beta
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) {
              Write-Error "signtool.exe not found"
              exit 1
          }

          if ("${{ secrets.EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_PFX }}" -eq "" -or "${{ secrets.EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_SENHA }}" -eq "") {
              Write-Error "ERRO CRITICO: Os segredos EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_PFX e EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_SENHA são obrigatórios para assinar o canal Beta. Configure-os nos Secrets do repositório."
              exit 1
          }

          Write-Host "Decodificando certificado PFX oficial configurado nos segredos..."
          [System.IO.File]::WriteAllBytes("cert_beta.pfx", [System.Convert]::FromBase64String("${{ secrets.EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_PFX }}"))
          
          $secPwd = ConvertTo-SecureString -String "${{ secrets.EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_SENHA }}" -Force -AsPlainText
          $certObj = Import-PfxCertificate -FilePath "cert_beta.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $secPwd
          Export-Certificate -Cert $certObj -FilePath "cert_beta.cer" | Out-Null

          & $signtool sign /fd SHA256 /a /f "cert_beta.pfx" /p "${{ secrets.EDITOR_ARESTA_BETA_CERTIFICADO_PRIVADO_SENHA }}" EditorArestaBeta.msix
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha na assinatura digital do pacote MSIX Beta."
              exit $LASTEXITCODE
          }

      - name: Publicar Canal Beta no Cloudflare R2 e Purgar Cache
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          CLOUDFLARE_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          CLOUDFLARE_S3_API_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: aresta-serving
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          PYTHONPATH: .
        run: |
          $cliArgs = @("--versao", "${{ inputs.versao }}", "--msix", "EditorArestaBeta.msix")
          if (Test-Path "cert_beta.cer") {
              $cliArgs += @("--cer", "cert_beta.cer")
          }
          uv run editor/release_tools/publicar_beta_cli.py @cliArgs

      - name: Disponibilizar artefatos do canal Beta no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: EditorArestaBeta-Windows-Distribuicao
          path: |
            EditorArestaBeta.msix
            EditorArestaBeta.appinstaller
            InstalarCertificadoEditorArestaBeta.bat
          retention-days: 7

      - name: Build PyInstaller (Produção)
        if: ${{ inputs.publicar_microsoft_store }}
        run: |
          uv run editor/build.py dist
        env:
          PYTHONPATH: .

      - name: Build MSIX Package
        if: ${{ inputs.publicar_microsoft_store }}
        shell: pwsh
        run: |
          $msixDir = "msix_staging"
          New-Item -ItemType Directory -Force -Path $msixDir
          
          Copy-Item "editor\dist\EditorAresta\*" -Destination $msixDir -Recurse
          Copy-Item "editor\msix\AppxManifest.xml" -Destination $msixDir
          Copy-Item "editor\msix\Assets" -Destination "$msixDir\Assets" -Recurse
          
          $version = "${{ inputs.versao }}"
          if (-not $version) {
              Write-Error "A versão de lançamento não foi informada ou está vazia."
              exit 1
          }
          if ($version -match "^\d+\.\d+\.\d+$") {
              $version = "$version.0"
          }
          $manifestPath = "$msixDir\AppxManifest.xml"
          (Get-Content $manifestPath) -replace 'Version="1\.0\.0\.0"', "Version=`"$version`"" | Set-Content $manifestPath
          
          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $makeappx) {
              Write-Error "makeappx.exe not found"
              exit 1
          }
          
          & $makeappx pack /d $msixDir /p EditorAresta.msix

      - name: Disponibilizar pacote MSIX no GitHub
        if: ${{ inputs.publicar_microsoft_store }}
        uses: actions/upload-artifact@v7
        with:
          name: EditorArestaClimb-Windows-MSIX
          path: EditorAresta.msix
          retention-days: 7

      - name: Setup MS Store CLI
        if: ${{ inputs.publicar_microsoft_store }}
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish to MS Store
        if: ${{ inputs.publicar_microsoft_store }}
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_DIRECTORY_TENANT_ID }} `
            --sellerId ${{ secrets.AZURE_SELLER_ID }} `
            --clientId ${{ secrets.AZURE_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} `
            -vvv

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha na autenticação do msstore CLI. Verifique os segredos AZURE_* configurados."
              exit $LASTEXITCODE
          }

          Write-Host "Publicando pacote na Microsoft Store e submetendo diretamente para certificação..."
          & msstore publish EditorAresta.msix -id "${{ secrets.AZURE_EDITOR_ARESTA_STORE_ID }}"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha na publicação do pacote na Microsoft Store."
              exit $LASTEXITCODE
          }
