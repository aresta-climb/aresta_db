name: Lançamento Editor Aresta

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de incremento de versão'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: 'patch'
      custom_version:
        description: 'Versão customizada (obrigatório se bump_type for custom, ex: 1.0.0)'
        required: false
        type: string
        default: ''
      deploy_windows:
        description: 'Deploy para Windows?'
        required: true
        type: boolean
        default: true
      deploy_macos:
        description: 'Deploy para macOS?'
        required: true
        type: boolean
        default: true
      deploy_linux:
        description: 'Deploy para Linux?'
        required: true
        type: boolean
        default: true
      publicar_microsoft_store:
        description: 'Lançar também na Microsoft Store? (compila produção e submete direto para revisão)'
        required: true
        type: boolean
        default: false
      forcar_atualizacao:
        description: 'Forçar atualização imediata para todos os usuários? (Habilitado por padrão)'
        required: true
        type: boolean
        default: true

jobs:
  prepare_release:
    name: Preparar Versão e Validar Testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      tag_name: ${{ steps.versao.outputs.tag_name }}
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            .
            .github
            tests
            editor
            scripts
            serving
            migracoes
            aresta_api
            coleta_de_betas
            pytest.ini
            conftest.py
            pyproject.toml
            uv.lock
            .python-version

      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Calcular Versão de Release
        id: versao
        shell: bash
        run: |
          RELEASE_VER=$(uv run editor/release_tools/calculate_release_version.py --tipo "${{ github.event.inputs.bump_type }}" --custom "${{ github.event.inputs.custom_version }}")
          echo "versao=$RELEASE_VER" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: .

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Injetar Versão Oficial
        run: |
          uv run editor/release_tools/bump_version.py editor/core/version.py ${{ steps.versao.outputs.versao }}
          uv lock
          git commit -am "chore: Lançar versão ${{ steps.versao.outputs.versao }} do Editor Aresta"
          git tag editor-v${{ steps.versao.outputs.versao }}

      - name: Executar Testes (TDD & Coverage)
        timeout-minutes: 10
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          uv run pytest -n 0 -v -s --durations=10

      - name: Calcular próxima versão -dev
        id: next_dev
        shell: bash
        run: |
          NEXT_VER=$(uv run editor/release_tools/calculate_next_dev.py ${{ steps.versao.outputs.versao }})
          echo "version=$NEXT_VER" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: .

      - name: Injetar Ciclo de Desenvolvimento
        run: |
          uv run editor/release_tools/bump_version.py editor/core/version.py ${{ steps.next_dev.outputs.version }}
          uv lock
          git commit -am "chore: iniciar ciclo de desenvolvimento do Editor Aresta"
        env:
          PYTHONPATH: .

      - name: Push Repositório
        run: |
          git push origin main
          git push origin editor-v${{ steps.versao.outputs.versao }}

      - name: Criar GitHub Release Oficial
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create editor-v${{ steps.versao.outputs.versao }} \
            --title "Editor Aresta v${{ steps.versao.outputs.versao }}" \
            --notes "Lançamento oficial do Editor Aresta v${{ steps.versao.outputs.versao }}." \
            --verify-tag || true

  build_windows:
    name: Build Windows
    needs: prepare_release
    if: ${{ inputs.deploy_windows }}
    uses: ./.github/workflows/build_editor_windows.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      versao: ${{ needs.prepare_release.outputs.versao }}
      publicar_microsoft_store: ${{ inputs.publicar_microsoft_store }}
    secrets: inherit

  build_macos:
    name: Build macOS
    needs: prepare_release
    if: ${{ inputs.deploy_macos }}
    uses: ./.github/workflows/build_editor_macos.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      versao: ${{ needs.prepare_release.outputs.versao }}
      forcar_atualizacao: ${{ inputs.forcar_atualizacao }}
    secrets: inherit

  build_linux:
    name: Build Linux
    needs: prepare_release
    if: ${{ inputs.deploy_linux }}
    uses: ./.github/workflows/build_editor_linux.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      versao: ${{ needs.prepare_release.outputs.versao }}
    secrets: inherit
