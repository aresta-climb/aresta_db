name: Lançamento Aresta Editor

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Nova versão (ex: 1.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          submodules: recursive
          sparse-checkout: |
            .
            editor
            scripts
            serving
            migracoes
            aresta_api
            pytest.ini

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            editor/requirements.txt 
            serving/requirements-serving.txt

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Injetar Versão Oficial
        run: |
          python editor/release_tools/bump_version.py editor/core/version.py ${{ github.event.inputs.new_version }}
          git commit -am "chore: Lançar versão ${{ github.event.inputs.new_version }} do Editor Aresta"
          git tag editor-v${{ github.event.inputs.new_version }}
        env:
          PYTHONPATH: .

      - name: Setup Graphviz (Cached)
        uses: ts-graphviz/setup-graphviz@v2

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r editor/requirements.txt
          pip install -r serving/requirements-serving.txt

      - name: Executar Testes (TDD & Coverage)
        timeout-minutes: 3
        run: |
          pytest
        env:
          PYTHONPATH: .

      - name: Build PyInstaller
        run: |
          python editor/build.py dist

      - name: Calcular próxima versão -dev
        id: next_dev
        shell: bash
        run: |
          NEXT_VER=$(python editor/release_tools/calculate_next_dev.py ${{ github.event.inputs.new_version }})
          echo "version=$NEXT_VER" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: .

      - name: Injetar Ciclo de Desenvolvimento
        run: |
          python editor/release_tools/bump_version.py editor/core/version.py ${{ steps.next_dev.outputs.version }}
          git commit -am "chore: iniciar ciclo de desenvolvimento do Editor Aresta"
        env:
          PYTHONPATH: .

      - name: Push Repositório
        run: |
          git push origin main
          git push origin editor-v${{ github.event.inputs.new_version }}

      - name: Publicar no Cloudflare R2 e Limpar Cache
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
        run: |
          aws s3 cp editor/dist/ArestaEditor.exe s3://aresta-serving/editor/ArestaEditor.exe --endpoint-url $R2_ENDPOINT_URL --content-disposition "attachment" --content-type "application/x-msdownload"
          
          echo "Limpando cache do Cloudflare para o executável..."
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
               -H "Authorization: Bearer $CLOUDFLARE_CACHE_PURGE_API_TOKEN" \
               -H "Content-Type: application/json" \
               -d '{ "files": ["https://serving.arestaclimb.com/editor/ArestaEditor.exe"] }'
