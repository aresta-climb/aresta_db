name: Lançamento Aresta Editor

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Nova versão (ex: 1.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          submodules: recursive
          sparse-checkout: |
            .
            editor
            scripts
            serving
            migracoes
            aresta_api
            pytest.ini

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            editor/requirements.txt 
            requirements.txt

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Injetar Versão Oficial
        run: |
          python editor/release_tools/bump_version.py editor/core/version.py ${{ github.event.inputs.new_version }}
          git commit -am "chore: Lançar versão ${{ github.event.inputs.new_version }}"
          git tag v${{ github.event.inputs.new_version }}
        env:
          PYTHONPATH: .

      - name: Install Dependencies
        run: |
          pip install -r editor/requirements.txt
          pip install -r requirements.txt

      - name: Executar Testes (TDD & Coverage)
        timeout-minutes: 3
        run: |
          pytest
        env:
          PYTHONPATH: .

      - name: Build PyInstaller
        run: |
          pyinstaller editor/ArestaEditor.spec --onefile --clean

      - name: Calcular próxima versão -dev
        id: next_dev
        run: |
          NEXT_VER=$(python editor/release_tools/calculate_next_dev.py ${{ github.event.inputs.new_version }})
          echo "version=$NEXT_VER" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: .

      - name: Injetar Ciclo de Desenvolvimento
        run: |
          python editor/release_tools/bump_version.py editor/core/version.py ${{ steps.next_dev.outputs.version }}
          git commit -am "chore: iniciar ciclo de desenvolvimento"
        env:
          PYTHONPATH: .

      - name: Push Repositório
        run: |
          git push origin main
          git push origin v${{ github.event.inputs.new_version }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.new_version }}
          files: dist/ArestaEditor.exe
          name: Aresta Editor v${{ github.event.inputs.new_version }}
          draft: false
          prerelease: false
