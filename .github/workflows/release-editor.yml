name: Lançamento Editor Aresta

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Nova versão (ex: 1.2.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            .
            editor
            scripts
            serving
            migracoes
            aresta_api
            pytest.ini

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            editor/requirements.txt

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Injetar Versão Oficial
        run: |
          python editor/release_tools/bump_version.py editor/core/version.py ${{ github.event.inputs.new_version }}
          git commit -am "chore: Lançar versão ${{ github.event.inputs.new_version }} do Editor Aresta"
          git tag editor-v${{ github.event.inputs.new_version }}
        env:
          PYTHONPATH: .

      - name: Cache Graphviz
        id: cache-graphviz
        uses: actions/cache@v6
        with:
          path: C:\Program Files\Graphviz
          key: ${{ runner.os }}-graphviz-choco

      - name: Install Graphviz
        if: steps.cache-graphviz.outputs.cache-hit != 'true'
        run: choco install graphviz --no-progress

      - name: Add Graphviz to PATH
        run: echo "C:\Program Files\Graphviz\bin" >> $GITHUB_PATH

      - name: Cache Virtualenv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'editor/requirements.txt') }}

      - name: Preparar Virtualenv
        run: |
          python -m venv venv
          echo "${{ github.workspace }}\venv\Scripts" >> $GITHUB_PATH

      - name: Install Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          pip install -r editor/requirements.txt

      - name: Executar Testes (TDD & Coverage)
        timeout-minutes: 3
        run: |
          pytest
        env:
          PYTHONPATH: .

      - name: Build PyInstaller
        run: |
          python editor/build.py dist

      - name: Build MSIX Package
        shell: pwsh
        run: |
          $msixDir = "msix_staging"
          New-Item -ItemType Directory -Force -Path $msixDir
          
          Copy-Item "editor\dist\EditorAresta.exe" -Destination $msixDir
          Copy-Item "editor\msix\AppxManifest.xml" -Destination $msixDir
          Copy-Item "editor\msix\Assets" -Destination "$msixDir\Assets" -Recurse
          
          $version = "${{ github.event.inputs.new_version }}"
          if ($version -match "^\d+\.\d+\.\d+$") {
              $version = "$version.0"
          }
          $manifestPath = "$msixDir\AppxManifest.xml"
          (Get-Content $manifestPath) -replace 'Version="1\.0\.0\.0"', "Version=`"$version`"" | Set-Content $manifestPath
          
          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $makeappx) {
              Write-Error "makeappx.exe not found"
              exit 1
          }
          
          & $makeappx pack /d $msixDir /p EditorAresta.msix

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_APPLICATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_DIRECTORY_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup MS Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish to MS Store
        env:
          MSSTORE_TENANTID: ${{ secrets.AZURE_DIRECTORY_TENANT_ID }}
          MSSTORE_CLIENTID: ${{ secrets.AZURE_APPLICATION_CLIENT_ID }}
          MSSTORE_SELLERID: ${{ secrets.AZURE_SELLER_ID }}
        run: |
          msstore publish EditorAresta.msix --store-id ${{ secrets.AZURE_EDITOR_ARESTA_STORE_ID }}

      - name: Calcular próxima versão -dev
        id: next_dev
        shell: bash
        run: |
          NEXT_VER=$(python editor/release_tools/calculate_next_dev.py ${{ github.event.inputs.new_version }})
          echo "version=$NEXT_VER" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: .

      - name: Injetar Ciclo de Desenvolvimento
        run: |
          python editor/release_tools/bump_version.py editor/core/version.py ${{ steps.next_dev.outputs.version }}
          git commit -am "chore: iniciar ciclo de desenvolvimento do Editor Aresta"
        env:
          PYTHONPATH: .

      - name: Push Repositório
        run: |
          git push origin main
          git push origin editor-v${{ github.event.inputs.new_version }}

