name: Validador do Database (PR)

on:
  pull_request:
    paths:
      - 'database/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          sparse-checkout: |
            database
            editor
            serving
            scripts
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            serving/requirements-pr_db_validator.txt
            requirements-deploy.txt

      - name: Install dependencies
        run: pip install -r serving/requirements-pr_db_validator.txt
          
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: database/**
          dir_names: true
          dir_names_max_depth: 2
          
      - name: Run Validator
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          PYTHONPATH=. python serving/pr_db_validator.py --pastas ${{ steps.changed-files.outputs.all_changed_files }} --saida saida_croquis
          
      - name: Upload Artifacts
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: croquis-validados
          path: saida_croquis/*.croqui
