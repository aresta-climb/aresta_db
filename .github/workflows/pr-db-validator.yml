name: Validador do Database (PR)

on:
  pull_request:
    paths:
      - 'database/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: true
          sparse-checkout: |
            database
            editor
            serving
            scripts
            pyproject.toml
            uv.lock
            .python-version
      
      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --only-group validador
          
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: database/**
          dir_names: true
          dir_names_max_depth: 2
          
      - name: Run Validator
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          uv run serving/pr_db_validator.py --pastas ${{ steps.changed-files.outputs.all_changed_files }} 2>&1 | tee validador_output.txt

      - name: Gerar Comentário de Sucesso
        if: success() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "✅ **Validação Concluída com Sucesso!** Todos os cabeçalhos, licenças e croquis modificados foram validados sem erros." > pr_comment.txt

      - name: Gerar Comentário de Falha
        if: failure() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "❌ **Falha na Validação do Pull Request**" > pr_comment.txt
          echo "" >> pr_comment.txt
          echo "\`\`\`" >> pr_comment.txt
          cat validador_output.txt >> pr_comment.txt 2>/dev/null || echo "Falha na execução do validador." >> pr_comment.txt
          echo "\`\`\`" >> pr_comment.txt

      - name: Comentar no PR
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -f pr_comment.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file pr_comment.txt
          fi

