name: Validador do Database (PR)

on:
  pull_request:
    paths:
      - 'database/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: true
          sparse-checkout: |
            database
            editor
            serving
            scripts
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            serving/requirements-pr_db_validator.txt
            requirements-deploy.txt

      - name: Install dependencies
        run: pip install -r serving/requirements-pr_db_validator.txt
          
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: database/**
          dir_names: true
          dir_names_max_depth: 2
          
      - name: Run Validator
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          PYTHONPATH=. python serving/pr_db_validator.py --pastas ${{ steps.changed-files.outputs.all_changed_files }} --saida saida_croquis
          
      - name: Upload para Cloudflare R2
        if: success() && steps.changed-files.outputs.any_changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
        run: |
          COMMENT_BODY="📦 **Validação Concluída!** O(s) croqui(s) compilado(s) estão prontos para testes direto no app:\n"
          
          for file in saida_croquis/*.croqui; do
            if [ -f "$file" ]; then
              UUID=$(uuidgen)
              NEW_NAME="pr-${UUID}.croqui"
              aws s3 cp "$file" "s3://aresta-serving/pr-artifacts/$NEW_NAME" --endpoint-url $R2_ENDPOINT_URL --content-disposition "attachment" --content-type "application/octet-stream"
              URL="https://serving.arestaclimb.com/pr-artifacts/$NEW_NAME"
              COMMENT_BODY="$COMMENT_BODY\n- 🧗 [Baixar $NEW_NAME]($URL)"
            fi
          done
          
          echo -e "$COMMENT_BODY" > pr_comment.txt

      - name: Comentar Link na PR
        if: success() && steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -f pr_comment.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file pr_comment.txt
          fi
