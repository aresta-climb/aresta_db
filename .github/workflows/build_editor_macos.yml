name: Build Editor macOS (ARM64)

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag do git para checkout'
        required: true
        type: string
      versao:
        description: 'Versão de lançamento do Editor Aresta'
        required: true
        type: string
      forcar_atualizacao:
        description: 'Forçar atualização imediata para todos os usuários?'
        required: false
        type: boolean
        default: true

jobs:
  build_macos:
    name: Compilar e Lançar macOS (ARM64)
    runs-on: macos-14
    permissions:
      contents: read
    outputs:
      dmg_path: ${{ steps.empacotar-dmg.outputs.dmg_path }}
      dmg_nome: ${{ steps.empacotar-dmg.outputs.dmg_nome }}
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            .
            .github
            tests
            editor
            scripts
            serving
            migracoes
            aresta_api
            coleta_de_betas
            pytest.ini
            conftest.py
            pyproject.toml
            uv.lock
            .python-version


      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Executar Testes (TDD & Coverage)
        timeout-minutes: 10
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          CI: "true"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          uv run pytest -n 0 -v -s --durations=10

      - name: Isolar Dependências do Editor e Deploy
        run: |
          uv sync --frozen --only-group editor_deploy

      - name: Baixar Sparkle Framework Oficial (Última Versão)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sparkle-project/Sparkle --pattern "Sparkle-*.tar.xz" --dir .
          tar -xf Sparkle-*.tar.xz Sparkle.framework

      - name: Build PyInstaller no macOS (ARM64)
        run: |
          uv run editor/build.py dist
        env:
          PYTHONPATH: .

      - name: Configurar Certificado Apple Developer ID
        env:
          PYTHONPATH: .
          APPLE_CERT_P12: ${{ secrets.ARESTA_EDITOR_APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.ARESTA_EDITOR_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          python3 -m editor.release_tools.configurar_certificado_macos

      - name: Configurar Credenciais de Notarização Apple (App Store Connect API)
        env:
          APPLE_API_KEY: ${{ secrets.ARESTA_EDITOR_APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.ARESTA_EDITOR_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ARESTA_EDITOR_APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY" ]; then
            python3 -c "import os, base64; open('AuthKey.p8', 'wb').write(base64.b64decode(os.environ['APPLE_API_KEY'].strip()))"
            xcrun notarytool store-credentials "notary-profile" \
              --key AuthKey.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER"
            rm -f AuthKey.p8
          else
            echo "Credenciais de API Apple não configuradas, pulando etapa."
          fi

      - name: Empacotar e Notarizar DMG
        id: empacotar-dmg
        env:
          PYTHONPATH: .
          APPLE_CERT_P12: ${{ secrets.ARESTA_EDITOR_APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY: ${{ secrets.ARESTA_EDITOR_APPLE_API_KEY_BASE64 }}
        run: |
          python3 -c "
          from pathlib import Path
          from editor.release_tools.empacotar_macos_dmg import empacotar_distribuicao_macos
          import os

          tem_cert = bool(os.environ.get('APPLE_CERT_P12', '').strip())
          tem_api = bool(os.environ.get('APPLE_API_KEY', '').strip())
          identidade = 'Developer ID Application' if tem_cert else None
          profile = 'notary-profile' if tem_api else None
          sparkle_fw = Path('Sparkle.framework')

          empacotar_distribuicao_macos(
              diretorio_onedir=Path('editor/dist/EditorAresta'),
              diretorio_saida=Path('dist_macos'),
              versao='${{ inputs.versao }}',
              identidade_assinatura=identidade,
              notarizar=bool(profile),
              profile=profile,
              caminho_sparkle_framework=sparkle_fw if sparkle_fw.exists() else None,
              dry_run=not tem_cert,
          )
          "
          DMG_PATH="dist_macos/EditorAresta-${{ inputs.versao }}.dmg"
          echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "dmg_nome=EditorAresta-${{ inputs.versao }}.dmg" >> $GITHUB_OUTPUT

      - name: Gerar Feed Sparkle (appcast.xml)
        env:
          PYTHONPATH: .
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.ARESTA_EDITOR_SPARKLE_PRIVATE_KEY }}
          FORCAR_ATUALIZACAO: ${{ inputs.forcar_atualizacao }}
        run: |
          python3 -c "
          from pathlib import Path
          from editor.release_tools.gerador_feed_sparkle import assinar_arquivo_ed25519, gerar_feed_sparkle, salvar_feed_sparkle
          import os

          caminho_dmg = Path('dist_macos/EditorAresta-${{ inputs.versao }}.dmg')
          chave_privada = os.environ.get('SPARKLE_ED25519_PRIVATE_KEY', '')
          forcar = str(os.environ.get('FORCAR_ATUALIZACAO', 'true')).lower() != 'false'

          if chave_privada and caminho_dmg.exists():
              sig = assinar_arquivo_ed25519(caminho_dmg, chave_privada)
          else:
              sig = 'MOCK_SIGNATURE_DRY_RUN'

          tam = caminho_dmg.stat().st_size if caminho_dmg.exists() else 0
          url = 'https://serving.arestaclimb.com/editor-macos/EditorAresta-${{ inputs.versao }}.dmg'

          xml = gerar_feed_sparkle(
              versao='${{ inputs.versao }}',
              url_download=url,
              tamanho_bytes=tam,
              assinatura_ed25519=sig,
              forcar_atualizacao=forcar,
          )
          salvar_feed_sparkle(xml, Path('dist_macos/appcast.xml'))
          "

      - name: Publicar Canal macOS no Cloudflare R2 e Purgar Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_S3_API_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
        run: |
          uv run python3 editor/release_tools/publicar_macos_cli.py \
            --versao "${{ inputs.versao }}" \
            --diretorio-dist dist_macos

      - name: Disponibilizar artefatos macOS no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: EditorAresta-macOS-DMG
          path: |
            dist_macos/*.dmg
            dist_macos/appcast.xml
          retention-days: 7

      - name: Disponibilizar DMG macOS no GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: EditorAresta-${{ inputs.versao }}-macOS-DMG
          path: dist_macos/*.dmg
          retention-days: 14

