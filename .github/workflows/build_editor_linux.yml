name: Build Editor Linux

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag do git para checkout'
        required: true
        type: string
      versao:
        description: 'Versão de lançamento do Editor Aresta'
        required: true
        type: string

jobs:
  build_linux:
    name: Compilar e Lançar Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flatpak_bundle_path: ${{ steps.gerar-bundle.outputs.bundle_path }}
      flatpak_bundle_nome: ${{ steps.gerar-bundle.outputs.bundle_nome }}
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            .
            .github
            tests
            editor
            scripts
            serving
            migracoes
            aresta_api
            coleta_de_betas
            pytest.ini
            conftest.py
            pyproject.toml
            uv.lock
            .python-version


      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar Dependências de Deploy do Editor
        run: |
          uv sync --frozen --only-group editor_deploy_flatpak

      - name: Instalar Flatpak e Ferramentas de Build
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder ostree
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Sdk//6.11 org.kde.Platform//6.11 io.qt.PySide.BaseApp//6.11
          sudo rm -rf /run/user/$(id -u)/dconf
          sudo mkdir -p /run/user/$(id -u)/dconf
          sudo chown -R $(id -u):$(id -g) /run/user/$(id -u)
          sudo chmod 700 /run/user/$(id -u)

      - name: Gerar Manifesto de Dependências Flatpak (pypi-dependencies.json)
        run: |
          uv run editor/build.py flatpak-deps --output editor/flatpak/pypi-dependencies.json
          cp editor/flatpak/pypi-dependencies.json /tmp/pypi-dependencies.json

      - name: Configurar Chave GPG e Bootstrap do Repositório OSTree
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ARESTA_EDITOR_FLATPAK_GPG_PRIVATE_KEY }}
          PYTHONPATH: .
        run: |
          mkdir -p repo
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Erro: A secret ARESTA_EDITOR_FLATPAK_GPG_PRIVATE_KEY não está configurada. A assinatura GPG do repositório Flatpak é estritamente obrigatória para lançamentos."
            exit 1
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | cut -d: -f5 | head -n1)
          if [ -z "$GPG_KEY_ID" ]; then
            echo "Erro: Não foi possível obter o ID da chave privada GPG importada."
            exit 1
          fi

          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
          GPG_PUBLIC_B64=$(gpg --export "$GPG_KEY_ID" | base64 -w0)
          echo "GPG_PUBLIC_B64=$GPG_PUBLIC_B64" >> $GITHUB_ENV
          echo "Chave GPG ($GPG_KEY_ID) configurada com sucesso para assinatura do repositório."

          uv run editor/release_tools/publicar_flatpak_cli.py bootstrap --repo-dir repo

      - name: Compilar Repositório Flatpak com Cache
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: editor/flatpak/com.arestaclimb.Editor.yaml
          cache: true
          build-bundle: false
          run-tests: false
          gpg-sign: ${{ env.GPG_KEY_ID }}

      - name: Atualizar Índices do Repositório OSTree e Gerar Deltas
        run: |
          flatpak build-update-repo --generate-static-deltas --gpg-sign="$GPG_KEY_ID" repo

      - name: Gerar Pacote Flatpak Bundle (.flatpak)
        id: gerar-bundle
        run: |
          mkdir -p dist_bundle
          BUNDLE_PATH="dist_bundle/EditorAresta-${{ inputs.versao }}.flatpak"
          uv run editor/release_tools/publicar_flatpak_cli.py empacotar \
            --repo-dir repo \
            --saida "$BUNDLE_PATH" \
            --chave-gpg-id "$GPG_KEY_ID"
          echo "bundle_path=$BUNDLE_PATH" >> $GITHUB_OUTPUT
          echo "bundle_nome=EditorAresta-${{ inputs.versao }}.flatpak" >> $GITHUB_OUTPUT

      - name: Gerar e Publicar Source Tarball na Release do GitHub
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p /tmp/dist-src
          uv run editor/build.py source-tarball --versao ${{ inputs.versao }} --output-dir /tmp/dist-src
          TARBALL_NOME="EditorAresta-${{ inputs.versao }}-source.tar.gz"
          TARBALL_PATH="/tmp/dist-src/$TARBALL_NOME"
          
          # Anexa o tarball enxuto aos assets da Release oficial do GitHub
          gh release upload "editor-v${{ inputs.versao }}" "$TARBALL_PATH" --clobber || true

      - name: Publicar Repositório Flatpak no Cloudflare R2 e Purgar Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_S3_API_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          GPG_PUBLIC_B64: ${{ env.GPG_PUBLIC_B64 }}
          PYTHONPATH: .
        run: |
          uv run editor/release_tools/publicar_flatpak_cli.py publicar \
            --versao "${{ inputs.versao }}" \
            --repo-dir repo \
            --chave-gpg-b64 "$GPG_PUBLIC_B64"

      - name: Disponibilizar artefatos Linux no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: EditorAresta-Linux-Flatpak
          path: |
            dist_bundle/*.flatpak
            dist_flatpak_meta/*
            editor/flatpak/*
            /tmp/pypi-dependencies.json
          retention-days: 7

      - name: Disponibilizar Bundle Flatpak no GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: EditorAresta-${{ inputs.versao }}-Linux-Bundle
          path: dist_bundle/*.flatpak
          retention-days: 14

