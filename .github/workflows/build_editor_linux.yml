name: Build Editor Linux

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag do git para checkout'
        required: true
        type: string
      versao:
        description: 'Versão de lançamento do Editor Aresta'
        required: true
        type: string

jobs:
  build_linux:
    name: Compilar e Lançar Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            .
            .github
            tests
            editor
            scripts
            serving
            migracoes
            aresta_api
            coleta_de_betas
            pytest.ini
            conftest.py
            pyproject.toml
            uv.lock
            .python-version


      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar Dependências de Deploy do Editor
        run: |
          uv sync --frozen --only-group editor_deploy_flatpak

      - name: Instalar Flatpak e Ferramentas de Build
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder ostree
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Sdk//6.11 org.kde.Platform//6.11 io.qt.PySide.BaseApp//6.11

      - name: Gerar Manifesto de Dependências Flatpak (pypi-dependencies.json)
        run: |
          uv run editor/build.py flatpak-deps --output editor/flatpak/pypi-dependencies.json
          cp editor/flatpak/pypi-dependencies.json /tmp/pypi-dependencies.json

      - name: Configurar Chave GPG e Bootstrap do Repositório OSTree
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ARESTA_FLATPAK_GPG_PRIVATE_KEY }}
          PYTHONPATH: .
        run: |
          mkdir -p repo
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | cut -d: -f5 | head -n1)
            echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
            GPG_PUBLIC_B64=$(gpg --export "$GPG_KEY_ID" | base64 -w0)
            echo "GPG_PUBLIC_B64=$GPG_PUBLIC_B64" >> $GITHUB_ENV
            echo "Chave GPG configurada com sucesso para assinatura do repositório."
          else
            echo "Aviso: ARESTA_FLATPAK_GPG_PRIVATE_KEY não configurada. Repositório será gerado sem assinatura GPG."
          fi

          # Verifica se o repositório remoto já existe no R2 sem suprimir erros com || true
          python3 -c "
          from editor.release_tools.publicar_flatpak_r2 import verificar_estado_repositorio_remoto
          import subprocess
          import sys

          url_summary = 'https://serving.arestaclimb.com/flatpak/repo/summary'
          existe = verificar_estado_repositorio_remoto(url_summary)
          if existe:
              print('Repositório remoto encontrado no R2. Puxando commit anterior para static deltas...')
              subprocess.run(['ostree', '--repo=repo', 'remote', 'add', '--if-not-exists', 'aresta-remote', 'https://serving.arestaclimb.com/flatpak/repo'], check=True)
              subprocess.run(['ostree', '--repo=repo', 'pull', '--mirror', 'aresta-remote', 'app/com.arestaclimb.Editor/x86_64/stable'], check=True)
          else:
              print('Primeira publicação histórica detectada. Inicializando repositório limpo...')
              subprocess.run(['ostree', '--repo=repo', 'init', '--mode=archive-z2'], check=True)
          "

      - name: Compilar Repositório Flatpak com Cache
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: editor/flatpak/com.arestaclimb.Editor.yaml
          cache: true
          build-bundle: false
          run-tests: false

      - name: Atualizar Índices do Repositório OSTree e Gerar Deltas
        run: |
          GPG_OPTS=""
          if [ -n "$GPG_KEY_ID" ]; then
            GPG_OPTS="--gpg-sign=$GPG_KEY_ID"
          fi
          flatpak build-update-repo --generate-static-deltas $GPG_OPTS repo

      - name: Gerar e Publicar Source Tarball na Release do GitHub
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p /tmp/dist-src
          uv run editor/build.py source-tarball --versao ${{ inputs.versao }} --output-dir /tmp/dist-src
          TARBALL_NOME="EditorAresta-${{ inputs.versao }}-source.tar.gz"
          TARBALL_PATH="/tmp/dist-src/$TARBALL_NOME"
          
          # Anexa o tarball enxuto aos assets da Release oficial do GitHub
          gh release upload "editor-v${{ inputs.versao }}" "$TARBALL_PATH" --clobber || true

      - name: Publicar Repositório Flatpak no Cloudflare R2 e Purgar Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_S3_API_URL: ${{ secrets.CLOUDFLARE_S3_API_URL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          GPG_PUBLIC_B64: ${{ env.GPG_PUBLIC_B64 }}
          PYTHONPATH: .
        run: |
          python3 -c "
          import os
          from pathlib import Path
          from editor.release_tools.publicar_flatpak_r2 import PublicadorFlatpakR2

          publicador = PublicadorFlatpakR2()
          print('Sincronizando repositório OSTree para o Cloudflare R2...')
          chaves = publicador.sincronizar_diretorio_ostree(Path('repo'))
          print(f'Upload concluído: {len(chaves)} arquivos sincronizados.')

          chave_gpg = os.environ.get('GPG_PUBLIC_B64', '')
          arquivos_meta = publicador.publicar_metadados(
              versao='${{ inputs.versao }}',
              chave_gpg_base64=chave_gpg,
              diretorio_saida=Path('dist_flatpak_meta'),
              obrigatoria=True,
          )
          print(f'Metadados publicados: {list(arquivos_meta.keys())}')

          if publicador.zone_id and publicador.api_token:
              urls = publicador.obter_urls_purga()
              publicador.purgar_cache(urls)
              print(f'Purgação de cache executada com sucesso para {len(urls)} URLs na Cloudflare.')
          else:
              print('Credenciais da Cloudflare ausentes para purgar cache.')
          "

      # A sincronização direta com o repositório do Flathub fica comentada enquanto o aplicativo
      # é distribuído de forma soberana pelo repositório OSTree próprio no Cloudflare R2.
      # - name: Sincronizar Manifesto com Repositório Flathub
      #   run: |
      #     echo "Sincronização com Flathub suspensa temporariamente."

      - name: Disponibilizar artefatos Linux no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: EditorAresta-Linux-Flatpak
          path: |
            dist_flatpak_meta/*
            editor/flatpak/*
            /tmp/pypi-dependencies.json
          retention-days: 7

