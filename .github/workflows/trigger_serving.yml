name: Notificar aresta_serving

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'generated/**'
      - 'scripts/deploy_generated.py'
      - 'scripts/preparar_submissao_lib.py'
      - 'requirements-deploy.txt'

  # Permite disparar manualmente pela aba Actions no GitHub
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Gerar Token do GitHub App
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: aresta-climb

      - name: Disparar deploy no aresta_serving
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: aresta-climb/aresta_serving
          event-type: aresta-db-updated
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }
