  estado: MG
  descricao: "# Pedreira Dr. Gravatá\n\n**Conhecer o pico é mais do que conhecer as vias.**\n\
    \nLocalizada em **Betim, Minas Gerais**, a Pedreira Dr. Gravatá reúne hoje **mais de 50
    vias de escalada esportiva**, linhas de rapel e diferentes setores em desenvolvimento.\n\
    \nA organização atual da área, a abertura de novas linhas e a consolidação das informações
    são conduzidas por **Marcio Macena e Samuel Lucas**, responsáveis pelo desenvolvimento do
    pico e por grande parte do conhecimento contemporâneo reunido neste registro.\n\nA escalada,
    porém, é o capítulo mais recente de uma paisagem marcada por transformações anteriores.\n\
    \nNo início do século XX, quando Betim ainda era conhecida como **Capela Nova do Betim**,
    a região passou por mudanças ligadas à exploração de pedreiras, à implantação da ferrovia
    e à geração de energia. Pesquisas históricas registram a importância das pedreiras locais
    no fornecimento de materiais para o crescimento de Belo Horizonte e mostram como pedra,
    trabalho e infraestrutura conectaram Capela Nova à nova capital mineira.\n\nEm **1914**,
    entrou em funcionamento a **Usina Hidrelétrica Dr. Gravatá**, instalada no Rio Betim e associada
    ao engenheiro Antônio Gonçalves Gravatá. O complexo utilizava aproximadamente **84 metros
    de desnível** e incluía barragem, canais, reservatório, tubulações e Casa de Máquinas. Há
    registros de que parte da energia produzida foi destinada à operação de uma pedreira localizada
    na mesma **Fazenda Cachoeira**.\n\nA usina permaneceu em atividade até a década de 1950
    e foi **tombada pelo município de Betim em 2001**, preservando parte importante da memória
    industrial da cidade.\n\nAinda não há documentação suficiente para afirmar que a parede
    atualmente utilizada pelos escaladores corresponde exatamente à frente histórica de extração
    mencionada nesses registros. Essa relação permanece aberta à pesquisa e deve ser atualizada
    conforme novos mapas, documentos, relatos e evidências de campo forem incorporados.\n\n\
    Hoje, a escalada acrescenta uma nova camada a esse território. Setores como **Vale dos Ossos**
    e **Palanque** já possuem vias documentadas, enquanto novas linhas continuam sendo abertas,
    mantidas e consolidadas.\n\nEste croqui reúne diferentes tipos de informação em um único
    lugar:\n\n**acesso, localização, setores, vias, graduações, conquistadores, manutenção,
    segurança, história e fontes.**\n\nO objetivo é permitir que quem chega hoje encontre informações
    confiáveis — e que quem chegar no futuro consiga entender como esse pico foi construído.\n\
    \n*Um croqui ajuda a encontrar uma via. Um bom registro ajuda a compreender o lugar inteiro.*\n\
    \n**Pedreira Dr. Gravatá — Betim, Minas Gerais.**  \n**Mais de 50 vias e uma história que
    começou muito antes da primeira conquista.**\n"
  setores_ou_grupos:
  - grupo:
      caminho: grupo_setores.md
descricao: 'A **Pedreira Dr. Gravatá**, em Betim/MG, reúne **mais de 50 vias de escalada esportiva**,
  linhas de rapel e setores em desenvolvimento. O pico é conduzido por **Marcio Macena e Samuel
  Lucas**. Este registro organiza acesso, setores, vias, autoria e história de uma paisagem
  ligada às antigas pedreiras, à ferrovia e à Usina Hidrelétrica Dr. Gravatá, inaugurada em
  1914. Um croqui para escalar hoje e preservar conhecimento para quem vier depois.

  '
