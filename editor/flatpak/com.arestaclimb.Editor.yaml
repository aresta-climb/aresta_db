app-id: com.arestaclimb.Editor
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: EditorAresta

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=home:ro
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd
  - --env=XKB_LOG_LEVEL=critical

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1"
    BASEAPP_DISABLE_NUMPY: "1"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - pypi-dependencies.json

  - name: aresta-editor
    buildsystem: simple
    build-commands:
      # Instalação dos arquivos do editor
      - mkdir -p /app/share/aresta-editor
      - cp -r editor /app/share/aresta-editor/
      - cp -r aresta_api /app/share/aresta-editor/ || true
      - cp uv.lock /app/share/aresta-editor/
      - echo "producao" > /app/share/aresta-editor/canal.txt
      # Criação do script lançador nativo
      - |
        cat << 'EOF' > /app/bin/EditorAresta
        #!/bin/sh
        export PYTHONPATH="/app/lib/python3.11/site-packages:/app/lib/python3.12/site-packages:/app/lib/python3.13/site-packages:/app/share/aresta-editor:$PYTHONPATH"
        exec python3 -m editor.main "$@"
        EOF
      - chmod +x /app/bin/EditorAresta
      # Instalação dos arquivos de integração do desktop
      - install -D -m644 com.arestaclimb.Editor.desktop /app/share/applications/com.arestaclimb.Editor.desktop
      - install -D -m644 com.arestaclimb.Editor.metainfo.xml /app/share/metainfo/com.arestaclimb.Editor.metainfo.xml
      - install -D -m644 logo_app.png /app/share/icons/hicolor/512x512/apps/com.arestaclimb.Editor.png
    sources:
      - type: dir
        path: ../../editor
        dest: editor
      - type: file
        path: ../../uv.lock
      - type: file
        path: com.arestaclimb.Editor.desktop
      - type: file
        path: com.arestaclimb.Editor.metainfo.xml
      - type: file
        path: logo_app.png
