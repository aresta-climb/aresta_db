app-id: com.arestaclimb.Editor
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: EditorAresta

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --env=XKB_LOG_LEVEL=critical

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1"
    BASEAPP_DISABLE_NUMPY: "1"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - pypi-dependencies.json

  - name: aresta-editor
    buildsystem: simple
    build-commands:
      # Editor's Python scripts
      - mkdir -p /app/share/aresta-editor
      - cp -r editor /app/share/aresta-editor/
      - cp -r aresta_api /app/share/aresta-editor/
      - cp -r scripts /app/share/aresta-editor/
      - cp -r coleta_de_betas /app/share/aresta-editor/
      - cp -r migracoes /app/share/aresta-editor/
      - cp -r serving /app/share/aresta-editor/
      - cp uv.lock /app/share/aresta-editor/
      - echo "producao" > /app/share/aresta-editor/canal.txt
      # Native launcher
      - install -D -m755 editor/flatpak/EditorAresta.sh /app/bin/EditorAresta
      # Desktop integration
      - install -D -m644 editor/flatpak/com.arestaclimb.Editor.desktop /app/share/applications/com.arestaclimb.Editor.desktop
      - install -D -m644 editor/flatpak/com.arestaclimb.Editor.metainfo.xml /app/share/metainfo/com.arestaclimb.Editor.metainfo.xml
      - install -D -m644 editor/recursos/logo_app.png /app/share/icons/hicolor/512x512/apps/com.arestaclimb.Editor.png
    sources:
      - type: dir
        path: ../../editor
        dest: editor
        skip:
          - dist
          - build
          - .flatpak-builder
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../aresta_api
        dest: aresta_api
        skip:
          - .git
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../scripts
        dest: scripts
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../coleta_de_betas
        dest: coleta_de_betas
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../migracoes
        dest: migracoes
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../serving
        dest: serving
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: file
        path: ../../uv.lock
