app-id: com.arestaclimb.Editor
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: EditorAresta
default-branch: stable

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --env=XKB_LOG_LEVEL=critical

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1"
    BASEAPP_DISABLE_NUMPY: "1"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"
  # Compiladores LLVM/Clang e gerador C++ Shiboken herdados do io.qt.PySide.BaseApp (usados apenas em build-time)
  - /lib/libLLVM*
  - /lib/libclang*
  - /lib/libpyside6qml*
  - /bin/shiboken6*
  - /lib/python*/site-packages/shiboken6_generator*
  # Ferramentas de desenvolvimento, cabeçalhos e stubs do PySide6 desnecessários em runtime
  - /lib/python*/site-packages/PySide6/include
  - /lib/python*/site-packages/PySide6/glue
  - /lib/python*/site-packages/PySide6/typesystems
  - /lib/python*/site-packages/PySide6/*.pyi
  - /lib/python*/site-packages/PySide6/lupdate
  - /lib/python*/site-packages/PySide6/lrelease
  - /lib/python*/site-packages/PySide6/qmllint
  - /lib/python*/site-packages/PySide6/qmlformat
  - /lib/python*/site-packages/PySide6/qmlimportscanner
  - /lib/python*/site-packages/PySide6/qmltyperegistrar
  - /lib/python*/site-packages/PySide6/Assistant
  - /lib/python*/site-packages/PySide6/Designer
  - /lib/python*/site-packages/PySide6/Linguist
  # Submódulos do PySide6 não utilizados pelo Editor (mantemos QtCore, QtGui, QtWidgets, QtNetwork, QtSvg, QtSvgWidgets, QtDBus, QtPrintSupport, QtOpenGL*)
  - /lib/python*/site-packages/PySide6/Qt3D*
  - /lib/python*/site-packages/PySide6/QtQuick*
  - /lib/python*/site-packages/PySide6/QtQml*
  - /lib/python*/site-packages/PySide6/QtPdf*
  - /lib/python*/site-packages/PySide6/QtCharts*
  - /lib/python*/site-packages/PySide6/QtGraphs*
  - /lib/python*/site-packages/PySide6/QtDataVisualization*
  - /lib/python*/site-packages/PySide6/QtMultimedia*
  - /lib/python*/site-packages/PySide6/QtSpatialAudio*
  - /lib/python*/site-packages/PySide6/QtDesigner*
  - /lib/python*/site-packages/PySide6/QtHelp*
  - /lib/python*/site-packages/PySide6/QtLocation*
  - /lib/python*/site-packages/PySide6/QtPositioning*
  - /lib/python*/site-packages/PySide6/QtSensors*
  - /lib/python*/site-packages/PySide6/QtSerialPort*
  - /lib/python*/site-packages/PySide6/QtSerialBus*
  - /lib/python*/site-packages/PySide6/QtScxml*
  - /lib/python*/site-packages/PySide6/QtStateMachine*
  - /lib/python*/site-packages/PySide6/QtTextToSpeech*
  - /lib/python*/site-packages/PySide6/QtUiTools*
  - /lib/python*/site-packages/PySide6/QtWebChannel*
  - /lib/python*/site-packages/PySide6/QtWebSockets*
  - /lib/python*/site-packages/PySide6/QtHttpServer*
  - /lib/python*/site-packages/PySide6/QtRemoteObjects*
  - /lib/python*/site-packages/PySide6/QtBluetooth*
  - /lib/python*/site-packages/PySide6/QtNfc*
  - /lib/python*/site-packages/PySide6/QtTest*
  - /lib/python*/site-packages/PySide6/QtSql*
  - /lib/python*/site-packages/PySide6/QtXml*
  - /lib/python*/site-packages/PySide6/QtNetworkAuth*
  # Fontes de ícones do QtAwesome não utilizadas pelo tema do Editor (mantemos apenas FontAwesome)
  - /lib/python*/site-packages/qtawesome/fonts/*materialdesignicons*
  - /lib/python*/site-packages/qtawesome/fonts/*phosphor*
  - /lib/python*/site-packages/qtawesome/fonts/*remixicon*
  - /lib/python*/site-packages/qtawesome/fonts/*codicon*
  - /lib/python*/site-packages/qtawesome/fonts/*elusiveicons*

cleanup-commands:
  # Preserva o pacote 'packaging' (usado pelo Editor e QtPy) que o cleanup-BaseApp.sh desinstalaria por engano
  - sed -i '/pip uninstall -y packaging/d' /app/cleanup-BaseApp.sh
  - /app/cleanup-BaseApp.sh

modules:
  - pypi-dependencies.json

  - name: aresta-editor
    buildsystem: simple
    build-commands:
      # Editor's Python scripts
      - mkdir -p /app/share/aresta-editor
      - cp -r editor /app/share/aresta-editor/
      - cp -r aresta_api /app/share/aresta-editor/
      - cp -r scripts /app/share/aresta-editor/
      - cp -r coleta_de_betas /app/share/aresta-editor/
      - cp -r migracoes /app/share/aresta-editor/
      - cp -r serving /app/share/aresta-editor/
      - cp uv.lock /app/share/aresta-editor/
      - echo "producao" > /app/share/aresta-editor/canal.txt
      # Limpeza de testes unitários do pacote final
      - find /app/share/aresta-editor -name "*_test.py" -delete
      # Pré-compilação de bytecode Python (.pyc) para acelerar inicialização
      - python3 -m compileall -q /app/share/aresta-editor
      # Native launcher
      - install -D -m755 editor/flatpak/EditorAresta.sh /app/bin/EditorAresta
      # Desktop integration
      - install -D -m644 editor/flatpak/com.arestaclimb.Editor.desktop /app/share/applications/com.arestaclimb.Editor.desktop
      - install -D -m644 editor/flatpak/com.arestaclimb.Editor.metainfo.xml /app/share/metainfo/com.arestaclimb.Editor.metainfo.xml
      - install -D -m644 editor/recursos/logo_app.png /app/share/icons/hicolor/512x512/apps/com.arestaclimb.Editor.png
    sources:
      - type: dir
        path: ../../editor
        dest: editor
        skip:
          - dist
          - build
          - .flatpak-builder
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../aresta_api
        dest: aresta_api
        skip:
          - .git
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../scripts
        dest: scripts
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../coleta_de_betas
        dest: coleta_de_betas
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../migracoes
        dest: migracoes
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: dir
        path: ../../serving
        dest: serving
        skip:
          - __pycache__
          - "*.pyc"
          - "*_test.py"
      - type: file
        path: ../../uv.lock
